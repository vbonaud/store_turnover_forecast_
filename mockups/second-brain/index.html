<title>Sales Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: AI Sales Assistant shell (app bar, grey sidebar, white main). The project is the workspace.
   Tokens mirror the product's design. Light theme only, by design. */
:root {
  --primary: #003DA5; --primary-dark: #002D7A; --primary-light: #ECF3FF; --primary-lighter: #D1E2FF; --border-primary-light: #A7C6FC;
  --charcoal: #14171B; --slate: #3E4654; --steel: #6B7587; --snow: #FAFAFB;
  --light-gray: #E5E7EB; --gray: #D1D5DB; --border-default: #CACFD8; --surface: #F2F4F6; --white: #FFFFFF;
  --alert-bg: #FFF6DB; --alert-text: #523D00; --alert-accent: #FABB00; --alert-border: #F2DFA0;
  --ok-bg: #E5FFEF; --ok-text: #003D16; --ok-accent: #008530; --ok-border: #9FE4BC;
  --err-bg: #FFF1F0; --err-text: #510400; --err-accent: #DE1409; --err-border: #F6C3BF;
  --info-accent: #7115B2; --ink: #0B1B3B; --scrim: rgba(0, 0, 0, .45);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 23, 27, .06), 0 4px 16px rgba(20, 23, 27, .05);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, .25);
  --mont: "Montserrat", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --inter: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--charcoal); font: 14px/1.55 var(--inter); }
h1, h2, h3, h4 { font-family: var(--mont); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--steel); } .small { font-size: 12px; } .hint { font-size: 11.5px; color: var(--steel); }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--steel); }
.stack { display: grid; gap: 10px; }
.stack { grid-template-columns: minmax(0, 1fr); }
.table-wrap { max-width: 100%; overflow-x: auto; } .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* Shell */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--light-gray); padding: 10px 20px; }
.appbar__mark { width: 32px; height: 32px; border-radius: 7px; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.appbar__name { font-weight: 500; }
.appbar__spacer { flex: 1; }
.vbtn { border-color: #F3B4CF; color: #B0185A; }
.vbtn[aria-pressed="true"] { background: #FDE8F1; }
.npin { position: absolute; top: -11px; left: -11px; z-index: 5; width: 22px; height: 22px; border-radius: 50%; background: #D6246E; color: #fff; font: 700 11.5px/22px var(--inter); text-align: center; box-shadow: 0 0 0 3px #fff; pointer-events: none; }
.npin.static { position: static; display: inline-block; width: 18px; height: 18px; line-height: 18px; box-shadow: none; font-size: 10.5px; }
.noted { position: relative !important; outline: 2px dashed #E88BB2; outline-offset: 3px; border-radius: 10px; }
#vnotes { position: fixed; right: 16px; bottom: 16px; z-index: 15; width: 340px; max-width: calc(100% - 32px); max-height: 45vh; overflow: auto; background: var(--white); border: 1px solid #F3B4CF; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 14px 16px; }
#vnotes h3 { font-size: 14px; margin: 0 0 8px; color: #B0185A; }
#vnotes ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; font-size: 12.5px; }
#vnotes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
#vnotes li .npin { position: static; box-shadow: none; }
.notes-on .content { padding-bottom: 300px; }
.avatar { width: 34px; height: 34px; border-radius: 99px; background: linear-gradient(135deg, var(--info-accent), var(--primary)); color: var(--white); display: grid; place-items: center; font: 700 12px var(--mont); flex: none; }
.avatar.sm { width: 28px; height: 28px; font-size: 10.5px; border: 2px solid var(--white); }
.avatars { display: inline-flex; } .avatars .avatar + .avatar { margin-left: -8px; }
.av2 { background: linear-gradient(135deg, #008530, #003DA5); } .av3 { background: linear-gradient(135deg, #DE1409, #7115B2); } .av4 { background: linear-gradient(135deg, #FABB00, #DE1409); }
.sidebar { background: var(--surface); border-right: 1px solid var(--light-gray); padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.navitem { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--slate); font-size: 13px; }
.navitem svg.i { color: var(--steel); }
.navitem:hover:not(:disabled) { background: var(--white); box-shadow: var(--shadow); }
.navitem[aria-current="true"] { background: var(--white); color: var(--primary); font-weight: 600; border-color: var(--primary); box-shadow: var(--shadow); }
.navitem[aria-current="true"] svg.i { color: var(--primary); }
.navitem:disabled { opacity: .45; }
.navitem .count { margin-left: auto; font-size: 11px; color: var(--steel); }
.navsep { height: 1px; background: var(--light-gray); margin: 10px 6px; }
.navnote { font-size: 11px; color: var(--steel); padding: 2px 11px 8px; }
.navtoggle { display: none; }
.main { min-width: 0; overflow-y: auto; background: var(--white); }
.content { padding: 24px 28px 64px; max-width: 1240px; }
.crumb { font-size: 12px; color: var(--steel); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb button { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.pagehead h1 { font-size: 22px; }
.pagehead .sub { color: var(--slate); font-size: 13px; margin-top: 6px; max-width: 760px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mock-note { display: inline-flex; font-size: 11.5px; color: var(--steel); background: var(--snow); border: 1px dashed var(--border-default); border-radius: 99px; padding: 3px 10px; margin-bottom: 16px; }
.section { margin-top: 26px; }
.section-title { font: 700 16px var(--mont); }

/* Primitives */
.btn { border-radius: 999px; padding: 9px 17px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-primary-light); background: var(--white); color: var(--primary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--primary-light); }
.btn.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn:disabled { background: var(--gray); border-color: var(--gray); color: var(--white); }
.btn.plain { color: var(--slate); border-color: var(--border-default); }
.btn.plain:hover:not(:disabled) { background: var(--surface); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; padding: 2px 4px; border-radius: 6px; }
.card { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-hd { padding: 13px 16px; border-bottom: 1px solid var(--light-gray); font: 600 14px var(--mont); display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.card-hd .aside { font: 400 12px var(--inter); color: var(--steel); }
.card-hd > .aside { white-space: normal; min-width: 0; text-align: right; }
.pad { padding: 16px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.pill.warn { background: var(--alert-bg); color: var(--alert-text); border-color: var(--alert-border); }
.pill.bad { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
.pill.info { background: var(--primary-light); color: var(--primary); border-color: var(--border-primary-light); }
.pill.solid { background: var(--primary); color: var(--white); border-color: var(--primary); }
.pill.neutral { background: var(--surface); color: var(--steel); border-color: var(--light-gray); }
.chip { font-size: 11.5px; font-weight: 600; color: var(--slate); background: var(--surface); border: 1px solid var(--light-gray); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.callout { border-radius: 8px; padding: 12px 14px; border-left: 4px solid; font-size: 13px; }
.callout.info { background: var(--primary-light); border-color: var(--primary); color: #0D2F6B; }
.callout.ok { background: var(--ok-bg); border-color: var(--ok-accent); color: var(--ok-text); }
.callout.warn { background: var(--alert-bg); border-color: var(--alert-accent); color: var(--alert-text); }
.empty { border: 1px dashed var(--border-default); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--steel); font-size: 13px; background: var(--snow); }
.field { display: grid; gap: 5px; }
.field label, .flabel { font-size: 12px; font-weight: 600; color: var(--slate); }
.field input, .field select, .field textarea, .search { border: 1px solid var(--border-default); background: var(--white); border-radius: 8px; padding: 9px 11px; width: 100%; font-size: 13px; }
.field textarea { resize: vertical; min-height: 74px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--border-primary-light); border-color: var(--primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--primary); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 13px; padding: 9px 18px; border-radius: 8px 8px 0 0; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--white); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--steel); }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--primary); box-shadow: var(--shadow); }
.table-wrap { overflow-x: auto; border: 1px solid var(--light-gray); border-radius: var(--radius); background: var(--white); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
th { text-align: left; font: 600 11.5px var(--mont); color: var(--slate); text-transform: uppercase; letter-spacing: .4px; padding: 9px 12px; background: var(--snow); border-bottom: 1px solid var(--light-gray); }
td { padding: 11px 12px; border-bottom: 1px solid var(--light-gray); vertical-align: top; color: var(--slate); }
tr:last-child td { border-bottom: 0; }

/* Home */
.welcome { text-align: center; padding: 6px 0 18px; }
.welcome h1 { font-size: 28px; font-weight: 600; display: inline-flex; align-items: center; gap: 12px; }
.welcome .spark .i { width: 26px; height: 26px; color: var(--primary); }
.welcome p { max-width: 720px; margin: 8px auto 0; color: var(--slate); }
.projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.projcard { border: 1px solid var(--light-gray); border-radius: 14px; background: var(--white); box-shadow: var(--shadow); padding: 16px 17px; text-align: left; display: grid; gap: 9px; align-content: start; transition: transform .18s ease, box-shadow .18s ease; }
.projcard:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(20, 23, 27, .10); }
.projcard .nm { font: 700 16px var(--mont); }
.pcwrap { position: relative; display: grid; }
.pcmenu { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 28px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--slate); font-size: 18px; line-height: 1; }
.pcmenu:hover, .pcmenu[aria-expanded="true"] { background: var(--surface); border-color: var(--light-gray); }
.cardpop { position: absolute; right: 10px; bottom: 44px; z-index: 6; min-width: 190px; background: var(--white); border: 1px solid var(--light-gray); border-radius: 10px; box-shadow: 0 10px 28px rgba(20, 23, 27, .16); padding: 6px; display: grid; }
.cardpop button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 7px; font-size: 13px; color: var(--charcoal); }
.cardpop button:hover, .cardpop button:focus-visible { background: var(--surface); }
.cardpop .danger, .linkdanger { color: var(--err-accent); }
.cardpop hr { border: 0; border-top: 1px solid var(--light-gray); margin: 4px 0; }
.btn.linkdanger-btn { color: var(--err-accent); border-color: var(--err-border); }
.iconbtn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--steel); font-size: 12px; flex: none; }
.iconbtn:hover, .iconbtn:focus-visible { background: var(--err-bg); color: var(--err-accent); border-color: var(--err-border); }
.chip .i { width: 14px; height: 14px; vertical-align: -2px; }
.btn.danger { background: var(--err-accent); border-color: var(--err-accent); color: var(--white); }
.btn.danger:hover:not(:disabled) { background: #B31007; }
.linkdanger { border: 0; background: none; font-weight: 600; font-size: 13px; padding: 0; }
.projcard .goal { font-size: 13px; color: var(--slate); min-height: 40px; }
.projcard.new { border: 1px dashed var(--border-primary-light); background: linear-gradient(180deg, #F7FAFF, var(--white)); place-items: center; text-align: center; color: var(--primary); min-height: 180px; }
.projcard.new .plus { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: var(--white); display: grid; place-items: center; }
.toolgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.toolcard { border: 1px solid var(--surface); border-radius: 16px; background: var(--white); box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; opacity: .6; }
.toolcard__head { background: var(--surface); border-radius: 10px; padding: 14px; }
.toolcard__ico { width: 36px; height: 36px; border-radius: 7px; background: var(--white); border: 2px solid var(--steel); display: grid; place-items: center; color: var(--steel); margin-bottom: 10px; }
.toolcard__head h3 { font-size: 17px; margin-bottom: 4px; }
.toolcard__head p { font-size: 12.5px; color: var(--slate); }
.toolcard__cta { padding: 10px 6px 4px; }
.toolcard__cta .btn { width: 100%; justify-content: center; }
.toolcard.live { opacity: 1; }
.toolcard.live .toolcard__head { background: var(--primary-light); }
.toolcard.live .toolcard__ico { border-color: var(--primary); color: var(--primary); }
.feats { list-style: none; margin: 0; padding: 4px 8px; display: grid; }
.feats li { display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--light-gray); }
.feats li .i { color: #0A7A3B; width: 16px; height: 16px; flex: none; }
.toolcard__ctx { font-size: 11.5px; color: var(--steel); padding: 8px 8px 0; }
.bpick { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--light-gray); border-radius: 10px; padding: 13px 16px; cursor: pointer; background: var(--white); }
.bpick:has(input:checked) { background: var(--primary-light); border-color: var(--primary); }
.bpick input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--primary); flex: none; }
.bpick b { font-weight: 700; font-size: 13.5px; }
.bpick[hidden] { display: none; }
.field label.bpick { font-weight: 400; font-size: 13px; color: var(--charcoal); }
.launch { display: grid; gap: 10px; }
[hidden] { display: none !important; }
:root { --de: #0B6E78; --de-bg: #E3F4F5; --de-border: #A9DCE0; --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --ya: #8A93A3; --pc: #5B3FA0; --pc-bg: #F4EFFC; --pc-border: #D6C8F2; }
.srctag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
.srctag .i { width: 13px; height: 13px; }
.srctag.kb { color: var(--primary); background: var(--primary-light); border-color: var(--border-primary-light); }
.srctag.de { color: var(--de); background: var(--de-bg); border-color: var(--de-border); }
.card.dcard { border-color: var(--de-border); }
.card.dcard > .card-hd { background: var(--de-bg); color: var(--de); }
.srcmini { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; }
.srcmini .i { width: 12px; height: 12px; }
.srcmini.de { color: var(--de); } .srcmini.kb { color: var(--primary); } .srcmini.pc { color: var(--pc); }
.qhd { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.qhd p { margin: 2px 0 0; }
.explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.src3 { border: 1px solid; border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.src3 b { font: 700 15px var(--mont); }
.src3 .q { font-size: 12.5px; font-style: italic; }
.src3.de { border-color: var(--de-border); background: var(--de-bg); color: #0A3F45; } .src3.de b { color: var(--de); }
.src3.kb { border-color: var(--border-primary-light); background: var(--primary-light); color: #0D2F6B; } .src3.kb b { color: var(--primary); }
.src3.pc { border-color: var(--pc-border); background: var(--pc-bg); color: #3A2470; } .src3.pc b { color: var(--pc); }
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.skills2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 900px) { .skills, .skills2 { grid-template-columns: minmax(0, 1fr); } }
.skill { border: 1px solid var(--light-gray); border-radius: 14px; background: var(--white); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 6px; align-content: start; position: relative; }
.skill .step { font: 700 11px var(--inter); letter-spacing: .04em; text-transform: uppercase; color: var(--primary); }
.skill b { font: 700 16px var(--mont); }
.skill .sico { width: 34px; height: 34px; border-radius: 9px; background: var(--primary-light); color: var(--primary); display: grid; place-items: center; }
.skill.small { grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; box-shadow: none; }
.skill .cpname { font-size: 11.5px; color: var(--steel); }
.slides { display: grid; gap: 10px; counter-reset: sl; }
.slide { border: 1px solid var(--light-gray); border-radius: 12px; background: var(--white); padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.slide .sn { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font: 700 13px var(--inter); color: var(--slate); }
.slide .ev { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.setup { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; border: 1px solid var(--border-primary-light); background: var(--primary-light); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.setup b { font-weight: 600; }
.hometools .feats, .hometools .toolcard__ctx { display: none; }
.hometools .toolcard__head { padding: 12px 14px; }
button.src3 { text-align: left; cursor: pointer; font: inherit; }
button.src3:hover { box-shadow: var(--shadow); }
.soongrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.soon { border: 1px dashed var(--border-default); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; background: var(--snow); align-content: start; }
.soon b { font: 700 15px var(--mont); }
.gsteps { display: grid; gap: 8px; }
.gstep { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.gstep .tick { width: 22px; height: 22px; }
.moment { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--light-gray); }
.moment:last-child { border-bottom: 0; }
/* Assistant workspace: chats | conversation | files and context (Cowork-style) */
.app.wsmode { grid-template-columns: 64px minmax(0, 1fr); }
.app.wsmode .sidebar { padding: 14px 8px; }
.app.wsmode .sidebar .navitem { font-size: 0; justify-content: center; padding: 10px 0; gap: 0; }
.app.wsmode .sidebar .navitem .count { display: none; }
.app.wsmode .main { overflow: hidden; }

  const [tgt, g0] = PERF_SET[key] || [(1.5 + rnd(key, "t") * 9) * 1e6, (rnd(key, "g") - .45) * .12];
  const prods = productsOf(cat), wts = prods.map(p => .4 + rnd(p.name + cust, "w")), sw = wts.reduce((a, b) => a + b, 0) || 1;
  return SERIES[key] = prods.map((p, j) => {
    const g = g0 + (rnd(p.name + cust, "g") - .5) * .08, ph = rnd(p.name, "p") * 52, base = tgt / 13 * wts[j] / sw;
    const val = t => base * (1 + .12 * Math.sin(2 * Math.PI * (t + ph) / 52)) * Math.exp(g * (t - (LASTW - 6)) / 52) * (1 + (rnd(p.name + cust, t) - .5) * .16) * (rnd(key, "promo" + t) > .9 ? 1.25 : 1);
    return { ...p, cust, s: PW.map((_, i) => val(i)), y: PW.map((_, i) => val(i - 52)) };
  });
}

function inlineForm(title, fields, onSave, saveLabel = "Save") {
  const box = document.createElement("div"); box.className = "dlg";
  box.innerHTML = `<div style="position:fixed;inset:0;background:var(--scrim);z-index:20;display:grid;place-items:center;padding:16px" data-close>
    <form class="card" style="width:100%;max-width:520px;max-height:90vh;overflow:auto" role="dialog" aria-modal="true"><div class="card-hd">${title}</div><div class="pad stack">${fields}
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn plain" data-cancel>${onSave ? "Cancel" : "Close"}</button>${onSave ? `<button class="btn primary" type="submit">${saveLabel}</button>` : ""}</div></div></form></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.querySelector("[data-cancel]").onclick = close;
  box.querySelector("[data-close]").addEventListener("click", e => { if (e.target.hasAttribute("data-close")) close(); });
  box.addEventListener("keydown", e => {
    if (e.key === "Escape") close();
    if (e.key === "Tab") { const f = [...box.querySelectorAll("button, input, select, textarea, [href]")].filter(x => !x.disabled && x.getClientRects().length); const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  });
  box.querySelector("form").addEventListener("submit", e => { e.preventDefault(); if (!onSave) return; if (onSave(new FormData(e.target)) !== false) close(); });
  (box.querySelector("input, select, textarea") || box.querySelector("[data-cancel]")).focus();
  return box;
}

    case "allsrc": state.allsrc = true; render(); break;
    case "install": state.gs.pinned = true; render(); toast("In the live tool this installs the assistant as a desktop app you can pin to your taskbar."); break;
    case "notify": state.notify[v] = !state.notify[v]; render(); toast(state.notify[v] ? `We'll tell you when ${v} is ready for you.` : `No more updates about ${v}.`); break;
    case "xls": toast(`In the live tool this downloads sales by customer, category and product for ${PERIODS[state.per]} as an Excel file, already sorted.`); break;
    case "sharebuyer": inlineForm("Share with the buyer", `<p class="small">A one-page, customer-safe view of the risk, ready to send. Numbers come from the Decision Engine, with no internal targets or margins.</p>
      <div class="card dcard"><div class="pad stack"><b>${esc(v)}</b><div class="tiles"><div class="tile"><span class="tl">Stock cover</span><span class="tv">1.2 weeks</span><span class="td"><b class="down-bad">Order risk</b> before Black Friday</span></div><div class="tile"><span class="tl">Suggested order</span><span class="tv">2,400 units</span><span class="td">to reach 4 weeks of cover</span></div></div><span class="hint">${srcMini("de")} Calculated · data up to ${PW[LASTW]}</span></div></div>`, () => { toast("In the live tool this sends the one-pager or adds it to your next customer deck."); }, "Send to buyer"); break;
    case "reqcust": inlineForm("Request a customer", `<p class="small">Not finding your customer? Your customer team lead sets it up, usually within a week.</p>
      <div class="field"><label for="rq-n">Customer</label><input id="rq-n" name="n" required placeholder="e.g. Metro"></div>
      <div class="field"><label for="rq-m">Market</label><select id="rq-m" name="m">${KB_MARKETS.map(x => `<option>${x}</option>`).join("")}</select></div>
      <div class="field"><label for="rq-w">Why you need it (optional)</label><input id="rq-w" name="w" placeholder="e.g. I prepare the yearly negotiation with them"></div>`, fd => { toast(`Request sent for ${fd.get("n").trim()} (${fd.get("m")}). You'll get an email when it's set up.`); }, "Send request"); break;
    case "cpchip": state.cp = [...(state.cp.length ? state.cp : cpSeed()), { me: v.startsWith("@") ? v : `@AI Sales Assistant ${v.charAt(0).toLowerCase() + v.slice(1)}`, ...cpTurn(v) }]; render(); break;
    case "cpreset": state.cp = []; state.cpFix = {}; render(); break;
    case "cpfix": state.cpFix = { ...(state.cpFix || {}), [v]: true }; render(); toast("In the live tool this edits the slide in the deck. Undo is in PowerPoint."); break;
    case "cpopen": { const mm = p.meetings.find(x => x.id === el.dataset.m) || nextMeeting(p); state.cp = [{ me: "@Selling Coach review this deck", kind: "coach", pid: p.id, mid: mm.id }]; state.gs.pinned = true; go("copilot"); break; }
    case "cptry": state.gs.pinned = true; go("copilot"); break;
    case "wschat": state.chat = v; state.wsPane = ""; render(); break;
    case "wsnew": { const id = "C" + (CHATS.length + 1 + Math.floor(Math.random() * 1e4)); CHATS.unshift({ id, title: "New chat", pid: state.view === "ws" ? chatOf().pid : (state.pid || null), when: "Today", turns: [] }); state.chat = id; state.wsPane = ""; go("ws"); break; }
    case "wsopen": { const ex = CHATS.find(x => x.pid === p.id); if (ex) state.chat = ex.id; else { const id = "C" + (CHATS.length + 1 + Math.floor(Math.random() * 1e4)); CHATS.unshift({ id, title: "New chat", pid: p.id, when: "Today", turns: [] }); state.chat = id; } go("ws"); break; }
    case "wstab": state.wsTab = v; render(); break;
    case "wspane": state.wsPane = v; render(); break;
    case "wsskill": { if (state.view !== "ws") { go("ws"); } const i = $(".wsbox input[name=q]"); if (i) { i.value = v; i.focus(); } break; }
    case "wssend": wsSend(v); break;
    case "wsopenfile": toast("In the live tool this opens the file in Office, next to the chat."); break;
    case "follow": { const on = isF(v); state.follow = on ? state.follow.filter(x => x !== v) : [...state.follow, v]; render(); toast(on ? "Unfollowed. It no longer appears in What changed on Home." : "Following. Its changes now appear on Home."); break; }
    case "fb": if (v === "wrong") { toast("Use the source link next to the fact: the knowledge bank team corrects facts by fixing or replacing the document."); break; }
      state.fb[state.ask] = v; render(); toast(v === "up" ? "Thanks. Useful answers help tune what the assistant shows first." : "Thanks. Unhelpful answers are reviewed by the knowledge bank team."); break;
    case "cat": state.gtab = "numbers"; go("category", { cat: v, mkt: el.dataset.k || state.mkt }); break;
    case "mkt": state.mkt = v; render(); break;
    case "copilot": toast(`In the live tool this opens Copilot to summarise what your emails, chats and meetings say about ${v}.`); break;
    case "buyer": state.gs.buyers = true; go("buyer", { bid: v }); break;
    case "ask": state.allsrc = false; go("ask", { ask: v, askCust: el.dataset.k || "" }); break;
    case "newcust": state.w = blankW(); state.w.cust = v; state.pendingTool = null; go("new"); break;
    case "wiq": state.wiq = !state.wiq; render(); toast(state.wiq ? "Personal context on. Only counts of related items are shown, nothing is stored." : "Personal context off. Nothing personal is looked at."); break;
    case "ctxtab": go("project", { pid: p.id, tab: "context" }); break;
    case "c-min": { const c = ctxTarget(); c.minutes = Math.max(5, c.minutes + +v); $("#c-min").value = c.minutes; ctxChanged(); break; }
    case "c-sc": state.scOpen = !state.scOpen; render(); $('[data-a="c-sc"]').focus(); break;
    case "mc-toggle": state.mcOpen = !state.mcOpen; render(); $('[data-a="mc-toggle"]').focus(); break;
    case "ctx-discard": state.cdraft = clone(p.mc); render(); toast("Changes discarded."); break;
    case "ctx-save": { if (!ctxDirty()) { toast("No changes to save."); break; }
      const c = clone(state.cdraft); c.context = c.context.trim(); p.mc = { ...c, v: p.mc.v + 1, updated: TODAY }; state.cdraft = clone(p.mc);
      log(p, `updated the meeting context (version ${p.mc.v})`); render(); toast(`Saved. Every skill in this project now starts from it.`); break; }
    case "hometool": state.navOpen = false; renderNav(); pickProject(v); break;
    case "pickproj": { const q = proj(v); go("project", { pid: v, tab: "overview" }); launchTool(q, el.dataset.k); break; }
    case "newfor": state.w = blankW(); state.pendingTool = v; go("new"); break;
    case "w-back": w.step--; render(); break;
    case "w-next": { const err = $("#w-err"), cust = w.cust === "__other" ? w.custOther.trim() : w.cust;
      if (w.step === 0 && (!w.name.trim() || !cust)) { err.hidden = false; err.textContent = !w.name.trim() ? "Give the project a name." : "Choose the customer."; return; }
      if (w.step === 0 && w.mc.cats.length <= 1) w.mc.cats = [w.cat];
      if (w.step === 1 && !w.mc.titlesSet) { w.mc.titles = [...new Set(w.buyers.map(buyer).map(b => b.role))]; }
      if (w.step === 2) { w.mc.titlesSet = true; w.mObj = w.mc.obj; w.mMin = w.mc.minutes; }
      w.step++; render(); $("#main").scrollTop = 0; break; }
    case "w-create": { const cust = w.cust === "__other" ? w.custOther.trim() : w.cust;
      if (w.cust === "__other" && !CUSTOMERS.includes(cust)) CUSTOMERS.push(cust);
      const np = { id: "P" + Date.now(), name: w.name.trim(), cust, market: w.market, cat: w.cat, audience: w.audience, status: "Active", objective: w.objective.trim() || "No objective set yet.", updated: TODAY,
        buyers: [...w.buyers], mc: (({ titlesSet, ...c }) => ({ ...clone(c), context: c.context.trim(), v: 1, updated: TODAY }))(w.mc), sessions: [], meetings: [], files: [], activity: [[TODAY, "VB", "created the project"]] };
      if (w.withMeeting && w.mTitle.trim()) np.meetings.push({ id: "M" + Date.now(), title: w.mTitle.trim(), date: w.mDate.trim(), obj: +w.mObj, minutes: +w.mMin || 30, attendees: pbuyers(np).map(b => b.name), status: w.mDate.trim() ? "Preparing" : "Not scheduled", decks: w.deck ? [{ v: 1, name: w.deck, uploaded: TODAY, by: "VB", slides: 16, result: null }] : [], notes: "" });
      PROJECTS.unshift(np); state.w = null; go("project", { pid: np.id, tab: "overview" }); toast("Project created. This is now your workspace for " + cust + "."); if (state.pendingTool) { const k = state.pendingTool; state.pendingTool = null; launchTool(np, k); } break; }
  }
});
function wsSend(q) {
  const c = chatOf(); c.turns.push({ me: q, ...cpTurn(q) });
  if (c.title === "New chat") { const t = q.replace(/^@(Selling Coach|Role-play|\S+)\s*/, ""); c.title = (t.charAt(0).toUpperCase() + t.slice(1)).slice(0, 42) || "New chat"; }
  c.when = "Today"; render();
}
document.addEventListener("submit", e => {
  if (e.target.matches(".wsbox")) { e.preventDefault(); const q = e.target.q.value.trim(); if (!q) { e.target.q.focus(); return; } wsSend(q); return; }
  if (e.target.matches(".cpbox")) { e.preventDefault(); const q = e.target.q.value.trim(); if (!q) return; state.cp = [...(state.cp.length ? state.cp : cpSeed()), { me: q.startsWith("@") ? q : `@AI Sales Assistant ${q}`, ...cpTurn(q) }]; render(); return; }
  if (e.target.matches(".findbox")) { e.preventDefault(); const q = e.target.q.value.trim().toLowerCase(); if (!q) { e.target.q.focus(); return; }
    const hit = findItems().find(x => x[0].toLowerCase() === q) || findItems().find(x => x[0].toLowerCase().includes(q));
    if (!hit) { const q0 = e.target.q.value.trim(), id = "C" + (CHATS.length + 1 + Math.floor(Math.random() * 1e4)); CHATS.unshift({ id, title: "New chat", pid: null, when: "Today", turns: [] }); state.chat = id; go("ws"); wsSend(q0); return; }
    if (hit[1] === "customer") { state.ctab = "numbers"; go("customer", { cust: hit[2], cat: state.cat, mkt: kbOf(hit[2]).market || state.mkt }); }
    else if (hit[1] === "buyer") go("buyer", { bid: hit[2] });
    else { state.gtab = "numbers"; go("category", { cat: hit[2], mkt: Object.keys(CATKB).find(mk => CATKB[mk][hit[2]]) || state.mkt }); }
    return; }
  if (!e.target.matches(".askbox")) return; e.preventDefault();
  const q = e.target.q.value.trim(); if (!q) { e.target.q.focus(); return; }
  go("ask", { ask: q, askCust: e.target.dataset.askcust || "" });
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.w && !t.matches("select")) { state.w[t.dataset.w] = t.type === "number" ? +t.value : t.type === "date" ? fromISO(t.value) : t.value; if (["name", "objective", "mTitle", "mDate", "custOther"].includes(t.dataset.w)) refreshPreview(); }
  if (t.dataset.c && (t.matches("textarea") || t.type === "number")) { const c = ctxTarget(); if (!c) return; if (t.dataset.c === "minutes") c.minutes = Math.max(5, +t.value || 5); else c[t.dataset.c] = t.value; ctxChanged(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-wsproj]")) { chatOf().pid = t.value || null; render(); toast(t.value ? `Project attached: its deck, documents and meeting details are now this chat's inputs.` : "No project: answers use all company knowledge."); return; }
  if (t.dataset.w && t.matches("select")) { if (t.dataset.w === "cust") state.w.buyers = []; state.w[t.dataset.w] = t.dataset.w === "mObj" ? +t.value : t.value; if (t.hasAttribute("data-rr")) render(); else refreshPreview(); }
  if (t.dataset.c && !t.matches("textarea") && t.type !== "number") {
    const c = ctxTarget(), k = t.dataset.c; if (!c) return;
    if (k === "cats" || k === "titles" || k.startsWith("sc.")) {
      const arr = k.startsWith("sc.") ? c.sc[k.slice(3)] : c[k], i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value); if (!t.checked && i >= 0) arr.splice(i, 1);
      if (k === "titles" && state.view === "new") c.titlesSet = true;
      if (k.startsWith("sc.")) $("#c-sc").value = scText(c.sc);
    } else if (k === "ai") c.ai = t.value === "1";
    else if (k === "obj") { c.obj = +t.value; $(".objdesc").innerHTML = `<b>Description:</b> ${esc(OBJ_DESC[c.obj])}`; }
    else c[k] = t.value;
    ctxChanged();
  }
  if (t.dataset.src) { state.src[t.dataset.src] = t.checked; render(); toast(`${PSRC[t.dataset.src][1]}: ${t.checked ? "on" : "off"}.`); }
  if (t.dataset.sf) { state.sf[t.dataset.sf] = t.value || null; render(); }
  if (t.dataset.af) { state.af[t.dataset.af] = t.value || null; if (t.dataset.af === "mkt") state.af.cust = null; render(); }
  if (t.dataset.filectx !== undefined) { const p = proj(state.pid), f = p.files[+t.dataset.filectx]; f.ctx = t.checked; log(p, `${f.ctx ? "will use" : "stopped using"} ${f.name} in feedback`); toast(f.ctx ? `${f.name} will be used in feedback.` : `${f.name} is no longer used in feedback.`); }
  if (t.dataset.pick && state.w) { const id = t.dataset.pick; state.w.buyers = t.checked ? [...state.w.buyers, id] : state.w.buyers.filter(x => x !== id); render(); }
  if (t.dataset.up && t.files && t.files[0]) {
    const name = t.files[0].name;
    if (t.dataset.up === "deck") addDeck(name);
    if (t.dataset.up === "wsfile") { const c = chatOf(); c.extra = [...(c.extra || []), name]; state.wsTab = "files"; render(); toast(`${name} added to this chat.`); }
    if (t.dataset.up === "wdeck") { if (!/\.(pptx?|pdf)$/i.test(name)) { toast("Upload a PPTX or PDF file."); return; } state.w.deck = name; render(); }
    if (t.dataset.up === "file") { const p = proj(state.pid), ext = name.split(".").pop().toLowerCase(); p.files.unshift({ name, kind: /xls|csv/.test(ext) ? "xls" : /doc|pdf|txt/.test(ext) ? "doc" : "ppt", added: TODAY, by: "VB" }); log(p, `added ${name}`); render(); toast(`${name} added to the project.`); }
  }
});
document.addEventListener("keydown", e => {
  if (e.target.matches('[role="tab"]') && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const t = [...document.querySelectorAll('[role="tab"]')], i = t.indexOf(e.target), n = t[(i + (e.key === "ArrowRight" ? 1 : -1) + t.length) % t.length]; if (n.dataset.a === "tab") state.tab = n.dataset.v; else state[n.dataset.a] = n.dataset.v; render(); $(`[role="tab"][data-a="${n.dataset.a}"][data-v="${n.dataset.v}"]`).focus(); return; } if (e.key === "Escape" && state.menu) { const v = state.menu; state.menu = null; render(); document.querySelector(`.pcmenu[data-v="${v}"]`)?.focus(); return; } if (e.key === "Enter" && e.target.matches(".dropzone")) { e.preventDefault(); e.target.querySelector("input")?.click(); } });
function refreshPreview() { const pv = $(".preview"); if (!pv || state.view !== "new") return; const tmp = document.createElement("div"); tmp.innerHTML = V.new(); pv.replaceWith(tmp.querySelector(".preview")); }

render();
</script>
