<title>Knowledge Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left rail (Prepare · Knowledge) + main workspace; detail opens in a right-hand drawer. Collapses to a top bar under 820px. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --sunken: #eaeeec;
  --line: #d8dfdc;
  --fg: #17211d;
  --muted: #5b6863;
  --accent: #1f6b57;
  --accent-soft: #dcede7;
  --accent-fg: #ffffff;
  --ok: #2e7d4f;   --ok-soft: #e1f2e7;
  --warn: #9a6500; --warn-soft: #fbefd6;
  --bad: #b3372b;  --bad-soft: #f9e2df;
  --info: #3659a8; --info-soft: #e3e9f7;
  --mark: #fff0b3;
  --shadow: 0 8px 30px rgba(20, 40, 32, .14);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --sunken: #0d1311; --line: #2a3531;
    --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
    --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;
    --bad: #f08c80; --bad-soft: #3d1c18; --info: #8fb0f5; --info-soft: #1c2742;
    --mark: #4a3f12; --shadow: 0 8px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --sunken: #0d1311; --line: #2a3531;
  --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
  --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;
  --bad: #f08c80; --bad-soft: #3d1c18; --info: #8fb0f5; --info-soft: #1c2742;
  --mark: #4a3f12; --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, select:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 2px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }

/* Rail */
.rail { background: var(--sunken); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 700 14px var(--f-display); flex: none; }
.brand b { font: 700 16px var(--f-display); display: block; }
.brand small { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .label { padding: 0 10px 4px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface); color: var(--fg); }
.nav button[aria-current="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { font: 500 11px var(--f-mono); color: var(--muted); }
.badge { font: 600 11px var(--f-mono); color: var(--bad); background: var(--bad-soft); border-radius: 999px; padding: 0 7px; }
.rail-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.rail-foot div { font-size: 12px; line-height: 1.3; }

/* Main */
.main { min-width: 0; overflow-y: auto; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.topbar h1 { font-size: 22px; }
.topbar p { margin-top: 4px; color: var(--muted); max-width: 66ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 7px; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 4px; white-space: normal; text-align: left; }
.content { padding: 20px 28px 48px; }
.mock-note { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); background: var(--sunken); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pad { padding: 14px 16px; }
.section-title { font-size: 16px; margin-bottom: 10px; }
.section { margin-top: 24px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.summary > button, .summary > div { background: var(--surface); padding: 14px 16px; border: 0; text-align: left; }
.summary > button:hover { background: var(--bg); }
.summary .num { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; }
.summary .sub { font-size: 12px; color: var(--muted); }

/* Pills, tags, badges */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.info { color: var(--info); background: var(--info-soft); }
.pill.neutral { color: var(--muted); background: var(--sunken); }
.tag { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.type { font: 600 11px var(--f-mono); letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; }
.gov { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 11px; white-space: nowrap; color: var(--muted); }
.gov span { padding: 1px 7px; display: inline-flex; gap: 4px; align-items: center; }
.gov span + span { border-left: 1px solid var(--line); }
.gov b { font-weight: 600; }
.gov .t-certified b { color: var(--ok); } .gov .t-reviewed b { color: var(--info); } .gov .t-stated b { color: var(--fg); }
.gov .s-external b { color: var(--ok); } .gov .s-internal b { color: var(--info); } .gov .s-restricted b { color: var(--bad); }
.gov .v-private b { color: var(--warn); }
.facet { font: 500 11px var(--f-mono); color: var(--muted); word-break: break-all; }

/* Home */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.mix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mix-row { display: grid; grid-template-columns: 100px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.mix-row .bar { height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.mix-row .bar i { display: block; height: 100%; border-radius: 4px; }
.mix-row .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; }
.matrix-wrap { overflow-x: auto; }
.matrix { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 520px; }
.matrix th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 4px 6px; }
.matrix td { padding: 0; }
.cell { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; text-align: left; display: grid; gap: 4px; min-height: 62px; }
.cell:hover { border-color: var(--accent); }
.cell .n { font: 600 16px var(--f-display); font-variant-numeric: tabular-nums; }
.cell.empty { color: var(--muted); background: none; border-style: dashed; }
.cell.l1 { background: var(--accent-soft); }
.cell.l2 { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.cell.l3 { background: color-mix(in srgb, var(--accent) 32%, var(--surface)); }
.todo { display: grid; gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.todo button { background: var(--surface); border: 0; text-align: left; padding: 12px 14px; display: grid; gap: 4px; }
.todo button:hover { background: var(--bg); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 10px; width: 240px; max-width: 100%; }
.select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.scope-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 16px; }
.scope-filters .col { display: grid; gap: 6px; align-content: start; }
.scope-filters .select { width: 100%; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* Fact list */
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
.fact:hover { border-color: var(--muted); }
.fact + .fact { margin-top: 8px; }
.fact .statement { font-size: 15px; font-weight: 500; max-width: 80ch; }
.fact.dim { opacity: .62; }
.fact-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.empty-state { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }

/* Briefings */
.briefings { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.blist { display: grid; gap: 6px; }
.bitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 11px 13px; display: grid; gap: 5px; }
.bitem:hover { border-color: var(--muted); }
.bitem[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.bitem.virtual { border-style: dashed; }
.bitem strong { font: 600 14px var(--f-display); }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; display: grid; gap: 16px; }
.doc h2 { font-size: 20px; }
.doc h3 { font-size: 14px; margin-top: 4px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 78ch; }
.anchor { font: 600 10px var(--f-mono); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 3px; padding: 0 4px; vertical-align: 1px; }
button.anchor:hover { background: var(--accent); color: var(--accent-fg); }
.refs { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--warn); }

/* Search */
.ask { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.ask form { display: grid; gap: 12px; }
.pipeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pipeline div { background: var(--surface); padding: 10px 14px; }
.pipeline b { font: 600 18px var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.answer { display: grid; gap: 10px; }
.answer ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.ftable { width: 100%; border-collapse: collapse; min-width: 720px; }
.ftable th, .ftable td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
.ftable th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
.ftable tr:last-child td { border-bottom: 0; }
.ftable td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; }
.ftable .gov { flex-wrap: nowrap; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; text-align: left; }
.chip:hover { border-color: var(--accent); }
.linkish { border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.linkish:hover { color: var(--accent); text-decoration: underline; }

/* Sources & runs */
.stbl { width: 100%; border-collapse: collapse; min-width: 900px; }
.stbl.narrow { min-width: 620px; }
.stbl th, .stbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stbl th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
.stbl tbody tr[data-act] { cursor: pointer; }
.stbl tbody tr[data-act]:hover td { background: var(--bg); }
.stbl tr:last-child td { border-bottom: 0; }
.stbl .name { font-weight: 600; word-break: break-word; }
.stbl td.num, .stbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stages { display: flex; gap: 2px; margin-top: 6px; }
.stages i { width: 16px; height: 4px; border-radius: 2px; background: var(--line); }
.stages i.done { background: var(--ok); }
.stages i.fail { background: var(--bad); }
.stages i.run { background: var(--warn); }

/* Review queue */
.rq { display: grid; gap: 12px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; }
.rcard h3 { font-size: 15px; }
.rcard p { max-width: 78ch; }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--bg); }
.side-box .big { font: 600 20px var(--f-display); font-variant-numeric: tabular-nums; }

/* Workstreams */
.ws-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
.ws { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.ws:hover { border-color: var(--muted); }
.ws[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ws strong { font: 600 15px var(--f-display); }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.pillars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pillar { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 4px; background: var(--surface); align-content: start; }
.pillar.missing { border-style: dashed; background: none; }
.pillar strong { font: 600 13px var(--f-display); }
.ws-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.ws-detail > .stack { align-content: start; }
.tool { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }

/* Drawer & modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 12, .42); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100%); background: var(--surface); box-shadow: var(--shadow); z-index: 21; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; align-content: start; }
.drawer h2 { font-size: 18px; }
.chain { display: grid; border-left: 2px solid var(--line); margin-left: 6px; }
.chain > div { position: relative; padding: 0 0 14px 16px; display: grid; gap: 3px; }
.chain > div::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.excerpt { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; font-size: 13px; }
pre.excerpt { font: 12px/1.5 var(--f-mono); white-space: pre-wrap; margin: 0; overflow-x: auto; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.verdict { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.verdict.ok { background: var(--ok-soft); } .verdict.bad { background: var(--bad-soft); } .verdict.warn { background: var(--warn-soft); }
.modal-wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 22; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; }
.modal header { padding: 18px 20px 0; }
.modal header h2 { font-size: 18px; }
.modal form { padding: 16px 20px 20px; display: grid; gap: 14px; }
.field { display: grid; gap: 5px; }
.field label, .field .flabel { font-size: 12px; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; width: 100%; }
.field textarea { resize: vertical; min-height: 80px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.callout { background: var(--info-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 1100px) {
  .home, .ask, .ws-detail { grid-template-columns: minmax(0, 1fr); }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pillars { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }

/* =====================================================================
   Search: a visible fact selection (filter, rank, collapse)
   ===================================================================== */
function selectFacts(cat, cust, q) {
  const words = (q || "").toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const live = FACTS.filter(visibleToMe).filter(isLive);
  const inScope = live.filter(f => (f.cat === cat && (!f.cust || (cust && f.cust === cust))) || (!f.cat && cust && f.cust === cust));
  const RW = { certified: 1, reviewed: .8, stated: .6 };
  const ranked = inScope.map(f => {
    const overlap = words.filter(w => f.text.toLowerCase().includes(w)).length;
    const rel = Math.min(1, .45 + overlap * .15 + (f.cust ? .1 : 0));
    return { f, score: rel * (f.status === "verified" ? 1 : .7) * RW[f.rel] * (f.expires ? .85 : 1) };
  }).sort((a, b) => b.score - a.score).slice(0, 8);
  const merged = ranked.reduce((n, r) => n + (r.f.dedup - 1), 0);
  const hasMetric = ranked.some(r => r.f.type === "metric" && r.f.rel === "certified");
  const coverage = !ranked.length ? "none" : ranked.length >= 3 && hasMetric ? "sufficient" : "thin";
  return { live: live.length, inScope: inScope.length, ranked, merged, coverage };
}
const COV = { sufficient: ["ok", "Sufficient", "Enough trusted evidence on this scope. Tools use these facts directly."], thin: ["warn", "Thin", "Some evidence, but below the must-have floor. Tools proceed, fall back to general frameworks for the gaps, and flag them."], none: ["bad", "None", "Nothing on this scope. Tools skip Knowledge Bank grounding and use general frameworks only."] };
function shortWhy(f, audience) {
  if (f.status !== "verified") return "Needs review";
  if (audience === "external") return f.sens === "restricted" ? "Restricted" : "Internal only";
  return "";
}

RENDER.search = () => {
  const A = state.ask;
  const r = selectFacts(A.cat, A.cust, A.q);
  const c = COV[r.coverage];
  const rows = r.ranked.map((x, i) => {
    const [ok, why] = quotable(x.f, A.audience);
    return `<tr>
      <td class="num">${i + 1}</td>
      <td><button class="linkish" data-act="open-fact" data-id="${x.f.id}">${esc(x.f.text)}</button><div class="row" style="margin-top:4px"><span class="type">${x.f.type}</span><span class="facet">${!x.f.cat ? "customer" : x.f.cust ? "account" : "category"} scope</span></div></td>
      <td>${gov(x.f)}</td>
      <td class="num">${x.score.toFixed(2)}</td>
      <td><span class="pill ${ok ? "ok" : "neutral"}" title="${esc(why)}">${ok ? "Quotable" : "Background"}</span><div class="small muted" style="margin-top:4px">${ok ? "" : shortWhy(x.f, A.audience)}</div></td>
    </tr>`;
  }).join("");
  const quot = r.ranked.filter(x => quotable(x.f, A.audience)[0]);
  const bg = r.ranked.length - quot.length;
  const shown = (A.audience === "external" ? quot : r.ranked).slice(0, 4);
  const answer = r.coverage === "none"
    ? `<p>The bank has nothing on this scope. A tool would answer from general selling frameworks only, with no Knowledge Bank citations.</p>`
    : `<p>For <strong>${esc(scopeLabel(A.cat, A.cust))}</strong>, the strongest evidence is:</p>
       ${shown.length ? `<ul>${shown.map(x => `<li>${esc(x.f.text)} <button class="anchor" data-act="open-fact" data-id="${x.f.id}">${r.ranked.indexOf(x) + 1}</button></li>`).join("")}</ul>` : `<p class="muted">None of the selected facts can be shown to a customer.</p>`}
       ${bg && A.audience === "external" ? `<p class="small muted">${plural(bg, "more fact", "more facts")} shaped this answer but cannot be quoted to a customer. See the Use column.</p>` : ""}`;

  return `<div class="ask">
    <section class="card pad">
      <form id="askform">
        <div class="field"><label for="a-q">Question</label><textarea id="a-q" rows="3">${esc(A.q)}</textarea></div>
        <div class="grid2">
          <div class="field"><label for="a-cat">Category</label><select id="a-cat">${CATEGORIES.map(x => `<option ${x === A.cat ? "selected" : ""}>${x}</option>`).join("")}</select></div>
          <div class="field"><label for="a-cust">Customer</label><select id="a-cust"><option value="">Category level</option>${CUSTOMERS.map(x => `<option ${x === A.cust ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        </div>
        <div class="field"><span class="flabel">Audience</span>
          <div class="seg" role="group" aria-label="Audience"><button type="button" data-aud="internal" aria-pressed="${A.audience === "internal"}">Internal prep</button><button type="button" data-aud="external" aria-pressed="${A.audience === "external"}">Customer-facing</button></div>
          <span class="hint">Customer-facing keeps internal and restricted facts as background only.</span>
        </div>
        <button class="btn primary" type="submit">Search evidence</button>
      </form>
      <div class="stack" style="margin-top:16px"><div class="label">Try</div><div class="chips">
        ${[["What should I lead with in the Northgate range review?", "Fabric Care", "Northgate"], ["Why is our Hair Care share slipping at Brightmart?", "Hair Care", "Brightmart"], ["What do we know about Harbour & Co in Oral Care?", "Oral Care", "Harbour & Co"]].map(([q, cat, cu]) => `<button class="chip" data-act="try" data-q="${esc(q)}" data-cat="${cat}" data-cust="${esc(cu)}">${esc(q)}</button>`).join("")}
      </div></div>
    </section>
    <section class="stack" style="gap:14px">
      <div class="pipeline">
        <div><span class="label">1 · Filter</span><b>${r.inScope}</b><span class="small muted">of ${r.live} live facts match the scope and your access</span></div>
        <div><span class="label">2 · Rank</span><b>${r.ranked.length}</b><span class="small muted">top facts by relevance, status, reliability and recency</span></div>
        <div><span class="label">3 · Collapse</span><b>${r.merged}</b><span class="small muted">restatements merged into their best-scored fact</span></div>
      </div>
      <div class="verdict ${c[0]}"><strong>Coverage: ${c[1]}.</strong> ${c[2]}</div>
      <div class="card pad answer"><div class="label">Draft answer · built only from the facts below</div>${answer}</div>
      ${r.ranked.length ? `<div class="table-wrap"><table class="ftable"><thead><tr><th>#</th><th>Fact</th><th>Governance</th><th>Score</th><th>Use</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    </section>
  </div>`;
};
AFTER.search = () => {
  $("#askform").addEventListener("submit", e => { e.preventDefault(); readAskForm(); render(); toast("Evidence selected"); });
};
function readAskForm() {
  state.ask.q = $("#a-q").value.trim() || state.ask.q;
  state.ask.cat = $("#a-cat").value; state.ask.cust = $("#a-cust").value;
}

/* =====================================================================
   Manage sources (sources + review queue)
   ===================================================================== */
RENDER.sources = () => {
  const tabs = `<div class="tabs" role="tablist">
    <button role="tab" data-tab="sources" aria-selected="${state.srcTab === "sources"}">Sources <span class="muted small">${SOURCES.length}</span></button>
    <button role="tab" data-tab="review" aria-selected="${state.srcTab === "review"}">Review queue ${REVIEW.length ? `<span class="badge">${REVIEW.length}</span>` : ""}</button>
  </div>`;
  return tabs + (state.srcTab === "review" ? reviewQueue() : sourceTable());
};
function sourceTable() {
  const rows = SOURCES.map(s => {
    const p = S_PILL[s.status];
    const stalled = ["failed", "needs_context", "quarantined"].includes(s.status);
    const stages = STAGES.map((_, i) => `<i class="${i < s.stage ? "done" : i === s.stage && stalled ? "fail" : i === s.stage && s.status === "processing" ? "run" : ""}"></i>`).join("");
    return `<tr data-act="open-source" data-id="${s.id}" tabindex="0">
      <td><div class="name">${esc(s.name)}</div><div class="stages" title="${STAGES.join(" → ")}">${stages}</div>${s.note ? `<div class="small muted" style="margin-top:4px">${esc(s.note)}</div>` : ""}</td>
      <td>${esc(s.kind)}<div class="small muted">${s.lane} lane</div></td>
      <td class="small">${esc(scopeLabel(s.cat, s.cust))}</td>
      <td><span class="pill ${p[0]}">${p[1]}</span></td>
      <td><span class="gov"><span class="t-${s.rel}"><b>${s.rel}</b></span><span class="s-${s.sens}"><b>${s.sens}</b></span></span></td>
      <td class="small">${s.asOf}${s.conf === "low" ? `<div><span class="pill warn">low confidence</span></div>` : ""}</td>
      <td class="num">${s.facts}</td>
    </tr>`;
  }).join("");
  const by = st => SOURCES.filter(s => s.status === st).length;
  return `
    <p class="small muted" style="margin-bottom:12px">${by("live")} live · ${by("needs_context") + by("quarantined")} waiting for review · ${by("failed")} failed · ${by("superseded") + by("retired")} replaced or retired. Pipeline: ${STAGES.join(" → ")}.</p>
    <div class="table-wrap"><table class="stbl">
      <thead><tr><th>Source</th><th>Type</th><th>Scope</th><th>Status</th><th>Reliability · sensitivity</th><th>Content date</th><th class="num">Facts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function reviewQueue() {
  if (!REVIEW.length) return `<div class="empty-state">The queue is empty. New cases appear here after ingestion and scheduled jobs.</div>`;
  return `<p class="small muted" style="margin-bottom:12px">Only the cases that need a person: contradictions, stale intake, verbatim quotes, personal data and overlaps.</p>
  <div class="rq">${REVIEW.map(r => `
    <article class="rcard">
      <div class="spread"><span class="pill ${r.cls}">${r.kind}</span><span class="mono muted">${r.id}</span></div>
      <h3>${esc(r.title)}</h3>
      <p>${esc(r.body)}</p>
      ${r.a ? `<div class="versus">${[r.a, r.b].map(x => `<div class="side-box"><span class="big">${x.big}</span><span>${esc(x.src)}</span><span class="small muted">${esc(x.loc)} · ${x.rel} · as of ${x.asOf}</span></div>`).join("")}</div>` : ""}
      <div class="row">${r.actions.map(([l, c]) => `<button class="btn sm ${c}" data-act="resolve" data-id="${r.id}" data-choice="${esc(l)}">${esc(l)}</button>`).join("")}</div>
    </article>`).join("")}</div>`;
}

/* =====================================================================
   Workstreams: how a workspace uses the Knowledge Bank
   ===================================================================== */
RENDER.workstreams = () => {
  const cards = WORKSTREAMS.map(w => {
    const ps = pillars(w), score = ps.filter(p => p.n > 0).length;
    return `<button class="ws" data-act="pick-ws" data-id="${w.id}" aria-pressed="${w.id === state.ws}">
      <strong>${esc(w.name)}</strong>
      <span class="small muted">${esc(w.cust)} × UK · ${w.cat}</span>
      <span class="spread"><span class="row small"><span class="dots" aria-hidden="true">${ps.map(p => `<i class="${p.n ? "on" : ""}"></i>`).join("")}</span>${score}/5 context</span><span class="pill ${w.audience === "external" ? "info" : "neutral"}">${w.audience === "external" ? "Customer-facing" : "Internal"}</span></span>
    </button>`;
  }).join("");
  const w = WORKSTREAMS.find(x => x.id === state.ws);
  const ps = pillars(w);
  const b = BRIEFINGS.find(x => sameScope(x, w.cat, w.cust));
  const st = b ? briefingState(b) : null;
  const sel = selectFacts(w.cat, w.cust, "");
  const quot = sel.ranked.filter(x => quotable(x.f, w.audience)[0]).length;
  const storyOK = quot > 0;
  const runs = w.runs.map(r => `<tr><td>${r.tool}</td><td class="small">${esc(r.note)}</td><td class="small">${r.date}</td><td><span class="pill ${r.status === "Running" ? "info" : "ok"}">${r.status}</span></td><td class="small">${r.rating || "—"}</td></tr>`).join("");

  return `
    <div class="ws-grid">${cards}</div>
    <section class="card pad">
      <div class="spread"><div class="stack" style="gap:2px"><h2 style="font-size:18px">${esc(w.name)}</h2><span class="facet">${facetKey(w.cat, w.cust)}</span></div>
        <span class="pill ${w.audience === "external" ? "info" : "neutral"}">Audience: ${w.audience === "external" ? "customer-facing" : "internal"}</span></div>
      <div class="section" style="margin-top:16px">
        <div class="spread" style="margin-bottom:8px"><span class="label">Context evidence</span><span class="small muted">Derived from facts, not set by hand. Private facts never count.</span></div>
        <div class="pillars">${ps.map(p => `<div class="pillar ${p.n ? "" : "missing"}"><span class="spread"><strong>${p.name}</strong><span class="pill ${p.n ? "ok" : "neutral"}">${p.n ? (p.name === "Buyer" ? "Attached" : plural(p.n, "fact", "facts")) : "Missing"}</span></span><span class="small muted">${esc(p.text || p.desc)}</span>${!p.n && p.name === "Buyer" ? `<button class="btn ghost small" data-act="attach-buyer" data-id="${w.id}">Attach a buyer</button>` : ""}${!p.n && p.name !== "Buyer" ? `<button class="btn ghost small" data-act="add-source">Add a source</button>` : ""}</div>`).join("")}</div>
      </div>
      <div class="ws-detail">
        <div class="stack">
          <span class="label">Attached Knowledge Bank context</span>
          <div class="tool">
            <span class="spread"><strong>Briefing · ${esc(scopeLabel(w.cat, w.cust))}</strong>${st ? `<span class="pill ${B_PILL[st][0]}">${B_PILL[st][1]}</span>` : `<span class="pill neutral">None</span>`}</span>
            <span class="small muted">${plural(sel.inScope, "live fact", "live facts")} in scope · ${plural(quot, "is", "are")} quotable for this audience · coverage ${COV[sel.coverage][1].toLowerCase()}</span>
            <div class="row"><button class="btn sm" data-act="open-ws-brief" data-id="${w.id}">Open briefing</button><button class="btn sm" data-act="ws-search" data-id="${w.id}">See selected facts</button></div>
          </div>
        </div>
        <div class="stack">
          <span class="label">Tools</span>
          <div class="tool">
            <span class="spread"><strong>Selling Coach</strong><span class="small muted">PSF deck analysis</span></span>
            <span class="small muted">Checks each Persuasive Selling Format step of your deck against the facts in scope and cites them.</span>
            <div><button class="btn sm primary" data-act="run-tool" data-tool="Selling Coach" data-id="${w.id}">Upload deck and run</button></div>
          </div>
          <div class="tool">
            <span class="spread"><strong>Storyline Generator</strong><span class="small muted">Opportunity + PSF storyline</span></span>
            <span class="small muted">${storyOK ? "Proposes opportunities from the grounded context. You pick one and refine it until you approve." : "Needs at least one quotable fact for a customer-facing audience. This scope has none yet."}</span>
            <div><button class="btn sm primary" data-act="run-tool" data-tool="Storyline Generator" data-id="${w.id}" ${storyOK ? "" : "disabled"}>Start storyline</button></div>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="spread" style="margin-bottom:8px"><span class="label">Recent runs</span><span class="small muted">Completed runs feed new account facts back to the bank for review.</span></div>
        ${runs ? `<div class="table-wrap"><table class="stbl narrow"><thead><tr><th>Tool</th><th>Result</th><th>Date</th><th>Status</th><th>Rating</th></tr></thead><tbody>${runs}</tbody></table></div>` : `<div class="empty-state">No runs yet.</div>`}
      </div>
    </section>`;
};

/* =====================================================================
   Drawer (fact detail, source impact) and modals
   ===================================================================== */
function openDrawer(html) {
  $("#overlay").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
  $(".drawer button")?.focus();
}
function openModal(html, onSubmit) {
  $("#overlay").innerHTML = `<div class="scrim"></div><div class="modal-wrap" data-act="close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const form = $(".modal form");
  form.addEventListener("submit", e => { e.preventDefault(); onSubmit(new FormData(form)); });
  $(".modal input, .modal select, .modal textarea")?.focus();
}
function closeOverlay() { $("#overlay").innerHTML = ""; }

function factDrawer(id) {
  const f = fact(id);
  const s = f.src ? src(f.src) : null;
  const [qi, whyI] = quotable(f, "internal");
  const [qc, whyC] = quotable(f, "external");
  const cites = BRIEFINGS.filter(b => floorOK(b) && briefingFacts(b).includes(f));
  const figNum = f.fig && String(parseFloat(f.fig));
  const evidence = f.row
    ? `<pre class="excerpt">${esc(JSON.stringify(f.row, null, 2)).replace(figNum, `<mark>${figNum}</mark>`)}</pre>`
    : `<div class="excerpt">${highlight(f.excerpt, f.fig)}</div>`;
  const fidelity = !f.fig ? "" : (f.row || (f.excerpt || "").includes(f.fig)) ? "Figure found in its evidence. Numeric check passed." : "Figure not found in its evidence.";
  openDrawer(`
    <div class="spread"><span class="row"><span class="type">${f.type}</span>${statusPill(f)}${expPill(f)}</span><button class="btn sm" data-act="close">Close</button></div>
    <h2>${esc(f.text)}</h2>
    <div>${gov(f)}</div>
    <div class="stack"><div class="label">Where it comes from</div>
      <div class="chain">
        <div><strong>${s ? esc(s.name) : "Account memory"}</strong><span class="small muted">${s ? `${esc(s.kind)} · ${s.lane} lane · ${s.rel} · ${S_PILL[s.status][1].toLowerCase()}` : "Created from a workstream signal"}</span></div>
        <div><strong>${esc(f.loc)}</strong><span class="small muted">${f.row ? "Certified dataset row. The number is read from the query, not written by a model." : "Grounding passage"}</span></div>
        <div style="padding-bottom:0">${evidence}${fidelity ? `<span class="small muted">${fidelity}</span>` : ""}</div>
      </div>
    </div>
    <dl class="kv">
      <dt>Scope</dt><dd>${esc(scopeLabel(f.cat, f.cust))}<div class="facet">${facetKey(f.cat, f.cust)}</div></dd>
      ${f.period ? `<dt>Period</dt><dd>${esc(f.period)}</dd>` : ""}
      <dt>Content date</dt><dd>${f.asOf}${f.expires ? ` · expires ${f.expires}` : ""}</dd>
      <dt>Restated in</dt><dd>${f.dedup} ${f.dedup === 1 ? "source" : "sources, collapsed to this fact"}</dd>
      <dt>Cited by</dt><dd>${cites.length ? cites.map(b => "Briefing: " + esc(scopeLabel(b.cat, b.cust))).join("<br>") : "No briefing"}</dd>
      <dt>ID</dt><dd class="mono">${f.id}</dd>
    </dl>
    <div class="stack"><div class="label">Can a tool quote it?</div>
      <div class="verdict ${qi ? "ok" : "warn"}"><strong>Internal prep: ${qi ? "yes" : "no"}.</strong> ${esc(whyI)}</div>
      <div class="verdict ${qc ? "ok" : "bad"}"><strong>Customer-facing: ${qc ? "yes" : "no"}.</strong> ${esc(whyC)}</div>
    </div>
    ${isLive(f) ? `<div class="stack"><div class="label">Curate</div>
      <div class="row">
        ${f.status === "needs_review" ? `<button class="btn primary" data-act="verify" data-id="${f.id}">Verify</button><button class="btn danger" data-act="reject" data-id="${f.id}">Reject</button>` : ""}
        <label class="check">Sensitivity <select class="select" id="d-sens">${["external", "internal", "restricted"].map(x => `<option ${x === f.sens ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      </div>
    </div>` : ""}`);
  $("#d-sens")?.addEventListener("change", e => {
    f.sens = e.target.value;
    if (!f.owner) markOutdated(f.cat, f.cust, "A fact's sensitivity changed.");
    render(); factDrawer(f.id); toast(`Sensitivity set to ${f.sens}. Briefings citing it are now outdated.`);
  });
}

function sourceDrawer(id) {
  const s = src(id);
  const fs = FACTS.filter(f => f.src === id);
  const briefs = BRIEFINGS.filter(b => fs.some(f => sameScope(f, b.cat, b.cust)));
  const other = Math.max(0, s.facts - fs.length);
  const p = S_PILL[s.status];
  const canRetire = !["retired", "superseded", "processing"].includes(s.status);
  const stalled = !["live", "superseded", "retired"].includes(s.status);
  openDrawer(`
    <div class="spread"><span class="pill ${p[0]}">${p[1]}</span><button class="btn sm" data-act="close">Close</button></div>
    <h2>${esc(s.name)}</h2>
    <dl class="kv">
      <dt>Type</dt><dd>${esc(s.kind)} · ${s.lane} lane</dd>
      <dt>Scope</dt><dd>${esc(scopeLabel(s.cat, s.cust))}</dd>
      <dt>Content date</dt><dd>${s.asOf} · ${s.conf} confidence</dd>
      <dt>Reliability</dt><dd>${s.rel} <span class="small muted">· set from where the source came from</span></dd>
      ${s.supersededBy ? `<dt>Replaced by</dt><dd>${esc(src(s.supersededBy).name)}</dd>` : ""}
      ${s.note ? `<dt>Note</dt><dd>${esc(s.note)}</dd>` : ""}
    </dl>
    <div class="stack"><div class="label">Pipeline</div>
      <div class="row">${STAGES.map((st, i) => `<span class="pill ${i < s.stage ? "ok" : i === s.stage && stalled ? (s.status === "processing" ? "info" : "bad") : "neutral"}">${st}</span>`).join("")}</div>
    </div>
    <div class="stack"><div class="label">What depends on it</div>
      <p>${plural(s.facts, "fact comes", "facts come")} from this source${briefs.length ? ` and ${plural(briefs.length, "briefing cites", "briefings cite")} them` : ""}.${s.facts === 0 && s.status === "live" ? " It feeds no live facts and can be cleaned up." : ""}</p>
      ${fs.slice(0, 4).map(f => `<button class="btn ghost" data-act="open-fact" data-id="${f.id}">${f.id} · ${esc(f.text)}</button>`).join("")}
      ${other && s.facts ? `<span class="small muted">+ ${other} more facts</span>` : ""}
      ${briefs.map(b => `<span class="small">Briefing: ${esc(scopeLabel(b.cat, b.cust))}</span>`).join("")}
    </div>
    <div class="stack"><div class="label">Reclassify</div>
      <div class="row"><select class="select" id="s-sens" aria-label="New sensitivity">${["external", "internal", "restricted"].map(x => `<option ${x === s.sens ? "selected" : ""}>${x}</option>`).join("")}</select><button class="btn" data-act="reclassify" data-id="${s.id}">Apply to the source and its ${plural(s.facts, "fact", "facts")}</button></div>
      <span class="hint">No re-parsing and no re-mining. The label flows to every fact, and briefings citing them become outdated.</span>
    </div>
    ${canRetire ? `<div class="stack"><div class="label">Retire</div>
      <label class="check"><input type="checkbox" id="s-confirm"> I understand this removes ${plural(s.facts, "fact", "facts")} from retrieval and cannot be undone. The original file is kept for audit.</label>
      <div><button class="btn danger" id="s-retire" data-act="retire" data-id="${s.id}" disabled>Retire source</button></div>
    </div>` : ""}`);
  $("#s-confirm")?.addEventListener("change", e => { $("#s-retire").disabled = !e.target.checked; });
}

function addFactModal() {
  const srcOpts = SOURCES.filter(s => s.status === "live").map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  openModal(`
    <header><h2>Add a fact</h2><p class="muted" style="margin-top:4px">One assertion per fact. Write it so a colleague could check it against the evidence.</p></header>
    <form>
      <div class="grid2">
        <div class="field"><label for="n-type">Type</label><select id="n-type" name="type">${TYPES.map(t => `<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="n-date">Content date</label><input id="n-date" name="asOf" value="${TODAY}"><span class="hint">The date the fact is about, not today's date.</span></div>
      </div>
      <div class="field"><label for="n-text">Statement</label><textarea id="n-text" name="text" required placeholder="e.g. Northgate will cut laundry SKUs by 10% at the November range review."></textarea></div>
      <div class="grid3">
        <div class="field"><label for="n-fig">Figure (optional)</label><input id="n-fig" name="fig" placeholder="10%"></div>
        <div class="field"><label for="n-period">Period (optional)</label><input id="n-period" name="period" placeholder="FY 2026-27"></div>
        <div class="field"><label for="n-cat">Category</label><select id="n-cat" name="cat"><option value="">None (customer only)</option>${CATEGORIES.map(c => `<option ${c === "Fabric Care" ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="n-cust">Customer</label><select id="n-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option ${c === "Northgate" ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
        <div class="field"><label for="n-src">Evidence</label><select id="n-src" name="src"><option value="">My own knowledge</option>${srcOpts}</select></div>
      </div>
      <div class="field"><label for="n-ex">Supporting passage</label><textarea id="n-ex" name="excerpt" rows="2" placeholder="Paste the sentence or note that backs this up. Any figure must appear here."></textarea></div>
      <div class="grid2">
        <div class="field"><label for="n-sens">Sensitivity</label><select id="n-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div>
        <div class="field"><label for="n-vis">Visibility</label><select id="n-vis" name="vis"><option value="shared">Shared with the team</option><option value="private">Private to me</option></select></div>
      </div>
      <p class="hint" id="n-err" style="color:var(--bad)" hidden></p>
      <div class="callout">New facts start as <strong>needs review</strong>. Reliability comes from the evidence, so your own knowledge is <strong>stated</strong>. A curator verifies it before any tool can quote it.</div>
      <div class="foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Add fact</button></div>
    </form>`, fd => {
      const fig = fd.get("fig").trim(), ex = fd.get("excerpt").trim(), err = $("#n-err");
      if (!fd.get("cat") && !fd.get("cust")) { err.hidden = false; err.textContent = "Pick a category, a customer, or both, so the fact has a scope."; return; }
      if (fig && !ex.includes(fig)) { err.hidden = false; err.textContent = `The figure “${fig}” is not in the supporting passage. Add it to the passage or remove the figure.`; return; }
      const s = fd.get("src") ? src(fd.get("src")) : null;
      const f = { id: "F-" + (2000 + FACTS.length), type: fd.get("type"), text: fd.get("text").trim(), fig: fig || null, period: fd.get("period").trim() || null, cat: fd.get("cat") || null, cust: fd.get("cust") || null,
        rel: s ? s.rel : "stated", sens: fd.get("sens"), owner: fd.get("vis") === "private" ? ME : null, status: "needs_review", asOf: fd.get("asOf") || TODAY,
        src: s ? s.id : null, loc: "Added by you", excerpt: ex || "No passage given.", dedup: 1 };
      FACTS.unshift(f);
      if (!f.owner) markOutdated(f.cat, f.cust, "A new fact arrived for this scope.");
      closeOverlay();
      state.f = { ...blankFilter(), cat: f.cat || "", cust: f.cust || "_cat" };
      go("facts"); toast(`Fact added · needs review${f.owner ? " · private to you" : ""}`);
    });
}

function addSourceModal() {
  openModal(`
    <header><h2>Add source</h2><p class="muted" style="margin-top:4px">The file is quality-checked, chunked and mined into facts that need review.</p></header>
    <form>
      <div class="field"><label for="u-name">File or link</label><input id="u-name" name="name" required placeholder="e.g. Brightmart JBP 2026-27.pptx or a SharePoint Sales Book link"></div>
      <div class="grid2">
        <div class="field"><label for="u-kind">Type</label><select id="u-kind" name="kind"><option>Deck</option><option>PDF</option><option>SharePoint Sales Book</option><option>Word document</option><option>Spreadsheet</option></select></div>
        <div class="field"><label for="u-sens">Sensitivity</label><select id="u-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="u-cat">Category</label><select id="u-cat" name="cat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="u-cust">Customer</label><select id="u-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
      </div>
      <p class="hint">Certified trade-panel numbers arrive through the data lane on a schedule. You don't upload them.</p>
      <div class="foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Start ingestion</button></div>
    </form>`, fd => {
      const s = { id: "S-" + (20 + SOURCES.length), name: fd.get("name"), kind: fd.get("kind"), lane: "Document", cat: fd.get("cat"), cust: fd.get("cust") || null, status: "processing", sens: fd.get("sens"), rel: fd.get("kind") === "SharePoint Sales Book" ? "stated" : "reviewed", asOf: "reading…", conf: "medium", facts: 0, stage: 0 };
      const run = { status: "Running", source: "upload · " + s.name, started: TODAY + " 14:05", indexed: 0, failed: 0 };
      SOURCES.unshift(s); RUNS.unshift(run);
      closeOverlay(); state.srcTab = "sources"; go("sources"); toast("Ingestion started");
      const t = setInterval(() => {
        s.stage++;
        if (s.stage >= STAGES.length) {
          clearInterval(t); s.status = "live"; s.asOf = "12 Sep 2026"; s.facts = 11;
          run.status = "Complete"; run.indexed = 11;
          markOutdated(s.cat, s.cust, "New facts arrived from a new source.");
          toast(`${s.name}: 11 facts mined, waiting for review`);
        }
        if ((state.view === "sources" || state.view === "home") && !$("#overlay").children.length) render();
      }, 650);
    });
}

/* A completed tool run writes account facts back to the bank (needs review). */
function runTool(ws, tool) {
  const run = { tool, date: TODAY, status: "Running", note: tool === "Selling Coach" ? "Northgate range review deck.pptx" : "Scouting opportunities", rating: "" };
  ws.runs.unshift(run); render(); toast(`${tool} started`);
  setTimeout(() => {
    const sel = selectFacts(ws.cat, ws.cust, "");
    run.status = tool === "Selling Coach" ? "Completed" : "Ready for review";
    run.note = tool === "Selling Coach" ? `Range review deck · ${Math.min(5, sel.ranked.length)} of 5 PSF steps grounded` : "3 opportunities proposed · 1 recommended";
    const f = { id: "F-" + (2000 + FACTS.length), type: "insight", text: tool === "Selling Coach" ? `The ${ws.cust} range review deck has no market-size figure in its Situation step.` : `Recommended opportunity for ${ws.cust}: grow ${ws.cat} premium tier through capsules.`,
      cat: ws.cat, cust: ws.cust, rel: "stated", sens: "internal", owner: null, status: "needs_review", asOf: TODAY, src: null, loc: `${tool} run · ${ws.name}`, excerpt: `Written back from a completed ${tool} run on ${TODAY}.`, dedup: 1 };
    FACTS.unshift(f);
    markOutdated(ws.cat, ws.cust, "A tool run added an account fact.");
    if (state.view === "workstreams" && !$("#overlay").children.length) render();
    toast(`${tool} finished · 1 account fact sent to the bank for review`);
  }, 1600);
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav) { closeOverlay(); go(nav.dataset.view); return; }
  const ft = e.target.closest("[data-ftype]");
  if (ft) { state.f.type = ft.dataset.ftype; render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.srcTab = tab.dataset.tab; render(); return; }
  const aud = e.target.closest("[data-aud]");
  if (aud) { readAskForm(); state.ask.audience = aud.dataset.aud; render(); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "close") { if (e.target === el || el.tagName === "BUTTON") closeOverlay(); return; }
  if (a === "add-fact") addFactModal();
  if (a === "add-source") addSourceModal();
  if (a === "open-fact") factDrawer(id);
  if (a === "open-source") sourceDrawer(id);
  if (a === "clear-filters") { state.f = blankFilter(); render(); }
  if (a === "cell") { state.f = { ...blankFilter(), cat: el.dataset.cat, cust: el.dataset.cust || "_cat" }; go("facts"); }
  if (a === "attention") { state.srcTab = "review"; go("sources"); }
  if (a === "todo") state.todo[+el.dataset.k]?.go();
  if (a === "pick-brief") { state.briefKey = el.dataset.key; render(); }
  if (a === "regen") { const b = BRIEFINGS.find(x => bkey(x) === el.dataset.key); b.status = "current"; b.generated = TODAY; delete b.why; render(); toast("Briefing rebuilt from the current fact set"); }
  if (a === "generate") { const [cat, cust] = el.dataset.key.split("|"); BRIEFINGS.push({ cat, cust: cust || null, status: "current", generated: TODAY }); state.briefKey = el.dataset.key; render(); toast("Briefing generated"); }
  if (a === "try") { Object.assign(state.ask, { q: el.dataset.q, cat: el.dataset.cat, cust: el.dataset.cust }); render(); }
  if (a === "pick-ws") { state.ws = id; render(); }
  if (a === "open-ws-brief") { const w = WORKSTREAMS.find(x => x.id === id); state.bf = { q: "", cat: w.cat, cust: w.cust }; state.briefKey = `${w.cat}|${w.cust}`; go("briefings"); }
  if (a === "ws-search") { const w = WORKSTREAMS.find(x => x.id === id); Object.assign(state.ask, { cat: w.cat, cust: w.cust, audience: w.audience, q: `What should I bring to ${w.cust}?` }); go("search"); }
  if (a === "attach-buyer") { WORKSTREAMS.find(x => x.id === id).buyer = "Jordan Blake · category buyer"; render(); toast("Buyer attached"); }
  if (a === "run-tool") runTool(WORKSTREAMS.find(x => x.id === id), el.dataset.tool);
  if (a === "verify" || a === "reject") {
    const f = fact(id);
    if (a === "verify") f.status = "verified"; else FACTS = FACTS.filter(x => x !== f);
    if (!f.owner) markOutdated(f.cat, f.cust, a === "verify" ? "A fact was verified." : "A fact was rejected.");
    render(); if (a === "verify") factDrawer(id); else closeOverlay();
    toast(a === "verify" ? "Verified. Tools can quote it where its sensitivity allows." : "Rejected. It will not be retrieved.");
  }
  if (a === "reclassify") {
    const s = src(id), v = $("#s-sens").value;
    s.sens = v; FACTS.filter(f => f.src === id).forEach(f => { f.sens = v; markOutdated(f.cat, f.cust, "A source it cites was reclassified."); });
    render(); sourceDrawer(id); toast(`Reclassified to ${v}: the source and its ${plural(s.facts, "fact", "facts")}`);
  }
  if (a === "retire") {
    const s = src(id); s.status = "retired";
    const hit = new Set();
    FACTS.filter(f => f.src === id).forEach(f => { BRIEFINGS.filter(b => sameScope(b, f.cat, f.cust)).forEach(b => hit.add(b)); markOutdated(f.cat, f.cust, "A source it cited was retired."); });
    closeOverlay(); render(); toast(`Retired. ${plural(s.facts, "fact", "facts")} removed from retrieval, ${plural(hit.size, "briefing", "briefings")} marked outdated`);
  }
  if (a === "resolve") {
    const r = REVIEW.find(x => x.id === id);
    if (r.fact && el.dataset.choice.startsWith("Approve")) { const f = fact(r.fact); f.status = "verified"; f.sens = "external"; markOutdated(f.cat, f.cust, "A quote was approved."); }
    REVIEW = REVIEW.filter(x => x.id !== id);
    render(); toast(`${r.kind}: ${el.dataset.choice}`);
  }
});
document.addEventListener("change", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { state.f[f.dataset.filter] = f.value; render(); return; }
  const b = e.target.closest("[data-bfilter]");
  if (b) { state.bf[b.dataset.bfilter] = b.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeOverlay();
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
});

render();
</script>
