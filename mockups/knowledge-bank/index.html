<style>

    --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
    --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;
    --bad: #f08c80; --bad-soft: #3d1c18; --info: #8fb0f5; --info-soft: #1c2742;

}
:root[data-theme="dark"] {

  --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
  --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;

* { box-sizing: border-box; }

/* Ask */
.ask { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const src = id => SOURCES.find(s => s.id === id);
const fact = id => FACTS.find(f => f.id === id);
const scopeLabel = (cat, cust) => [cat || "All categories", "UK", cust].filter(Boolean).join(" · ");
const facetKey = (cat, cust) => [cat && `category:${cat.toLowerCase()}`, "country:uk", cust && `customer:${cust.toLowerCase()}`].filter(Boolean).sort().join("|");
const sameScope = (a, cat, cust) => a.cat === cat && (a.cust || null) === (cust || null);
const hash = s => { let h = 5381; for (const c of s) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, "0"); };

function isLive(f) {
  const s = f.src && src(f.src);
  return f.status !== "rejected" && f.fresh !== "hard" && (!s || s.status === "live");
}
function visibleToMe(f) { return !f.owner || f.owner === ME; }
function quotable(f, audience) {
  if (!isLive(f)) return [false, "Not retrievable: expired, rejected or its source is no longer live."];
  if (f.status !== "verified") return [false, "Candidate. A reviewer must verify it first."];
  if (f.fresh !== "fresh") return [false, "Past its soft freshness window."];
  if (audience === "customer" && f.sens !== "external") return [false, `Sensitivity is ${f.sens}: it can inform reasoning but is kept out of customer-facing output.`];
  return [true, audience === "customer" ? "Verified, fresh and cleared for customers." : "Verified and fresh."];
}
function briefingFacts(b) { return FACTS.filter(f => sameScope(f, b.cat, b.cust) && isLive(f) && !f.owner); }
function floorOK(b) { const fs = briefingFacts(b); return fs.length >= 3 && fs.some(f => f.type === "metric" && f.trust === "governed"); }
function briefingState(b) { return floorOK(b) ? b.status : "below"; }
const B_PILL = { current: ["ok", "Current"], stale: ["warn", "Stale"], below: ["neutral", "Below evidence floor"] };
const S_PILL = { live: ["ok", "Live"], needs_context: ["warn", "Needs context"], quarantined: ["warn", "Quarantined"], failed: ["bad", "Failed"], superseded: ["neutral", "Superseded"], retired: ["neutral", "Retired"], processing: ["info", "Processing"] };
const FRESH = { fresh: null, soft: ["warn", "Stale · soft TTL"], hard: ["bad", "Expired · not retrievable"] };

function gov(f) {
  const v = f.owner ? `<span class="v-private">Visibility <b>Private · you</b></span>` : `<span>Visibility <b>Shared</b></span>`;
  return `<span class="gov" title="Trust · Sensitivity · Visibility"><span class="t-${f.trust}">Trust <b>${f.trust}</b></span><span class="s-${f.sens}">Sensitivity <b>${f.sens}</b></span>${v}</span>`;
}
function statusPill(f) { return f.status === "verified" ? `<span class="pill ok">Verified</span>` : f.status === "rejected" ? `<span class="pill neutral">Rejected</span>` : `<span class="pill warn">Candidate</span>`; }
function freshPill(f) { const p = FRESH[f.fresh]; return p ? `<span class="pill ${p[0]}">${p[1]}</span>` : ""; }
function highlight(text, fig) {
  const t = esc(text);
  if (!fig) return t;
  const e = esc(fig);
  return t.includes(e) ? t.replace(e, `<mark>${e}</mark>`) : t;
}
function markStale(cat, cust, why) {
  BRIEFINGS.filter(b => sameScope(b, cat, cust)).forEach(b => { b.status = "stale"; b.why = why; });
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}

function briefingDoc(b) {
  const st = briefingState(b);
  const fs = briefingFacts(b);
  if (st === "below") {
    const hasMetric = fs.some(f => f.type === "metric" && f.trust === "governed");
    const expired = FACTS.filter(f => sameScope(f, b.cat, b.cust) && !isLive(f) && f.type === "metric");
    return `<div class="doc">
      <div class="label">${esc(scopeLabel(b.cat, b.cust))}</div>
      <h2>No briefing for this scope yet</h2>
      <p>This scope has ${fs.length} live ${fs.length === 1 ? "fact" : "facts"}${hasMetric ? "" : " and no live governed metric"}. A briefing needs at least 3 facts including 1 governed metric, so agents use the general selling frameworks here instead of a thin page.</p>
      <div class="meter" role="img" aria-label="${fs.length} of 3 facts"><i style="width:${Math.min(fs.length / 3, 1) * 100}%"></i></div>
      ${expired.length ? `<div class="callout">${expired.map(f => `“${esc(f.text)}” <span class="mono">${f.id}</span> expired on its freshness window. Refreshing the trade-panel view would bring this scope back over the floor.`).join("<br>")}</div>` : ""}
      <div>${fs.map(factCard).join("")}</div>
      <div class="row"><button class="btn" data-act="add-source">Add a source for this scope</button><button class="btn ghost" data-act="add-fact">Add a fact</button></div>
    </div>`;
  }
  // Select-then-cite: facts grouped by section, sources numbered in order of first appearance.
  const refs = [];
  const refOf = f => { const key = f.src || "memory:" + f.id; let i = refs.findIndex(r => r.key === key); if (i < 0) { refs.push({ key, f }); i = refs.length - 1; } return i + 1; };
  const SECTIONS = [["Where the business stands", ["metric"]], ["What shoppers and the buyer tell us", ["insight", "quote"]], ["What to do next", ["recommendation"]], ["Account memory", ["event"]]];
  const body = SECTIONS.map(([h, types]) => {
    const items = fs.filter(f => types.includes(f.type));
    if (!items.length) return "";
    return `<div class="stack"><h3>${h}</h3><ul>${items.map(f => {
      const n = refOf(f);
      const extra = [f.sens === "restricted" ? `<span class="pill bad">restricted</span>` : "", f.status === "candidate" ? `<span class="pill warn">candidate</span>` : "", f.fresh === "soft" ? `<span class="pill warn">stale</span>` : ""].join(" ");
      return `<li>${esc(f.text)} <button class="anchor" data-act="open-fact" data-id="${f.id}" title="Open ${f.id}">S${n}</button> ${extra}</li>`;
    }).join("")}</ul></div>`;
  }).join("");
  const ih = hash(fs.map(f => f.id).sort().join(","));
  return `<article class="doc">
    <div class="spread">
      <div class="stack" style="gap:4px"><div class="label">Briefing</div><h2>${esc(scopeLabel(b.cat, b.cust))}</h2><span class="facet">${facetKey(b.cat, b.cust)}</span></div>
      <div class="row"><span class="pill ${B_PILL[st][0]}">${B_PILL[st][1]}</span><button class="btn sm ${st === "stale" ? "primary" : ""}" data-act="regen" ${st === "stale" ? "" : `disabled title="The fact set is unchanged, so regenerating would change nothing."`}>Regenerate</button></div>
    </div>
    ${st === "stale" ? `<div class="verdict warn">${esc(b.why || "The facts behind this briefing changed.")} Regenerating rebuilds it from the current fact set.</div>` : ""}
    <p class="small muted">Generated ${b.generated} from ${fs.length} facts · input hash <span class="mono">${ih}</span> · private facts are never included</p>
    ${body}
    <div class="refs"><div class="label">References</div>${refs.map((r, i) => { const s = r.f.src && src(r.f.src); return `<div><span class="anchor">S${i + 1}</span> ${s ? esc(s.name) : "Account memory · workstream signal"} <span class="muted">· ${esc(s ? s.kind : "event")}</span></div>`; }).join("")}</div>
  </article>`;
}

/* ---- Ask the bank: a visible fact selection (filter, rank, collapse) ---- */
function runAsk() {
  const A = state.ask;
  const words = A.q.toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const live = FACTS.filter(visibleToMe).filter(isLive);
  const inScope = live.filter(f => f.cat === A.cat && (!f.cust || (A.cust && f.cust === A.cust)));
  const TW = { governed: 1, qualified: .8, declared: .6 };
  const ranked = inScope.map(f => {
    const overlap = words.filter(w => f.text.toLowerCase().includes(w)).length;
    const rel = Math.min(1, .45 + overlap * .15 + (f.cust ? .1 : 0));
    const score = rel * (f.status === "verified" ? 1 : .7) * TW[f.trust] * (f.fresh === "soft" ? .6 : 1);
    return { f, score };
  }).sort((a, b) => b.score - a.score).slice(0, 8);
  const merged = ranked.reduce((n, r) => n + (r.f.dedup - 1), 0);
  const hasMetric = ranked.some(r => r.f.type === "metric" && r.f.trust === "governed");
  const coverage = !ranked.length ? "none" : ranked.length >= 3 && hasMetric ? "sufficient" : "thin";
  return { live: live.length, inScope: inScope.length, ranked, merged, coverage };
}

          <div class="field"><label for="a-cust">Customer</label><select id="a-cust"><option value="">Category level</option>${CUSTOMERS.map(x => `<option ${x === A.cust ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        </div>

          <div class="seg" role="group" aria-label="Audience"><button type="button" data-aud="internal" aria-pressed="${A.audience === "internal"}">Internal prep</button><button type="button" data-aud="customer" aria-pressed="${A.audience === "customer"}">Customer-facing</button></div>
          <span class="hint">Customer-facing keeps internal and restricted facts as background only.</span>
        </div>
        <button class="btn primary" type="submit">Select facts</button>
      </form>
      <div class="stack" style="margin-top:16px"><div class="label">Try</div><div class="chips">
        ${[["What should I lead with in the Northgate range review?", "Fabric Care", "Northgate"], ["Why is our Hair Care share slipping at Brightmart?", "Hair Care", "Brightmart"], ["What do we know about Harbour & Co in Oral Care?", "Oral Care", "Harbour & Co"]].map(([q, cat, cu]) => `<button class="chip" data-act="try" data-q="${esc(q)}" data-cat="${cat}" data-cust="${esc(cu)}">${esc(q)}</button>`).join("")}

  const stalled = !["live", "superseded", "retired"].includes(s.status);
  openDrawer(`

    <h2>${esc(s.name)}</h2>
    <dl class="kv">
      <dt>Type</dt><dd>${esc(s.kind)} · ${s.lane} lane</dd>
      <dt>Scope</dt><dd>${esc(scopeLabel(s.cat, s.cust))}</dd>
      <dt>Content date</dt><dd>${s.asOf} · ${s.conf} confidence</dd>
      <dt>Trust</dt><dd>${s.trust} <span class="small muted">· set from where the source came from</span></dd>
      ${s.supersededBy ? `<dt>Superseded by</dt><dd>${esc(src(s.supersededBy).name)}</dd>` : ""}
      ${s.note ? `<dt>Note</dt><dd>${esc(s.note)}</dd>` : ""}
    </dl>
    <div class="stack"><div class="label">Pipeline</div>
      <div class="row">${STAGES.map((st, i) => `<span class="pill ${i < s.stage ? "ok" : i === s.stage && stalled ? (s.status === "processing" ? "info" : "bad") : "neutral"}">${st}</span>`).join("")}</div>
    </div>
    <div class="stack"><div class="label">Blast radius</div>
      <p>${s.facts} ${s.facts === 1 ? "fact comes" : "facts come"} from this source${briefs.length ? ` and ${briefs.length} ${briefs.length === 1 ? "briefing cites" : "briefings cite"} them` : ""}.${s.facts === 0 && s.status === "live" ? " It feeds no live facts and can be cleaned up." : ""}</p>
      ${fs.slice(0, 4).map(f => `<button class="btn ghost" data-act="open-fact" data-id="${f.id}">${f.id} · ${esc(f.text)}</button>`).join("")}
      ${other && s.facts ? `<span class="small muted">+ ${other} more facts</span>` : ""}
      ${briefs.map(b => `<span class="small">Briefing: ${esc(scopeLabel(b.cat, b.cust))}</span>`).join("")}
    </div>
    <div class="stack"><div class="label">Reclassify</div>
      <div class="row"><select class="select" id="s-sens" aria-label="New sensitivity">${["external", "internal", "restricted"].map(x => `<option ${x === s.sens ? "selected" : ""}>${x}</option>`).join("")}</select><button class="btn" data-act="reclassify" data-id="${s.id}">Apply to the source and its ${s.facts} facts</button></div>
      <span class="hint">No re-parsing and no re-mining. The label flows to every fact, and briefings citing them become stale.</span>
    </div>
    ${canRetire ? `<div class="stack"><div class="label">Retire</div>
      <label class="check"><input type="checkbox" id="s-confirm"> I understand this removes ${s.facts} facts from retrieval and cannot be undone. The original file is kept for audit.</label>
      <div><button class="btn danger" id="s-retire" data-act="retire" data-id="${s.id}" disabled>Retire source</button></div>
    </div>` : ""}`);
  $("#s-confirm")?.addEventListener("change", e => { $("#s-retire").disabled = !e.target.checked; });
}

function addFactModal() {
  const srcOpts = SOURCES.filter(s => s.status === "live").map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  openModal(`
    <header><h2>Add a fact</h2><p class="muted" style="margin-top:4px">One assertion per fact. Write it so a colleague could check it against the evidence.</p></header>
    <form>
      <div class="grid2">
        <div class="field"><label for="n-type">Type</label><select id="n-type" name="type">${TYPES.map(t => `<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="n-date">Content date</label><input id="n-date" name="asOf" value="${TODAY}"><span class="hint">The date the fact is about, not today's date.</span></div>
      </div>
      <div class="field"><label for="n-text">Statement</label><textarea id="n-text" name="text" required placeholder="e.g. Northgate will cut laundry SKUs by 10% at the November range review."></textarea></div>
      <div class="grid3">
        <div class="field"><label for="n-fig">Figure (optional)</label><input id="n-fig" name="fig" placeholder="10%"></div>
        <div class="field"><label for="n-period">Period (optional)</label><input id="n-period" name="period" placeholder="FY 2026-27"></div>
        <div class="field"><label for="n-cat">Category</label><select id="n-cat" name="cat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="n-cust">Customer</label><select id="n-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option ${c === "Northgate" ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
        <div class="field"><label for="n-src">Evidence</label><select id="n-src" name="src"><option value="">My own knowledge</option>${srcOpts}</select></div>
      </div>
      <div class="field"><label for="n-ex">Supporting passage</label><textarea id="n-ex" name="excerpt" rows="2" placeholder="Paste the sentence or note that backs this up. Any figure must appear here."></textarea></div>
      <div class="grid2">
        <div class="field"><label for="n-sens">Sensitivity</label><select id="n-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div>
        <div class="field"><label for="n-vis">Visibility</label><select id="n-vis" name="vis"><option value="shared">Shared with the team</option><option value="private">Private to me</option></select></div>
      </div>
      <p class="hint" id="n-err" style="color:var(--bad)" hidden></p>
      <div class="callout">New facts start as <strong>candidate</strong>. Trust comes from the evidence, so your own knowledge is <strong>declared</strong>. A reviewer verifies it before any tool can quote it.</div>
      <div class="foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Add fact</button></div>
    </form>`, fd => {
      const fig = fd.get("fig").trim(), ex = fd.get("excerpt").trim();
      if (fig && !ex.includes(fig)) {
        const e = $("#n-err"); e.hidden = false;
        e.textContent = `The figure “${fig}” is not in the supporting passage. Add it to the passage or remove the figure.`;
        return;
      }
      const s = fd.get("src") ? src(fd.get("src")) : null;
      const f = { id: "F-" + (2000 + FACTS.length), type: fd.get("type"), text: fd.get("text").trim(), fig: fig || null, period: fd.get("period").trim() || null, cat: fd.get("cat"), cust: fd.get("cust") || null,
        trust: s ? s.trust : "declared", sens: fd.get("sens"), owner: fd.get("vis") === "private" ? ME : null, status: "candidate", asOf: fd.get("asOf") || TODAY, fresh: "fresh",
        src: s ? s.id : null, loc: "Added by you", excerpt: ex || "No passage given.", dedup: 1 };
      FACTS.unshift(f);
      if (!f.owner) markStale(f.cat, f.cust, "A new fact arrived for this scope.");
      closeOverlay();
      state.f = { ...blankFilter(), cat: f.cat, cust: f.cust || "_cat" };
      go("facts"); toast(`Fact added as candidate${f.owner ? " · private to you" : ""}`);
    });
}

function addSourceModal() {
  openModal(`
    <header><h2>Add source</h2><p class="muted" style="margin-top:4px">The file is quality-checked, chunked and mined into candidate facts.</p></header>
    <form>
      <div class="field"><label for="u-name">File or link</label><input id="u-name" name="name" required placeholder="e.g. Brightmart JBP 2026-27.pptx or a SharePoint Sales Book link"></div>
      <div class="grid2">
        <div class="field"><label for="u-kind">Type</label><select id="u-kind" name="kind"><option>Deck</option><option>PDF</option><option>SharePoint Sales Book</option><option>Word document</option><option>Spreadsheet</option></select></div>
        <div class="field"><label for="u-sens">Sensitivity</label><select id="u-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="u-cat">Category</label><select id="u-cat" name="cat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="u-cust">Customer</label><select id="u-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
      </div>
      <p class="hint">Certified trade-panel numbers arrive through the data lane on a schedule. You don't upload them.</p>
      <div class="foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Start ingestion</button></div>
    </form>`, fd => {
      const s = { id: "S-" + (20 + SOURCES.length), name: fd.get("name"), kind: fd.get("kind"), lane: "Document", cat: fd.get("cat"), cust: fd.get("cust") || null, status: "processing", sens: fd.get("sens"), trust: fd.get("kind") === "SharePoint Sales Book" ? "declared" : "qualified", asOf: "reading…", conf: "medium", facts: 0, stage: 0 };
      SOURCES.unshift(s);
      closeOverlay(); go("sources"); toast("Ingestion started");
      const t = setInterval(() => {
        s.stage++;
        if (s.stage >= STAGES.length) { clearInterval(t); s.status = "live"; s.asOf = "12 Sep 2026"; s.facts = 11; markStale(s.cat, s.cust, "New facts arrived from a new source."); toast(`${s.name}: 11 candidate facts mined`); }
        if (state.view === "sources" && !$("#overlay").children.length) render();
      }, 650);
    });
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav) { closeOverlay(); go(nav.dataset.view); return; }
  const ft = e.target.closest("[data-ftype]");
  if (ft) { state.f.type = ft.dataset.ftype; render(); return; }
  const aud = e.target.closest("[data-aud]");
  if (aud) { readAskForm(); state.ask.audience = aud.dataset.aud; render(); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "close") { if (e.target === el || el.tagName === "BUTTON") closeOverlay(); return; }
  if (a === "add-fact") addFactModal();
  if (a === "add-source") addSourceModal();
  if (a === "open-fact") factDrawer(id);
  if (a === "open-source") sourceDrawer(id);
  if (a === "clear-filters") { state.f = blankFilter(); render(); }
  if (a === "cell") { state.f = { ...blankFilter(), cat: el.dataset.cat, cust: el.dataset.cust || "_cat" }; go("facts"); }
  if (a === "facts-status") { state.f = { ...blankFilter(), status: el.dataset.status }; go("facts"); }
  if (a === "todo") state.todo[+el.dataset.k]?.go();
  if (a === "pick-brief") { state.brief = +el.dataset.i; render(); }
  if (a === "regen") { const b = BRIEFINGS[state.brief]; b.status = "current"; b.generated = TODAY; delete b.why; render(); toast("Briefing rebuilt from the current fact set"); }
  if (a === "try") { Object.assign(state.ask, { q: el.dataset.q, cat: el.dataset.cat, cust: el.dataset.cust }); render(); }
  if (a === "verify" || a === "reject") {
    const f = fact(id); f.status = a === "verify" ? "verified" : "rejected";
    if (!f.owner) markStale(f.cat, f.cust, a === "verify" ? "A fact was verified." : "A fact was rejected.");
    render(); if (a === "verify") factDrawer(id); else closeOverlay();
    toast(a === "verify" ? "Verified. Tools can quote it where its sensitivity allows." : "Rejected. It will not be retrieved.");
  }
  if (a === "reclassify") {
    const s = src(id), v = $("#s-sens").value;
    s.sens = v; FACTS.filter(f => f.src === id).forEach(f => { f.sens = v; markStale(f.cat, f.cust, "A source it cites was reclassified."); });
    render(); sourceDrawer(id); toast(`Reclassified to ${v}: the source and its ${s.facts} facts`);
  }
  if (a === "retire") {
    const s = src(id); s.status = "retired";
    const hit = new Set();
    FACTS.filter(f => f.src === id).forEach(f => { BRIEFINGS.filter(b => sameScope(b, f.cat, f.cust)).forEach(b => hit.add(b)); markStale(f.cat, f.cust, "A source it cited was retired."); });
    closeOverlay(); render(); toast(`Retired. ${s.facts} facts removed from retrieval, ${hit.size} ${hit.size === 1 ? "briefing" : "briefings"} marked stale`);
  }
  if (a === "resolve") {
    const r = REVIEW.find(x => x.id === id);
    if (r.fact && el.dataset.choice.startsWith("Approve")) { const f = fact(r.fact); f.status = "verified"; f.sens = "external"; markStale(f.cat, f.cust, "A quote was approved."); }
    REVIEW = REVIEW.filter(x => x.id !== id);
    render(); toast(`${r.kind}: ${el.dataset.choice}`);
  }
});
document.addEventListener("change", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { state.f[f.dataset.filter] = f.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeOverlay();
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
});

render();
</script>
