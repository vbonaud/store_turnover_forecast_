<title>Knowledge Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left rail (sections) + main workspace. Knowledge view = domain list | entries. Collapses to a top bar under 820px. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --sunken: #eaeeec;
  --line: #d8dfdc;
  --fg: #17211d;
  --muted: #5b6863;
  --accent: #1f6b57;
  --accent-soft: #dcede7;
  --accent-fg: #ffffff;
  --ok: #2e7d4f;   --ok-soft: #e1f2e7;
  --warn: #9a6500; --warn-soft: #fbefd6;
  --bad: #b3372b;  --bad-soft: #f9e2df;
  --info: #3659a8; --info-soft: #e3e9f7;
  --shadow: 0 8px 30px rgba(20, 40, 32, .12);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --sunken: #0d1311; --line: #2a3531;
    --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
    --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;
    --bad: #f08c80; --bad-soft: #3d1c18; --info: #8fb0f5; --info-soft: #1c2742;
    --shadow: 0 8px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --sunken: #0d1311; --line: #2a3531;
  --fg: #e4ebe8; --muted: #93a29c; --accent: #5cc3a3; --accent-soft: #1d3a31; --accent-fg: #07130f;
  --ok: #6fcf94; --ok-soft: #173424; --warn: #e8b454; --warn-soft: #3a2c10;
  --bad: #f08c80; --bad-soft: #3d1c18; --info: #8fb0f5; --info-soft: #1c2742;
  --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }

/* Rail */
.rail { background: var(--sunken); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 700 14px var(--f-display); }
.brand b { font: 700 16px var(--f-display); display: block; }
.brand small { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface); color: var(--fg); }
.nav button[aria-current="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { font: 500 11px var(--f-mono); color: var(--muted); }
.rail-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.rail-foot div { font-size: 12px; line-height: 1.3; }

/* Main */
.main { min-width: 0; overflow-y: auto; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 24px 28px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar h1 { font-size: 22px; }
.topbar p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 7px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.content { padding: 22px 28px 40px; }
.mock-note { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); background: var(--sunken); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 10px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
.summary > div { background: var(--surface); padding: 14px 16px; }
.summary .num { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; }
.summary .sub { font-size: 12px; color: var(--muted); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.info { color: var(--info); background: var(--info-soft); }
.tag { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }

/* Knowledge view */
.kgrid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; align-items: start; }
.domains { display: flex; flex-direction: column; gap: 6px; }
.domain { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 12px 14px; display: grid; gap: 6px; }
.domain:hover { border-color: var(--muted); }
.domain[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.domain strong { font: 600 14px var(--f-display); }
.domain .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .v { background: var(--ok); } .bar .d { background: var(--warn); } .bar .r { background: var(--bad); }

.entries-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.entries-head h2 { font-size: 18px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 10px; width: 220px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
.entry + .entry { margin-top: 10px; }
.entry-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.entry-top .left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.type { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.entry h3 { font-size: 15px; }
.entry p { margin: 0; max-width: 75ch; }
.entry-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.conf { display: inline-flex; gap: 2px; vertical-align: middle; }
.conf i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.conf i.on { background: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }

/* Data view */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
td .name { font-weight: 600; }
td .desc { font-size: 12px; color: var(--muted); max-width: 42ch; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }

/* Agent view */
.agent { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
.thread { display: flex; flex-direction: column; gap: 14px; }
.msg { display: grid; gap: 8px; }
.msg.user { justify-items: end; }
.bubble { background: var(--accent); color: var(--accent-fg); padding: 10px 14px; border-radius: 12px 12px 3px 12px; max-width: 70ch; }
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.answer p { margin: 0; max-width: 75ch; }
.answer ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.steps { display: grid; gap: 4px; font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.steps .done::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.steps .run::before { content: "… "; color: var(--warn); font-weight: 700; }
.cite { font: 500 10px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 4px; vertical-align: 1px; }
.answer-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }
.composer { position: sticky; bottom: 0; margin-top: 18px; background: var(--bg); padding-block: 10px 4px; }
.composer form { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; padding: 6px 8px; outline: none; }
.scope { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; }
.side { display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.suggest { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; font-size: 13px; }
.suggest:hover { border-color: var(--accent); }
.history { display: grid; gap: 8px; font-size: 13px; }
.history div { display: flex; justify-content: space-between; gap: 8px; }
.history .mono { white-space: nowrap; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 12, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
.modal header { padding: 18px 20px 0; }
.modal header h2 { font-size: 18px; }
.modal form { padding: 16px 20px 20px; display: grid; gap: 14px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; width: 100%; }
.field textarea { resize: vertical; min-height: 90px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 400; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .agent { grid-template-columns: minmax(0, 1fr); }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav button { width: auto; }
  .nav .count, .rail-foot, .brand small { display: none; }
  .topbar, .content { padding-inline: 16px; }
  .kgrid { grid-template-columns: minmax(0, 1fr); }
  .domains { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .domain { min-width: 200px; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .answer, .entry { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">KB</div>
      <div><b>Knowledge Bank</b><small>Retail forecasting</small></div>
    </div>
    <nav class="nav" aria-label="Sections">
      <button data-view="knowledge" aria-current="true">My knowledge <span class="count" id="c-knowledge"></span></button>
      <button data-view="data">Data sources <span class="count" id="c-data"></span></button>
      <button data-view="agent">Research agent <span class="count">beta</span></button>
    </nav>
    <div class="rail-foot">
      <div class="avatar">CM</div>
      <div><strong>Camille Martin</strong><br><span class="muted">Domain expert · Sales ops</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title"></h1>
        <p id="view-sub"></p>
      </div>
      <div class="actions" id="view-actions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Mock data (no backend) ---------- */
const SOURCES = [
  { id: "SRC-01", name: "store_daily_sales", kind: "Table", system: "Sales warehouse", owner: "Data platform", desc: "Daily turnover per store and business unit, 2012 onward.", rows: "2.4M rows", fresh: "Updated 3 h ago", status: "ok", used: 9 },
  { id: "SRC-02", name: "bu_features", kind: "Table", system: "Sales warehouse", owner: "Data science", desc: "Business unit attributes: surface area, region, format, opening date.", rows: "312 rows", fresh: "Updated 6 d ago", status: "ok", used: 6 },
  { id: "SRC-03", name: "Promo calendar 2026", kind: "Spreadsheet", system: "Shared drive", owner: "Marketing", desc: "National and regional promotion windows with discount depth.", rows: "148 events", fresh: "Updated 41 d ago", status: "warn", used: 4 },
  { id: "SRC-04", name: "Weekly performance review", kind: "Dashboard", system: "BI portal", owner: "Sales ops", desc: "Week-over-week turnover vs. forecast by region.", rows: "18 charts", fresh: "Updated yesterday", status: "ok", used: 3 },
  { id: "SRC-05", name: "Store opening playbook", kind: "Document", system: "Wiki", owner: "Expansion team", desc: "Ramp-up expectations for new stores in their first 52 weeks.", rows: "34 pages", fresh: "Updated 8 months ago", status: "warn", used: 2 },
  { id: "SRC-06", name: "Regional weather feed", kind: "API", system: "External vendor", owner: "Data platform", desc: "Daily temperature and precipitation per department.", rows: "Daily", fresh: "Access requested", status: "bad", used: 0 },
  { id: "SRC-07", name: "Baseline forecasts (Prophet)", kind: "Model output", system: "Notebooks", owner: "Data science", desc: "8-week-ahead baseline turnover per business unit.", rows: "baseline_forecasts.csv", fresh: "Updated 12 d ago", status: "ok", used: 3 },
];

const DOMAINS = [
  { id: "d1", name: "Turnover drivers", desc: "What moves weekly store turnover." },
  { id: "d2", name: "Seasonality & calendar", desc: "Holidays, school breaks and yearly cycles." },
  { id: "d3", name: "Promotions & pricing", desc: "Uplift and cannibalisation from promo events." },
  { id: "d4", name: "Store network", desc: "Openings, closures, refurbishments and formats." },
];

let ENTRIES = [
  { id: 1, domain: "d1", type: "Rule", title: "Turnover is modelled weekly, per business unit", body: "Forecasts are produced at business-unit × department × week grain. Daily data is aggregated Monday to Sunday before modelling so weekend peaks do not distort the trend.", conf: 5, status: "Validated", sources: ["SRC-01", "SRC-07"], author: "Camille Martin", date: "12 Sep 2026" },
  { id: 2, domain: "d1", type: "Insight", title: "Surface area explains most of the level difference between stores", body: "Once turnover is normalised per m², the gap between large and small formats shrinks by roughly two thirds. Use turnover per m² when comparing stores across regions.", conf: 4, status: "Validated", sources: ["SRC-02", "SRC-01"], author: "Camille Martin", date: "3 Sep 2026" },
  { id: 3, domain: "d1", type: "Assumption", title: "Weather effect is small outside garden and outdoor departments", body: "We assume temperature has no material effect on indoor departments. Not yet tested, pending access to the weather feed.", conf: 2, status: "Needs review", sources: ["SRC-06"], author: "Camille Martin", date: "28 Aug 2026" },
  { id: 4, domain: "d2", type: "Rule", title: "Week 52 and week 1 are handled as special weeks", body: "Christmas and New Year weeks break the yearly pattern. Flag them explicitly as holiday features rather than letting the model learn them from week-of-year alone.", conf: 5, status: "Validated", sources: ["SRC-01"], author: "Camille Martin", date: "15 Jul 2026" },
  { id: 5, domain: "d2", type: "Insight", title: "Spring peak starts two weeks earlier in southern regions", body: "Garden departments in southern stores peak around week 12, versus week 14 in the north. A single national seasonality curve under-forecasts the south in March.", conf: 3, status: "Draft", sources: ["SRC-01", "SRC-04"], author: "Research agent", date: "22 Sep 2026" },
  { id: 6, domain: "d3", type: "Definition", title: "Promo uplift", body: "Turnover during the promotion window minus the baseline forecast for the same weeks, divided by that baseline. Measured per department, never per store total.", conf: 4, status: "Validated", sources: ["SRC-03", "SRC-07"], author: "Camille Martin", date: "2 Jun 2026" },
  { id: 7, domain: "d3", type: "Insight", title: "Deep discounts pull demand from the following two weeks", body: "Promotions above 30% discount show a post-promo dip of 8–12% over the next two weeks. Net uplift is lower than the headline figure.", conf: 3, status: "Needs review", sources: ["SRC-03", "SRC-01"], author: "Camille Martin", date: "19 May 2026" },
  { id: 8, domain: "d4", type: "Rule", title: "Exclude new stores from training for their first 26 weeks", body: "New stores ramp up for about six months and follow a different curve. Keep them out of the main training set and forecast them with the ramp-up profile from the opening playbook.", conf: 4, status: "Validated", sources: ["SRC-05", "SRC-02"], author: "Camille Martin", date: "10 Apr 2026" },
];

const STATUS_CLASS = { "Validated": "ok", "Draft": "warn", "Needs review": "bad" };
const SOURCE_LABEL = { ok: "Connected", warn: "Stale", bad: "Pending access" };

/* ---------- State ---------- */
const state = { view: "knowledge", domain: "d1", query: "", status: "All", thread: [] };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const srcName = id => (SOURCES.find(s => s.id === id) || {}).name || id;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2400);
}

/* ---------- Views ---------- */
const VIEWS = {
  knowledge: {
    title: "My knowledge",
    sub: "Rules, definitions and insights you have captured, grouped by domain. Each item links to the data that supports it.",
    actions: `<button class="btn" data-act="new-domain">New domain</button><button class="btn primary" data-act="new-entry">Add knowledge</button>`,
    render: renderKnowledge,
  },
  data: {
    title: "Data sources",
    sub: "Internal data the research agent can read, and how fresh it is.",
    actions: `<button class="btn primary" data-act="connect">Connect a source</button>`,
    render: renderData,
  },
  agent: {
    title: "Research agent",
    sub: "Ask a question in plain language. The agent searches connected sources, shows its steps, and cites what it used.",
    actions: `<button class="btn" data-act="clear-thread">New conversation</button>`,
    render: renderAgent,
  },
};

function render() {
  const v = VIEWS[state.view];
  $("#view-title").textContent = v.title;
  $("#view-sub").textContent = v.sub;
  $("#view-actions").innerHTML = v.actions;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === state.view));
  $("#c-knowledge").textContent = ENTRIES.length;
  $("#c-data").textContent = SOURCES.length;
  v.render($("#view"));
}

function summaryStrip() {
  const validated = ENTRIES.filter(e => e.status === "Validated").length;
  const review = ENTRIES.filter(e => e.status !== "Validated").length;
  const connected = SOURCES.filter(s => s.status === "ok").length;
  return `<section class="summary" aria-label="Summary">
    <div><div class="label">Knowledge items</div><div class="num">${ENTRIES.length}</div><div class="sub">across ${DOMAINS.length} domains</div></div>
    <div><div class="label">Validated</div><div class="num">${validated}</div><div class="sub">${Math.round(validated / ENTRIES.length * 100)}% of the bank</div></div>
    <div><div class="label">To review</div><div class="num">${review}</div><div class="sub">drafts and flagged items</div></div>
    <div><div class="label">Data sources</div><div class="num">${connected}/${SOURCES.length}</div><div class="sub">connected and fresh</div></div>
  </section>`;
}

function confDots(n) {
  return `<span class="conf" title="Confidence ${n}/5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
}

function renderKnowledge(el) {
  const domainCards = DOMAINS.map(d => {
    const items = ENTRIES.filter(e => e.domain === d.id);
    const n = items.length || 1;
    const v = items.filter(e => e.status === "Validated").length;
    const dr = items.filter(e => e.status === "Draft").length;
    const r = items.filter(e => e.status === "Needs review").length;
    return `<button class="domain" data-domain="${d.id}" aria-pressed="${d.id === state.domain}">
      <strong>${esc(d.name)}</strong>
      <span class="muted" style="font-size:12px">${esc(d.desc)}</span>
      <span class="bar" aria-hidden="true"><i class="v" style="width:${v/n*100}%"></i><i class="d" style="width:${dr/n*100}%"></i><i class="r" style="width:${r/n*100}%"></i></span>
      <span class="meta"><span>${items.length} ${items.length === 1 ? "item" : "items"}</span><span>${v} validated</span></span>
    </button>`;
  }).join("");

  const dom = DOMAINS.find(d => d.id === state.domain);
  const q = state.query.toLowerCase();
  const list = ENTRIES.filter(e => e.domain === state.domain)
    .filter(e => state.status === "All" || e.status === state.status)
    .filter(e => !q || (e.title + " " + e.body).toLowerCase().includes(q));

  const entries = list.length ? list.map(e => `
    <article class="entry">
      <div class="entry-top">
        <div class="left"><span class="type">${e.type}</span><span class="pill ${STATUS_CLASS[e.status]}">${e.status}</span></div>
        <div class="left">${confDots(e.conf)}<button class="btn small" data-act="edit" data-id="${e.id}">Edit</button></div>
      </div>
      <h3>${esc(e.title)}</h3>
      <p>${esc(e.body)}</p>
      <div class="entry-foot">
        <div class="sources">${e.sources.map(s => `<span class="tag" title="${esc(srcName(s))}">${s} · ${esc(srcName(s))}</span>`).join("")}</div>
        <span>${esc(e.author)} · ${e.date}</span>
      </div>
    </article>`).join("")
    : `<div class="empty">No items match. <button class="btn ghost" data-act="new-entry">Add the first one</button></div>`;

  el.innerHTML = `
    <div style="margin-bottom:14px"><span class="mock-note">Mock-up · sample data, nothing is saved</span></div>
    ${summaryStrip()}
    <div class="kgrid">
      <div>
        <div class="label" style="margin:0 0 8px 2px">Domains</div>
        <div class="domains">${domainCards}</div>
      </div>
      <section>
        <div class="entries-head">
          <h2>${esc(dom.name)}</h2>
          <div class="filters">
            <input class="search" id="q" type="search" placeholder="Search this domain" value="${esc(state.query)}" aria-label="Search this domain">
            <div class="seg" role="group" aria-label="Filter by status">
              ${["All", "Validated", "Draft", "Needs review"].map(s => `<button data-status="${s}" aria-pressed="${s === state.status}">${s}</button>`).join("")}
            </div>
          </div>
        </div>
        ${entries}
      </section>
    </div>`;

  const q$ = $("#q");
  q$.addEventListener("input", e => {
    state.query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos);
  });
}

function renderData(el) {
  const rows = SOURCES.map(s => `
    <tr>
      <td><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.desc)}</div></td>
      <td><span class="tag">${s.kind}</span></td>
      <td>${esc(s.system)}<div class="desc">${esc(s.owner)}</div></td>
      <td class="mono">${esc(s.rows)}</td>
      <td><span class="pill ${s.status}">${SOURCE_LABEL[s.status]}</span><div class="desc">${esc(s.fresh)}</div></td>
      <td class="num">${ENTRIES.filter(e => e.sources.includes(s.id)).length}</td>
      <td><button class="btn small" data-act="ask-source" data-id="${s.id}">Ask agent</button></td>
    </tr>`).join("");

  el.innerHTML = `
    <div style="margin-bottom:14px"><span class="mock-note">Mock-up · sample data, nothing is saved</span></div>
    ${summaryStrip()}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Source</th><th>Type</th><th>System · owner</th><th>Size</th><th>Status</th><th class="num">Linked items</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* ---------- Agent ---------- */
const SAMPLE_Q = "How much did the spring peak shift between northern and southern stores over the last three years?";
const SAMPLE_A = {
  steps: [
    "Read knowledge domain “Seasonality & calendar” (2 items)",
    "Queried store_daily_sales · garden departments · weeks 8–20, 2023–2026",
    "Joined bu_features on region",
    "Compared with Weekly performance review dashboard",
  ],
  html: `<p>The spring peak in garden departments arrives <strong>about two weeks earlier in the south</strong> than in the north, and the gap has been stable for three years <span class="cite">SRC-01</span> <span class="cite">SRC-02</span>.</p>
    <ul>
      <li>South: peak week 12 (2024), 12 (2025), 11 (2026)</li>
      <li>North: peak week 14 (2024), 14 (2025), 14 (2026)</li>
      <li>March forecasts for southern stores were under the actuals by 9% on average <span class="cite">SRC-04</span></li>
    </ul>
    <p class="muted">This supports the draft insight “Spring peak starts two weeks earlier in southern regions”. You could raise its confidence and mark it validated.</p>`,
  sources: ["SRC-01", "SRC-02", "SRC-04"],
  suggestion: { domain: "d2", type: "Insight", title: "Spring peak is ~2 weeks earlier in southern stores (stable 2024–2026)", body: "Garden departments peak around week 11–12 in the south and week 14 in the north. March forecasts for the south were 9% under actuals on average when using a single national curve.", sources: ["SRC-01", "SRC-02", "SRC-04"] },
};

function cannedAnswer(q) {
  const pick = SOURCES.filter(s => s.status === "ok").slice(0, 2);
  return {
    steps: [`Searched knowledge bank for “${q.slice(0, 40)}${q.length > 40 ? "…" : ""}”`, `Queried ${pick[0].name}`, `Cross-checked with ${pick[1].name}`],
    html: `<p>This is a placeholder answer. In the real product the agent would query <strong>${esc(pick[0].name)}</strong> and <strong>${esc(pick[1].name)}</strong> and return figures with citations <span class="cite">${pick[0].id}</span> <span class="cite">${pick[1].id}</span>.</p>
      <p class="muted">Tip: if the answer is useful, save it to your knowledge bank so the next forecast can use it.</p>`,
    sources: pick.map(s => s.id),
    suggestion: { domain: state.domain, type: "Insight", title: q.slice(0, 80), body: "Summary of the agent's findings (edit before saving).", sources: pick.map(s => s.id) },
  };
}

function answerHTML(a, i, running) {
  return `<div class="msg">
    <div class="answer">
      <div class="label">Research agent</div>
      <div class="steps">${a.steps.map((s, k) => `<div class="${running && k === a.steps.length - 1 ? "run" : "done"}">${esc(s)}</div>`).join("")}</div>
      ${running ? "" : a.html}
      ${running ? "" : `<div class="answer-foot">
        <div class="sources">${a.sources.map(s => `<span class="tag">${s} · ${esc(srcName(s))}</span>`).join("")}</div>
        <div class="actions"><button class="btn small" data-act="copy" data-i="${i}">Copy</button><button class="btn small primary" data-act="save-answer" data-i="${i}">Save to knowledge</button></div>
      </div>`}
    </div>
  </div>`;
}

function renderAgent(el) {
  const thread = state.thread.map((m, i) => m.role === "user"
    ? `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`
    : answerHTML(m.answer, i, m.running)).join("");

  el.innerHTML = `
    <div style="margin-bottom:14px"><span class="mock-note">Mock-up · answers are scripted</span></div>
    <div class="agent">
      <section>
        <div class="thread">${thread || `<div class="empty">Ask about turnover, promotions, seasonality or stores. The agent only reads the sources listed under Data sources.</div>`}</div>
        <div class="composer">
          <form id="ask">
            <textarea id="ask-input" rows="2" placeholder="Ask the agent to research internal data…" aria-label="Question for the research agent"></textarea>
            <button class="btn primary" type="submit">Ask</button>
          </form>
          <div class="scope"><span>Searching:</span>${SOURCES.filter(s => s.status !== "bad").map(s => `<span class="tag">${esc(s.name)}</span>`).join("")}</div>
        </div>
      </section>
      <aside class="side">
        <div class="panel">
          <div class="label">Try asking</div>
          ${["Which stores under-performed their forecast last month?", "What was the average uplift of the May promotions by department?", "How long do new stores take to reach their target turnover?"].map(s => `<button class="suggest" data-act="suggest">${s}</button>`).join("")}
        </div>
        <div class="panel">
          <div class="label">Recent research</div>
          <div class="history">
            <div><span>Post-promo dip after deep discounts</span><span class="muted mono">19 May</span></div>
            <div><span>Ramp-up curve for 2025 openings</span><span class="muted mono">10 Apr</span></div>
            <div><span>Turnover per m² by region</span><span class="muted mono">3 Sep</span></div>
          </div>
        </div>
      </aside>
    </div>`;

  $("#ask").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#ask-input").value.trim();
    if (v) ask(v);
  });
  $("#ask-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask").requestSubmit(); }
  });
}

function ask(q) {
  const a = cannedAnswer(q);
  state.thread.push({ role: "user", text: q });
  const msg = { role: "agent", answer: { ...a, steps: [a.steps[0]] }, running: true };
  state.thread.push(msg);
  render();
  let k = 1;
  const tick = setInterval(() => {
    if (k < a.steps.length) { msg.answer.steps = a.steps.slice(0, ++k); }
    else { clearInterval(tick); msg.running = false; msg.answer = a; }
    if (state.view === "agent") render();
  }, 700);
}

/* ---------- Modals ---------- */
function openModal(html, onSubmit) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const form = $("form", root);
  form.addEventListener("submit", e => { e.preventDefault(); onSubmit(new FormData(form)); closeModal(); });
  const first = $("input, select, textarea", root); if (first) first.focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; }

function entryModal(pre = {}, editId = null) {
  const srcChecks = SOURCES.map(s => `<label><input type="checkbox" name="sources" value="${s.id}" ${(pre.sources || []).includes(s.id) ? "checked" : ""}> ${esc(s.name)}</label>`).join("");
  openModal(`
    <header><h2>${editId ? "Edit knowledge" : "Add knowledge"}</h2><p class="muted" style="margin:4px 0 0">Write it the way you would explain it to a new analyst.</p></header>
    <form>
      <div class="row2">
        <div class="field"><label for="f-domain">Domain</label><select id="f-domain" name="domain">${DOMAINS.map(d => `<option value="${d.id}" ${d.id === (pre.domain || state.domain) ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="f-type">Type</label><select id="f-type" name="type">${["Rule", "Definition", "Insight", "Assumption"].map(t => `<option ${t === pre.type ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="f-title">Title</label><input id="f-title" name="title" required value="${esc(pre.title || "")}" placeholder="e.g. Exclude new stores for their first 26 weeks"></div>
      <div class="field"><label for="f-body">Explanation</label><textarea id="f-body" name="body" required placeholder="What is true, when it applies, and why it matters for the forecast.">${esc(pre.body || "")}</textarea></div>
      <div class="row2">
        <div class="field"><label for="f-conf">Confidence (1–5)</label><input id="f-conf" name="conf" type="number" min="1" max="5" value="${pre.conf || 3}"></div>
        <div class="field"><label for="f-status">Status</label><select id="f-status" name="status">${["Draft", "Validated", "Needs review"].map(s => `<option ${s === (pre.status || "Draft") ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Supporting data</label><div class="checks">${srcChecks}</div></div>
      <div class="foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">${editId ? "Save changes" : "Add to knowledge bank"}</button></div>
    </form>`, fd => {
      const data = { domain: fd.get("domain"), type: fd.get("type"), title: fd.get("title"), body: fd.get("body"), conf: Math.max(1, Math.min(5, +fd.get("conf") || 3)), status: fd.get("status"), sources: fd.getAll("sources") };
      if (editId) Object.assign(ENTRIES.find(e => e.id === editId), data);
      else ENTRIES.unshift({ id: Date.now(), author: "Camille Martin", date: "30 Sep 2026", ...data });
      state.domain = data.domain; state.view = "knowledge"; state.status = "All"; state.query = "";
      render(); toast(editId ? "Changes saved" : "Added to knowledge bank");
    });
}

function domainModal() {
  openModal(`
    <header><h2>New domain</h2></header>
    <form>
      <div class="field"><label for="d-name">Name</label><input id="d-name" name="name" required placeholder="e.g. Competitor activity"></div>
      <div class="field"><label for="d-desc">What it covers</label><input id="d-desc" name="desc" placeholder="One line"></div>
      <div class="foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Create domain</button></div>
    </form>`, fd => {
      const id = "d" + Date.now();
      DOMAINS.push({ id, name: fd.get("name"), desc: fd.get("desc") || "No description yet." });
      state.domain = id; render(); toast("Domain created");
    });
}

function connectModal() {
  openModal(`
    <header><h2>Connect a source</h2><p class="muted" style="margin:4px 0 0">The data owner gets an access request.</p></header>
    <form>
      <div class="field"><label for="s-kind">Type</label><select id="s-kind" name="kind"><option>Table</option><option>Dashboard</option><option>Document</option><option>Spreadsheet</option><option>API</option></select></div>
      <div class="field"><label for="s-name">Name or location</label><input id="s-name" name="name" required placeholder="e.g. competitor_openings"></div>
      <div class="field"><label for="s-owner">Owner</label><input id="s-owner" name="owner" placeholder="Team or person"></div>
      <div class="foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Request access</button></div>
    </form>`, fd => {
      SOURCES.push({ id: "SRC-" + String(SOURCES.length + 1).padStart(2, "0"), name: fd.get("name"), kind: fd.get("kind"), system: "Pending", owner: fd.get("owner") || "Unknown", desc: "Awaiting owner approval.", rows: "—", fresh: "Access requested", status: "bad", used: 0 });
      render(); toast("Access requested");
    });
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest(".nav button");
  if (nav) { state.view = nav.dataset.view; render(); return; }
  const dom = e.target.closest("[data-domain]");
  if (dom) { state.domain = dom.dataset.domain; state.query = ""; render(); return; }
  const st = e.target.closest("[data-status]");
  if (st) { state.status = st.dataset.status; render(); return; }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "close-modal" && (e.target === act || act.tagName === "BUTTON")) closeModal();
  if (a === "new-entry") entryModal();
  if (a === "new-domain") domainModal();
  if (a === "connect") connectModal();
  if (a === "edit") { const en = ENTRIES.find(x => x.id === +act.dataset.id); entryModal(en, en.id); }
  if (a === "save-answer") entryModal({ ...state.thread[+act.dataset.i].answer.suggestion, status: "Draft", conf: 3 });
  if (a === "copy") {
    const txt = act.closest(".answer").innerText;
    navigator.clipboard?.writeText(txt).then(() => toast("Copied"), () => toast("Copy not available here"));
  }
  if (a === "suggest") { state.view = "agent"; ask(act.textContent); }
  if (a === "ask-source") { state.view = "agent"; ask(`Summarise what ${srcName(act.dataset.id)} tells us about turnover this quarter`); }
  if (a === "clear-thread") { state.thread = []; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* Seed the agent view with one worked example */
state.thread = [{ role: "user", text: SAMPLE_Q }, { role: "agent", answer: SAMPLE_A, running: false }];
render();
</script>
