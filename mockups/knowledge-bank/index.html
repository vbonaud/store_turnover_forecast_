<title>Knowledge Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: AI Sales Assistant shell. App bar on top, grey sidebar, white main.
   Tokens mirror the product's design (customer-profile-builder mockup). Light theme only, by design. */
:root {
  --primary: #003DA5; --primary-dark: #002D7A; --primary-light: #ECF3FF; --primary-lighter: #D1E2FF; --border-primary-light: #A7C6FC;
  --charcoal: #14171B; --slate: #3E4654; --steel: #6B7587; --snow: #FAFAFB;
  --light-gray: #E5E7EB; --gray: #D1D5DB; --border-default: #CACFD8; --surface: #F2F4F6; --white: #FFFFFF;
  --alert-bg: #FFF6DB; --alert-text: #523D00; --alert-accent: #FABB00; --alert-border: #F2DFA0;
  --ok-bg: #E5FFEF; --ok-text: #003D16; --ok-accent: #008530; --ok-border: #9FE4BC;
  --err-bg: #FFF1F0; --err-text: #510400; --err-accent: #DE1409; --err-border: #F6C3BF;
  --info-accent: #7115B2;
  --ink: #0B1B3B; --mark: #FFF1B8; --scrim: rgba(0, 0, 0, .45);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 23, 27, .06), 0 4px 16px rgba(20, 23, 27, .05);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, .25);
  --mont: "Montserrat", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --inter: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--charcoal); font: 14px/1.55 var(--inter); }
h1, h2, h3, h4 { font-family: var(--mont); margin: 0; color: var(--charcoal); text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, select:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--steel); }
.small { font-size: 12px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--steel); }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.term { border-bottom: 1px dotted var(--steel); cursor: help; }
details > summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 12.5px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+"; font-weight: 700; }
details[open] > summary::before { content: "\2212"; }
details[open] > summary { margin-bottom: 10px; }

/* Shell */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--light-gray); padding: 10px 20px; flex-wrap: wrap; }
.appbar__mark { width: 32px; height: 32px; border-radius: 7px; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.appbar__name { font-weight: 500; font-size: 14px; }
.appbar__spacer { flex: 1; }
.avatar { width: 34px; height: 34px; border-radius: 99px; background: linear-gradient(135deg, var(--info-accent), var(--primary)); color: var(--white); display: grid; place-items: center; font: 700 12px var(--mont); flex: none; }
.sidebar { background: var(--surface); border-right: 1px solid var(--light-gray); padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.sidebar .group { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--steel); padding: 14px 11px 6px; }
.navitem { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--slate); font-size: 13px; margin-bottom: 2px; }
.navitem svg.i { color: var(--steel); }
.navitem:hover { background: var(--white); box-shadow: var(--shadow); }
.navitem[aria-current="true"] { background: var(--white); color: var(--primary); font-weight: 600; border-color: var(--primary); box-shadow: var(--shadow); }
.navitem[aria-current="true"] svg.i { color: var(--primary); }
.navitem .count { margin-left: auto; font-size: 11px; color: var(--steel); font-weight: 500; }
.navitem .badge-n { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--white); background: var(--err-accent); border-radius: 99px; padding: 0 7px; }
.main { min-width: 0; overflow-y: auto; background: var(--white); }
.content { padding: 24px 28px 64px; max-width: 1240px; }
.crumb { font-size: 12px; color: var(--steel); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb button { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.pagehead h1 { font-size: 22px; font-weight: 700; }
.pagehead .sub { color: var(--slate); font-size: 13px; margin-top: 6px; max-width: 760px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mock-note { display: inline-flex; font-size: 11.5px; color: var(--steel); background: var(--snow); border: 1px dashed var(--border-default); border-radius: 99px; padding: 3px 10px; margin-bottom: 16px; }

/* Primitives */
.btn { border-radius: 999px; padding: 9px 17px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-primary-light); background: var(--white); color: var(--primary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--primary-light); }
.btn.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn.primary:disabled { background: var(--gray); border-color: var(--gray); opacity: 1; }
.btn.plain { color: var(--slate); border-color: var(--border-default); }
.btn.plain:hover:not(:disabled) { background: var(--surface); }
.btn.danger { color: var(--err-accent); border-color: var(--err-border); }
.btn.danger:hover:not(:disabled) { background: var(--err-bg); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--primary); padding: 2px 4px; white-space: normal; text-align: left; border-radius: 6px; }
.card { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-hd { padding: 13px 16px; border-bottom: 1px solid var(--light-gray); font: 600 14px var(--mont); display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.card-hd .aside { font: 400 12px var(--inter); color: var(--steel); }
.pad { padding: 16px; }
.section { margin-top: 26px; }
.section-title { font: 700 16px var(--mont); margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.pill svg.i { width: 13px; height: 13px; stroke-width: 2; }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.pill.warn { background: var(--alert-bg); color: var(--alert-text); border-color: var(--alert-border); }
.pill.bad { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
.pill.info { background: var(--primary-light); color: var(--primary); border-color: var(--border-primary-light); }
.pill.solid { background: var(--primary); color: var(--white); border-color: var(--primary); }
.pill.neutral { background: var(--surface); color: var(--steel); border-color: var(--light-gray); }
.pill.lg { font-size: 12.5px; padding: 4px 12px; }
.tag { font-size: 11px; font-weight: 500; color: var(--steel); border: 1px solid var(--light-gray); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.type { font-size: 11px; font-weight: 600; color: var(--primary); background: var(--primary-light); border-radius: 4px; padding: 1px 7px; }
.gov { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--light-gray); border-radius: 6px; overflow: hidden; font-size: 11px; white-space: nowrap; color: var(--steel); background: var(--white); }
.gov span { padding: 1px 7px; }
.gov span + span { border-left: 1px solid var(--light-gray); }
.gov b { font-weight: 600; color: var(--charcoal); }
.facet { font: 500 11px var(--mono); color: var(--steel); word-break: break-all; }
.callout { border-radius: 8px; padding: 12px 14px; border-left: 4px solid; font-size: 13px; }
.callout.info { background: var(--primary-light); border-color: var(--primary); color: #0D2F6B; }
.callout.warn { background: var(--alert-bg); border-color: var(--alert-accent); color: var(--alert-text); }
.callout.ok { background: var(--ok-bg); border-color: var(--ok-accent); color: var(--ok-text); }
.callout.bad { background: var(--err-bg); border-color: var(--err-accent); color: var(--err-text); }
.callout.neutral { background: var(--snow); border-color: var(--gray); color: var(--slate); }
.empty-state { border: 1px dashed var(--border-default); border-radius: var(--radius); padding: 26px; text-align: center; color: var(--steel); font-size: 13px; background: var(--snow); }
.hint { font-size: 11.5px; color: var(--steel); }

/* Role switch */
.gsearch { flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px; background: var(--white); border: 1px solid var(--border-default); border-radius: 999px; padding: 6px 12px; }
.gsearch svg.i { color: var(--steel); width: 16px; height: 16px; }
.gsearch input { border: 0; outline: none; flex: 1; min-width: 0; font-size: 13px; background: transparent; }
.gsearch:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--border-primary-light); }
.summary-card { border: 1px solid var(--border-primary-light); background: linear-gradient(180deg, #F7FAFF, var(--white)); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; display: grid; gap: 10px; }
.summary-card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.group-hd { font: 600 13px var(--mont); margin: 18px 0 8px; display: flex; gap: 8px; align-items: center; }
.createmenu { position: relative; }
.createmenu > summary { list-style: none; }
.createmenu > summary::-webkit-details-marker { display: none; }
.createmenu > summary::before, .createmenu[open] > summary::before { content: none; display: none; }
.createmenu[open] > summary { margin-bottom: 0; }
.createmenu__list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; width: 290px; background: var(--white); border: 1px solid var(--light-gray); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; display: grid; }
.createmenu__list button { border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 7px; display: grid; gap: 1px; }
.createmenu__list button:hover, .createmenu__list button:focus-visible { background: var(--primary-light); }
.createmenu__list b { font-size: 13px; color: var(--charcoal); }
.createmenu__list span { font-size: 11.5px; color: var(--steel); }
.quick { justify-content: center; margin-top: 14px; }
.roleswitch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--steel); }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border-primary-light); border: 1px solid var(--border-primary-light); border-radius: var(--radius); overflow: hidden; }
.summary.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.summary > button, .summary > div { background: var(--primary-light); padding: 13px 16px; border: 0; text-align: left; }
.summary > button:hover { background: var(--primary-lighter); }
.summary .k { font-size: 12.5px; color: var(--slate); }
.summary .num { font: 700 20px var(--mont); font-variant-numeric: tabular-nums; }
.summary .sub { font-size: 11.5px; color: var(--steel); }

/* Intro cards */
.intro { border: 1px solid var(--border-primary-light); border-radius: 14px; background: linear-gradient(180deg, #F7FAFF, var(--white)); padding: 16px 18px; margin-bottom: 20px; }
.intro-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.intro-card { background: var(--white); border: 1px solid var(--light-gray); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.intro-card .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--white); display: grid; place-items: center; }
.intro-card b { font: 600 14px var(--mont); }
.intro-card p { font-size: 12.5px; color: var(--slate); }

/* Filters, tabs, segmented */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search, .select { border: 1px solid var(--border-default); background: var(--white); border-radius: 8px; padding: 8px 11px; font-size: 13px; max-width: 100%; }
.search { width: 260px; }
.search:focus, .select:focus, textarea:focus, input:focus { outline: 2px solid var(--border-primary-light); border-color: var(--primary); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--steel); }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--primary); box-shadow: var(--shadow); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--slate); }
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--primary); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 13px; padding: 9px 18px; border-radius: 8px 8px 0 0; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--white); }
.scope-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 16px; }
.scope-filters .col { display: grid; gap: 6px; align-content: start; }
.scope-filters .select { width: 100%; }

/* Tables */
.table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font: 600 11.5px var(--mont); color: var(--slate); text-transform: uppercase; letter-spacing: .4px; padding: 9px 12px; background: var(--snow); border-bottom: 1px solid var(--light-gray); }
td { padding: 11px 12px; border-bottom: 1px solid var(--light-gray); vertical-align: top; color: var(--slate); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stbl { min-width: 860px; } .stbl.narrow { min-width: 600px; }
.stbl tbody tr[data-act] { cursor: pointer; }
.stbl tbody tr[data-act]:hover td { background: var(--primary-light); }
.stbl .name { font-weight: 600; color: var(--charcoal); word-break: break-word; }
.stages { display: flex; gap: 2px; margin-top: 6px; }
.stages i { width: 16px; height: 4px; border-radius: 2px; background: var(--light-gray); }
.stages i.done { background: var(--ok-accent); } .stages i.fail { background: var(--err-accent); } .stages i.run { background: var(--alert-accent); }

/* Accounts home */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.matrix-wrap { overflow-x: auto; }
.matrix { border-collapse: separate; border-spacing: 5px; min-width: 540px; }
.matrix th { background: none; border: 0; padding: 4px 6px; font-size: 11px; }
.matrix td { padding: 0; border: 0; }
.cell { width: 100%; border: 1px solid var(--light-gray); background: var(--white); border-radius: 9px; padding: 9px 10px; text-align: left; display: grid; gap: 5px; min-height: 70px; }
.cell:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.cell.ready { background: var(--ok-bg); border-color: var(--ok-border); }
.cell.thin { background: var(--alert-bg); border-color: var(--alert-border); }
.cell.missing { background: var(--snow); border-style: dashed; }
.cell b { font: 600 13px var(--mont); }
.todo { display: grid; gap: 1px; background: var(--light-gray); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--light-gray); }
.todo button { background: var(--white); border: 0; text-align: left; padding: 12px 14px; display: grid; gap: 4px; }
.todo button:hover { background: var(--primary-light); }
.mix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mix-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.mix-row .bar { height: 7px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
.mix-row .bar i { display: block; height: 100%; border-radius: 99px; }
.mix-row .n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Account page */
.acct { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.qsec + .qsec { margin-top: 18px; }
.qsec h3 { font-size: 14px; margin-bottom: 8px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 11px 14px; border: 1px solid var(--light-gray); border-radius: 9px; background: var(--white); text-align: left; width: 100%; }
.frow + .frow { margin-top: 6px; }
.frow:hover { border-color: var(--primary); }
.frow .t { font-size: 13.5px; color: var(--charcoal); font-weight: 500; }
.frow .m { grid-column: 1 / -1; font-size: 11.5px; color: var(--steel); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.frow.dim { opacity: .6; }

/* Fact cards (curator list) */
.fact { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; box-shadow: var(--shadow); }
.fact:hover { border-color: var(--primary); }
.fact + .fact { margin-top: 8px; }
.fact .statement { font-size: 14.5px; font-weight: 500; color: var(--charcoal); max-width: 80ch; }
.fact.dim { opacity: .6; }
.fact-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--steel); }

/* Briefings */
.briefings { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
.blist { display: grid; gap: 8px; }
.bitem { text-align: left; border: 1px solid var(--light-gray); background: var(--white); border-radius: var(--radius); padding: 11px 13px; display: grid; gap: 6px; }
.bitem:hover { border-color: var(--primary); background: var(--primary-light); }
.bitem[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 1px var(--primary); }
.bitem.virtual { border-style: dashed; }
.bitem strong { font: 600 14px var(--mont); }
.doc { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 22px 24px; display: grid; gap: 16px; box-shadow: var(--shadow); line-height: 1.7; }
.doc h2 { font-size: 20px; }
.doc h3 { font-size: 12.5px; color: var(--primary); text-transform: uppercase; letter-spacing: .4px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 78ch; }
.anchor { font: 700 10px var(--inter); color: var(--primary); background: var(--primary-light); border: 0; border-radius: 3px; padding: 0 4px; vertical-align: 2px; }
button.anchor:hover { background: var(--primary); color: var(--white); }
.bgtag { font-size: 10px; font-weight: 600; color: var(--steel); background: var(--surface); border: 0; border-radius: 3px; padding: 0 5px; vertical-align: 2px; }
.refs { border-top: 1px dashed var(--light-gray); padding-top: 12px; display: grid; gap: 4px; font-size: 12px; color: var(--steel); }
.meter { height: 7px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--alert-accent); }
.verdict { border-radius: 8px; padding: 10px 12px; font-size: 13px; border-left: 4px solid; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok-accent); color: var(--ok-text); }
.verdict.warn { background: var(--alert-bg); border-color: var(--alert-accent); color: var(--alert-text); }
.verdict.bad { background: var(--err-bg); border-color: var(--err-accent); color: var(--err-text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border-primary-light); background: var(--white); color: var(--primary); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500; text-align: left; }
.chip:hover { background: var(--primary-light); }

/* Review queue */
.rq { display: grid; gap: 12px; }
.rcard { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.rcard h3 { font-size: 15px; }
.rcard p { max-width: 78ch; color: var(--slate); }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side-box { border: 1px solid var(--light-gray); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--snow); }
.side-box .big { font: 700 20px var(--mont); font-variant-numeric: tabular-nums; }

/* Projects */

const term = (w, tip) => `<span class="term" title="${esc(tip)}">${w}</span>`;
/* Plain scope names: customer first, the way a KAM talks about an account. */
function scopeLabel(cat, cust) {
  if (cat && cust) return `${cust} · ${cat}`;
  if (cust) return `${cust} · all categories`;
  return `${cat || "All categories"} · all customers`;
}
const facetKey = (cat, cust) => [cat && `category:${cat.toLowerCase()}`, "market:uk", cust && `customer:${cust.toLowerCase()}`].filter(Boolean).sort().join("|");
function daysBetween(a, b) { const x = Date.parse(a), y = Date.parse(b); return isNaN(x) || isNaN(y) ? null : Math.round((y - x) / 864e5); }
function age(d) {
  const n = daysBetween(d, TODAY);
  if (n === null) return d;
  const s = n < 1 ? "today" : n < 14 ? plural(n, "day", "days") + " old" : n < 60 ? plural(Math.round(n / 7), "week", "weeks") + " old" : n < 730 ? plural(Math.round(n / 30), "month", "months") + " old" : plural(Math.round(n / 365), "year", "years") + " old";
  return `<span title="Content date ${esc(d)}">${s}</span>`;
}
const expiresIn = f => f.expires ? daysBetween(TODAY, f.expires) : null;
const curatorFor = f => (f.cust && typeof DOMAIN_OWNER !== "undefined" ? (DOMAIN_OWNER[f.cust] || "Sam Okafor") : null) || CURATOR[f.cat] || "the account curator";

function isLive(f) {
  const s = f.src && src(f.src);
  return (f.status === "verified" || f.status === "needs_review") && (!s || s.status === "live");
}
const visibleToMe = f => !f.owner || f.owner === PEOPLE.kam.name;
const liveFacts = () => FACTS.filter(f => isLive(f) && visibleToMe(f));   // the one count used everywhere
function quotable(f, audience) {
  if (!isLive(f) || f.status !== "verified") return false;
  return audience !== "external" || f.sens === "external";
}

/* One plain answer to "Can I use this?". The three labels live in the details. */
function usage(f) {
  if (!isLive(f)) {
    const s = f.src && src(f.src);
    return { k: "out", label: "Out of date", cls: "neutral", ic: "alert", short: "out of date",
      why: f.status === "replaced" ? "A newer document replaced it. Tools no longer use it." : f.status === "outdated" ? "Its data is too old. Tools no longer use it." : `Its source ${s ? "is " + S_PILL[s.status][1].toLowerCase() : "is no longer in use"}. Tools no longer use it.` };
  }
  if (f.status === "needs_review") return { k: "review", label: "Not yet · needs review", cls: "warn", ic: "clock", short: "not yet",
    why: `Waiting for ${curatorFor(f)} (curator) to check it. Until then no tool can quote it.` };
  if (f.sens === "external") return { k: "customer", label: "Use with customer", cls: "ok", ic: "check", short: "",
    why: "Checked and cleared for customer slides and conversations." };
  return { k: "internal", label: "Internal only", cls: "info", ic: "lock", short: "internal only",
    why: f.sens === "restricted" ? "Restricted: use it for your own preparation only. Don't share it outside the account team." : "Fine for your preparation and internal decks. Keep it off customer slides." };
}
const USE_KEYS = [["customer", "Use with customer"], ["internal", "Internal only"], ["review", "Not yet · needs review"], ["out", "Out of date"]];
function usePill(f, lg) {
  const u = usage(f), e = expiresIn(f);
  return `<span class="pill ${u.cls} ${lg ? "lg" : ""}" title="${esc(u.why)}">${icon(u.ic)}${u.label}</span>${e !== null && isLive(f) ? `<span class="pill warn" title="Expires ${f.expires}">Expires in ${e} days</span>` : ""}`;
}

function briefingFacts(b) { return FACTS.filter(f => sameScope(f, b.cat, b.cust) && isLive(f) && !f.owner); }
function floorOK(b) { const fs = briefingFacts(b); return fs.length >= 3 && fs.some(f => f.type === "metric" && f.rel === "certified"); }
function briefingState(b) { return b.status === "none" ? (floorOK(b) ? "none" : "below") : floorOK(b) ? b.status : "below"; }
const B_PILL = { current: ["ok", "Up to date"], outdated: ["warn", "Needs refresh"], below: ["neutral", "Not enough information yet"], none: ["info", "Ready to write"] };
const S_PILL = { live: ["ok", "In use"], needs_context: ["warn", "Needs a date"], quarantined: ["warn", "On hold · too old"], failed: ["bad", "Couldn't read"], superseded: ["neutral", "Replaced by newer"], retired: ["neutral", "Retired"], processing: ["info", "Reading…"] };

/* Readiness of an account, in the same terms the briefing uses. */
function readiness(cat, cust) {
  const fs = FACTS.filter(f => sameScope(f, cat, cust) && isLive(f) && !f.owner);
  const hasNum = fs.some(f => f.type === "metric" && f.rel === "certified");
  if (fs.length >= 3 && hasNum) return { k: "ready", label: "Ready", cls: "ok", n: fs.length, tip: "Enough checked facts, including official market numbers." };
  if (fs.length) return { k: "thin", label: "Thin", cls: "warn", n: fs.length, tip: hasNum ? "Fewer than 3 facts." : "No official market number yet." };
  return { k: "missing", label: "Missing", cls: "neutral", n: 0, tip: "Nothing in the bank yet." };
}

function highlight(text, fig) {
  const t = esc(text);
  if (!fig) return t;
  const e = esc(fig);
  return t.includes(e) ? t.replace(e, `<mark>${e}</mark>`) : t;
}
function markOutdated(cat, cust, why) { BRIEFINGS.filter(b => sameScope(b, cat, cust)).forEach(b => { b.status = "outdated"; b.why = why; }); }
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2800);
}
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* Project context pillars. Derived from facts, never set by hand; Buyer is the exception. */
function pillars(p) {
  const live = FACTS.filter(f => isLive(f) && !f.owner);
  if (!p.cat) return [{ name: "Customer profile", desc: "the retailer's priorities", n: live.filter(f => !f.cat && f.cust === p.cust).length }];
  const all = [
    { name: "Category knowledge", desc: "strategy and shopper facts for the category", n: live.filter(f => f.cat === p.cat && !f.cust).length },
    { name: "Customer profile", desc: "the retailer's priorities", n: p.cust ? live.filter(f => !f.cat && f.cust === p.cust).length : null },
    { name: "This account", desc: "facts on this customer and category", n: p.cust ? live.filter(f => f.cat === p.cat && f.cust === p.cust).length : null },
    { name: "Market numbers", desc: "official market-share data", n: live.filter(f => f.cat === p.cat && (!f.cust || f.cust === p.cust) && f.type === "metric" && f.rel === "certified").length },
  ];
  if ("buyer" in p) all.push({ name: "Buyer", desc: "buyer attached to the project", n: p.buyer ? 1 : 0, text: p.buyer });
  return all.filter(x => x.n !== null);
}
const score = p => pillars(p).filter(x => x.n > 0).length;
function covTone(s, of = 5) { const r = s / of; return r >= .8 ? ["var(--ok-accent)", "Strong context"] : r >= .6 ? ["var(--alert-accent)", "Thin context"] : ["var(--err-accent)", "Not enough context"]; }

/* ---- Search: across every account the KAM can see ---- */
RENDER.find = () => {
  const words = state.gq.toLowerCase().split(/\W+/).filter(w => w.length > 2);
  const hits = words.length ? liveFacts().map(f => ({ f, n: words.filter(w => (f.text + " " + (f.cat || "") + " " + (f.cust || "")).toLowerCase().includes(w)).length })).filter(x => x.n).sort((a, b) => b.n - a.n).map(x => x.f) : [];
  const groups = [...new Set(hits.map(f => bkey(f)))];
  return head("Knowledge Bank", `Results for “${esc(state.gq)}”`, hits.length ? `${plural(hits.length, "fact", "facts")} across ${plural(groups.length, "account", "accounts")}. Out-of-date facts are not shown.` : "") + NOTE +
    (hits.length ? groups.map(k => { const [cat, cust] = k.split("|"); const fs = hits.filter(f => bkey(f) === k);
      return `<div class="group-hd">${esc(scopeLabel(cat || null, cust || null))}<button class="btn ghost small" data-act="open-account" data-cat="${esc(cat)}" data-cust="${esc(cust)}">Open account</button></div>${fs.map(f => factRow(f)).join("")}`; }).join("")

        <div class="card"><div class="card-hd">What's missing <span class="aside">${ps.length - miss.length}/${ps.length} covered</span></div>
          <div class="plist">${ps.map(x => `<div><span>${x.name}<div class="hint">${esc(x.desc)}</div></span>${x.n ? `<span class="pill ok">${plural(x.n, "fact", "facts")}</span>` : `<span class="pill neutral">Missing</span>`}</div>`).join("")}</div>
          ${miss.length ? `<div class="pad row"><button class="btn sm" data-act="add-source">Add a document</button><button class="btn sm plain" data-act="add-fact">Add a fact</button></div>` : ""}</div>

    ${list.length ? `<div class="projgrid">${cards}</div>` : `<div class="empty-state">No project matches. <button class="btn ghost" data-act="new-project">Create one</button></div>`}
    <div class="callout info section"><b>A project is the scope, set once.</b> Customer, market and category live on the project. Selling Coach and the Storyline Generator use them, so a run never asks again. Launch either one from the project chat.</div>`;

AFTER.projects = () => { $("#pq").addEventListener("input", e => { state.pq = e.target.value; const p = e.target.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(p, p); }); };

/* =====================================================================
   Project workspace with the conversational assistant
   ===================================================================== */
function seedChat(p) {
  if (p.chat) return;
  const s = selectFacts(p.cat, p.cust, "");
  const q = s.ranked.filter(x => quotable(x.f, p.audience)).length;
  p.chat = [{ who: "bot", html: `<p>Hi Camille. This project covers <b>${esc(scopeLabel(p.cat, p.cust))}</b> for ${p.audience === "external" ? "a <b>customer-facing</b>" : "an <b>internal team</b>"} audience. The Knowledge Bank has ${plural(s.inScope, "usable fact", "usable facts")} here${p.audience === "external" ? `, and ${plural(q, "is", "are")} cleared to use with the customer` : ""}.</p>
    <p>Tell me what you need. I can review a deck with <b>Selling Coach</b>, build a storyline with the <b>Storyline Generator</b>, or answer from the Knowledge Bank.</p>`, chips: [`Review my ${p.cust} deck`, `Build a storyline for ${p.cust}`, `What do we know about ${p.cust}?`, "What context is missing?"] }];
}

    <div class="pagehead"><div><h1>${esc(p.name)}</h1><p class="sub">${esc(p.objective)}</p>
      <div class="projchips" style="margin-top:8px"><span class="projchip">${esc(p.cust)} · UK</span><span class="projchip">${p.cat}</span><span class="projchip">${p.meeting ? "Meeting " + p.meeting : "No meeting set"}</span><span class="pill ${p.audience === "external" ? "info" : "solid"}">${AUD[p.audience]}</span></div></div>
      <div class="actions"><button class="btn plain sm" data-view="projects">Switch project</button></div></div>

    <div class="proj">
      <section class="card chat" aria-label="Project assistant">
        <div class="card-hd"><span class="row">${icon("spark")}Project assistant</span><span class="aside">Runs tools with this project's customer and facts</span></div>
        <div class="thread" id="thread" aria-live="polite">${threadHTML(p)}</div>
        <div class="composer">
          <div class="launchers"><span class="small muted">Launch:</span>
            <button class="launcher" data-act="launch" data-tool="coach">${icon("coach")}Selling Coach</button>
            <button class="launcher" data-act="launch" data-tool="story">${icon("story")}Storyline Generator</button>
            <button class="launcher" data-act="launch" data-tool="kb">${icon("db")}Ask the Knowledge Bank</button></div>
          <form id="chatform"><textarea id="chat-in" rows="2" placeholder="Ask anything, or say which tool to run…" aria-label="Message the project assistant"></textarea><button class="btn primary" type="submit">${icon("send")}Send</button></form>
        </div>
      </section>
      <aside class="side">
        <div class="card"><div class="card-hd">Context <span class="small" style="font:600 12px var(--inter);color:${col === "var(--alert-accent)" ? "var(--alert-text)" : col}">${s} of 5 parts covered</span></div>
          <div class="plist">${ps.map(x => `<div><span>${x.name}${x.name === "Buyer" && x.text ? `<div class="hint">${esc(x.text)}</div>` : ""}</span>${x.n ? `<span class="pill ok">${x.name === "Buyer" ? "Attached" : plural(x.n, "fact", "facts")}</span>` : x.name === "Buyer" ? `<button class="btn ghost small" data-act="attach-buyer">Attach</button>` : `<span class="pill neutral">Missing</span>`}</div>`).join("")}</div>
          <div class="pad" style="padding-top:10px"><span class="hint">Worked out from Knowledge Bank facts. Private facts never count.</span></div></div>
        <div class="card"><div class="card-hd">Account ${st ? `<span class="pill ${B_PILL[st][0]}">Briefing: ${B_PILL[st][1].toLowerCase()}</span>` : ""}</div>
          <div class="pad row"><button class="btn sm" data-act="open-account" data-cat="${p.cat}" data-cust="${esc(p.cust)}">Open ${esc(scopeLabel(p.cat, p.cust))}</button></div></div>
        <div class="card"><div class="card-hd">Recent runs <span class="aside">${p.runs.length}</span></div>
          ${p.runs.length ? `<div class="runs">${p.runs.slice(0, 5).map(r => `<div${r.html ? ` class="runlink" data-x="open-run" data-id="${r.id}" tabindex="0" role="button" title="Open this result"` : ""}><span class="spread"><b style="font-weight:600">${r.tool}</b><span class="pill ${r.status === "Running" ? "info" : "ok"}">${r.status}</span></span><span class="muted">${esc(r.note)}</span><span class="hint">${r.date}</span></div>`).join("")}</div>` : `<div class="pad hint">No runs yet. Ask the assistant to launch a tool.</div>`}</div>

AFTER.project = () => {
  const p = proj(state.project), inp = $("#chat-in");
  $("#chatform").addEventListener("submit", e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; inp.value = ""; userSays(p, v); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatform").requestSubmit(); } });
  scrollThread();
};

function threadHTML(p) {
  return p.chat.map((m, i) => {
    if (m.who === "me") return `<div class="msg me"><div class="bubble">${esc(m.text)}</div><div class="who" aria-hidden="true">CM</div></div>`;
    let body = m.typing ? `<span class="typing" aria-label="Assistant is typing"><i></i><i></i><i></i></span>` : m.html;
    if (m.stages) body = `${m.html || ""}<ul class="stagelist">${m.stages.map((s, k) => `<li class="${k < m.done ? "ok" : k === m.done ? "run" : ""}"><span class="ico">${k < m.done ? "✓" : ""}</span>${esc(s)}</li>`).join("")}</ul>`;
    if (m.chips && !m.used) body += `<div class="chips">${m.chips.map(c => `<button class="chip" data-act="say" data-text="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    return `<div class="msg"><div class="who" aria-hidden="true">${icon("spark")}</div><div class="bubble ${m.lock ? "locked" : ""}">${body}</div></div>`;
  }).join("");
}
function paintThread() { const t = $("#thread"); if (state.view !== "project" || !t) return; t.innerHTML = threadHTML(proj(state.project)); scrollThread(); }
function scrollThread() { const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight; }
function push(p, m) { p.chat.push(m); if (state.project === p.id) paintThread(); return m; }
function botReply(p, fn, delay = 550) {
  const m = push(p, { who: "bot", typing: true });
  setTimeout(() => { m.typing = false; fn(m); if (state.project === p.id) paintThread(); }, delay);
}
function lockOld(p) { p.chat.forEach(m => { if (m.chips) m.used = true; m.lock = true; }); }

const INTENT = [
  ["create", /\b(create|add|new|set up)\b.*\b(buyer|customer|retailer)\b/i],
  ["help", /^\s*(hi|hello|hey|help|\?|what can you do|bonjour)\b/i],
  ["coach", /(selling coach|deck|slides?|presentation|feedback|psf|review my)/i],
  ["story", /(storyline|story|opportunit|narrative|pitch)/i],
  ["gaps", /(missing|gaps?|coverage|what context)/i],
  ["which", /\b(launch|run|start|open|use)\b.*\b(tool|product|agent|something)\b/i],
];
function userSays(p, text) {
  lockOld(p);
  push(p, { who: "me", text });
  const hits = INTENT.filter(([, re]) => re.test(text)).map(([k]) => k);
  const intent = hits.includes("coach") && hits.includes("story") ? "which" : hits[0] || "kb";
  ({ create: t => createFromChat(p, text), help: showHelp, coach: startCoach, story: startStory, gaps: contextGaps, which: askWhich, kb: t => kbAnswer(p, text) })[intent](p);
}

/* Citations respect the audience: usable facts get a number, the rest are labelled. */
function citer(p) {
  const nums = [];
  return f => {
    if (!f) return `<span class="bgtag">no fact</span>`;
    if (!quotable(f, p.audience)) { const u = usage(f); return `<button class="bgtag" data-act="open-fact" data-id="${f.id}" title="${esc(u.why)}">${u.k === "internal" ? "internal only" : u.short}</button>`; }
    let n = nums.indexOf(f.id); if (n < 0) { nums.push(f.id); n = nums.length - 1; }
    return `<button class="anchor" data-act="open-fact" data-id="${f.id}" title="Open this fact">${n + 1}</button>`;
  };
}
const preferQuotable = (fs, p) => [...fs.filter(f => quotable(f, p.audience)), ...fs.filter(f => !quotable(f, p.audience))];
function citeNote(p) { return p.audience === "external" ? `<p class="hint">This project is customer-facing: only facts cleared for customers get a number. Others are labelled and stay off slides.</p>` : ""; }

/* "Why these facts?": the selection internals, on demand only. */
function whyBox(r, p) {
  return `<details><summary>Why these facts?</summary><div class="whybox">
    <span>I looked at <b>${plural(r.live, "usable fact", "usable facts")}</b> you can see. <b>${r.inScope}</b> match ${esc(scopeLabel(p.cat, p.cust))}. I kept the <b>${r.ranked.length}</b> most relevant, preferring checked facts, official data and recent content${r.merged ? `, and merged ${plural(r.merged, "repeat", "repeats")} of the same figure` : ""}.</span>
    <table><thead><tr><th>Fact</th><th>Can I use it?</th><th class="num">Match</th></tr></thead><tbody>${r.ranked.map(x => `<tr><td>${esc(x.f.text)}</td><td>${usePill(x.f)}</td><td class="num">${Math.round(x.score * 100)}%</td></tr>`).join("")}</tbody></table>
  </div></details>`;
}

function createFromChat(p, text) {
  const buyer = /buyer/i.test(text);
  botReply(p, m => { m.html = buyer
    ? `<div class="tool-hd">${icon("user")}New buyer profile</div><p>I'll draft it from the emails, calls and meetings where the buyer talks. It stays private to you and can be attached to this project.</p><div class="row"><button class="btn sm primary" data-x="buyer-new" data-cust="${esc(p.cust)}" data-from="project">Create a buyer for ${esc(p.cust)}</button></div>`
    : `<div class="tool-hd">${icon("store")}New customer profile</div><p>${profileOf(p.cust) ? `${esc(p.cust)} already has a profile. You can open it, or create a profile for another customer.` : `${esc(p.cust)} has no profile yet. I'll draft one from documents you already have, and you approve it in three steps.`}</p>
       <div class="row">${profileOf(p.cust) ? `<button class="btn sm" data-x="open-profile" data-v="${esc(p.cust)}">Open the ${esc(p.cust)} profile</button><button class="btn sm primary" data-x="cust-new" data-name="" data-from="project">Create another customer</button>` : `<button class="btn sm primary" data-x="cust-new" data-name="${esc(p.cust)}" data-from="project">Create the ${esc(p.cust)} profile</button>`}</div>`; });
}
function showHelp(p) {
  botReply(p, m => { m.html = `<p>Here's what I can do in this project:</p><ul><li><b>Review a deck</b> with Selling Coach: feedback on each selling step, backed by facts.</li><li><b>Build a storyline</b> with the Storyline Generator: opportunities, then a step-by-step story.</li><li><b>Answer a question</b> from the Knowledge Bank, with the source of every fact.</li><li><b>Create a customer or buyer profile</b>, drafted from your personal context.</li></ul>`;
    m.chips = [`Review my ${p.cust} deck`, `Build a storyline for ${p.cust}`, "What context is missing?"]; });
}
function askWhich(p) {
  botReply(p, m => { m.html = `<p>Which tool do you want?</p><div class="row"><button class="btn sm" data-act="launch" data-tool="coach">${icon("coach")}Selling Coach · review a deck</button><button class="btn sm" data-act="launch" data-tool="story">${icon("story")}Storyline Generator · build a story</button></div>`; });
}
const COV = { sufficient: ["ok", "Good coverage", "Enough checked facts to answer well."], thin: ["warn", "Thin coverage", "Some facts, but gaps remain. I'll say where I'm relying on general guidance."], none: ["bad", "No coverage", "Nothing in the bank for this account yet."] };
function kbAnswer(p, q) {
  botReply(p, m => {
    const r = selectFacts(p.cat, p.cust, q), cite = citer(p), c = COV[r.coverage];
    m.html = r.coverage === "none"
      ? `<p>The Knowledge Bank has nothing on <b>${esc(scopeLabel(p.cat, p.cust))}</b> yet. Add a document and I'll use it once a curator has checked it.</p>`
      : `<div class="tool-hd">${icon("db")}From the Knowledge Bank</div>
         <ul>${preferQuotable(r.ranked.map(x => x.f), p).slice(0, 5).map(f => `<li>${esc(f.text)} ${cite(f)}</li>`).join("")}</ul>
         <div class="verdict ${c[0]}"><b>${c[1]}.</b> ${c[2]}</div>${citeNote(p)}${whyBox(r, p)}
         <div class="row"><button class="btn sm plain" data-act="open-account" data-cat="${p.cat}" data-cust="${esc(p.cust)}">Open the account</button></div>`;
  }, 700);
}
function contextGaps(p) {
  botReply(p, m => {
    const miss = pillars(p).filter(x => !x.n);
    m.html = !miss.length ? `<p>All five parts of the context are covered. Tools have the full picture.</p>`
      : `<p>${plural(miss.length, "part of the context is", "parts of the context are")} missing, so tool results will be thinner:</p>
         <ul>${miss.map(x => `<li><b>${x.name}</b>: ${x.name === "Buyer" ? "no buyer attached to the project." : x.name === "Market numbers" ? "no current official market number. The last one is out of date." : `nothing on ${x.desc} yet.`}</li>`).join("")}</ul>
         <div class="row">${miss.some(x => x.name === "Buyer") ? `<button class="btn sm" data-act="attach-buyer">Attach a buyer</button>` : ""}<button class="btn sm plain" data-act="add-source">Add a document</button></div>`;
  });
}

/* ---- Selling Coach ---- */
function startCoach(p) {

/* =====================================================================
   Fact selection used by the chat (filter, rank, merge repeats)
   ===================================================================== */
function selectFacts(cat, cust, q) {
  const words = (q || "").toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const live = liveFacts();
  const inScope = live.filter(f => (f.cat === cat && (!f.cust || (cust && f.cust === cust))) || (!f.cat && cust && f.cust === cust));
  const RW = { certified: 1, reviewed: .8, stated: .6 };
  const ranked = inScope.map(f => {
    const overlap = words.filter(w => f.text.toLowerCase().includes(w)).length;
    const rel = Math.min(1, .45 + overlap * .15 + (f.cust ? .1 : 0));
    return { f, score: rel * (f.status === "verified" ? 1 : .7) * RW[f.rel] * (f.expires ? .85 : 1) };
  }).sort((a, b) => b.score - a.score).slice(0, 8);
  const merged = ranked.reduce((n, r) => n + (r.f.dedup - 1), 0);
  const hasMetric = ranked.some(r => r.f.type === "metric" && r.f.rel === "certified");
  return { live: live.length, inScope: inScope.length, ranked, merged, coverage: !ranked.length ? "none" : ranked.length >= 3 && hasMetric ? "sufficient" : "thin" };
}

  const trust = REL.map((k, i) => row(REL_LABEL[k], ["ok", "info", "neutral"][i], live.filter(f => f.rel === k).length, live.length, ["var(--ok-accent)", "var(--primary)", "var(--steel)"][i])).join("");
  const use = USE_KEYS.map(([k, l], i) => row(l, ["ok", "info", "warn", "neutral"][i], all.filter(f => usage(f).k === k).length, all.length, ["var(--ok-accent)", "var(--primary)", "var(--alert-accent)", "var(--steel)"][i])).join("");
  const runs = RUNS.slice(0, 5).map(r => `<tr><td><span class="pill ${r.status === "Complete" ? "ok" : r.status === "Running" ? "info" : "warn"}">${r.status}</span></td><td>${esc(r.source)}</td><td>${r.started}</td><td class="num">${r.indexed}</td><td class="num">${r.failed}</td></tr>`).join("");
  return `<div class="mix"><div class="card pad stack"><div class="label">Where usable facts come from</div>${trust}</div><div class="card pad stack"><div class="label">Can they be used?</div>${use}</div></div>
    <section class="section"><h2 class="section-title">Recent imports</h2><div class="table-wrap"><table class="stbl narrow"><thead><tr><th>Status</th><th>What was imported</th><th>Started</th><th class="num">Facts found</th><th class="num">Problems</th></tr></thead><tbody>${runs}</tbody></table></div></section>`;
}

/* =====================================================================
   Drawer (fact detail, source impact) and modals
   ===================================================================== */
function openDrawer(html) { if (!$("#overlay").children.length) state.lastFocus = document.activeElement; $("#overlay").innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`; $(".drawer button")?.focus(); }
function openModal(html, onSubmit) {
  if (!$("#overlay").children.length) state.lastFocus = document.activeElement;
  $("#overlay").innerHTML = `<div class="scrim"></div><div class="modal-wrap" data-act="close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const form = $(".modal form");
  form.addEventListener("submit", e => { e.preventDefault(); onSubmit(new FormData(form)); });
  $(".modal input, .modal select, .modal textarea")?.focus();
}
function closeOverlay() {
  if (!$("#overlay").children.length) return;
  $("#overlay").innerHTML = "";
  if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
  state.lastFocus = null;
}

function factDrawer(id) {
  const f = fact(id), s = f.src ? src(f.src) : null, u = usage(f);
  const cites = BRIEFINGS.filter(b => floorOK(b) && briefingFacts(b).includes(f));
  const figNum = f.fig && String(parseFloat(f.fig));
  const evidence = f.row ? `<pre class="excerpt">${esc(JSON.stringify(f.row, null, 2)).replace(figNum, `<mark>${figNum}</mark>`)}</pre>` : `<div class="excerpt">${highlight(f.excerpt, f.fig)}</div>`;
  const numberOK = f.fig && (f.row || (f.excerpt || "").includes(f.fig));
  const cur = curatorFor(f);
  const who = [
    ["var(--primary)", "1", f.by ? `<b>${esc(f.by)}</b> added it${f.origin ? ` (from ${esc(f.origin)})` : ""}.` : s ? `The system took it from <b>${esc(s.name)}</b>.` : `The system recorded it from a project.`],
    [f.status === "verified" ? "var(--ok-accent)" : "var(--alert-accent)", "2", f.status === "verified" ? `<b>Checked</b> by ${cur} (curator).` : f.status === "needs_review" ? `<b>Waiting for ${cur}</b> (curator) to check it.` : `No longer in use.`],
    ["var(--steel)", "3", f.expires ? `The system will flag it on ${f.expires} when its data gets too old.` : "The system flags it automatically if it gets too old or a newer document replaces it."],
  ];
  openDrawer(`
    <div class="spread"><span class="type">${TYPE_LABEL[f.type]}</span><button class="btn sm plain" data-act="close">Close</button></div>
    <h2>${esc(f.text)}</h2>
    <div class="stack"><div class="label">Can I use this?</div><div class="row">${usePill(f, true)}</div><div class="callout ${u.cls === "ok" ? "ok" : u.cls === "warn" ? "warn" : u.cls === "info" ? "info" : "neutral"}">${esc(u.why)}</div></div>
    <div class="stack"><div class="label">Where it comes from</div>
      <div class="chain">
        <div><b>${s ? esc(s.name) : esc(f.origin ? "Your " + f.origin.replace(/^your /, "") : "Account memory")}</b><span class="hint">${s ? `${term(REL_LABEL[s.rel], REL_TIP[s.rel])} · ${age(f.asOf)}` : age(f.asOf)}</span></div>
        <div><b>${esc(f.loc)}</b>${f.dedup > 1 ? `<span class="hint">Confirmed by ${f.dedup} documents</span>` : ""}</div>
        <div style="padding-bottom:0">${evidence}${f.fig ? `<span class="hint">${numberOK ? "The number appears in the source exactly as stated." : "The number could not be found in the source."}</span>` : ""}</div>
      </div></div>
    <div class="stack"><div class="label">Who does what</div><div class="roles">${who.map(([c, n, t]) => `<div><span class="dot" style="background:${c}">${n}</span><span>${t}</span></div>`).join("")}</div></div>
    <div class="row">
      ${f.status === "needs_review" && curatorMode() ? `<button class="btn sm primary" data-act="verify" data-id="${f.id}">Mark as checked</button><button class="btn sm danger" data-act="reject" data-id="${f.id}">Reject</button>` : ""}
      ${f.status === "needs_review" && !curatorMode() ? `<button class="btn sm" data-act="nudge" data-id="${f.id}">Remind ${cur}</button>` : ""}
      ${u.k === "customer" || u.k === "internal" ? `<button class="btn sm ${u.k === "customer" ? "primary" : ""}" data-act="copy-fact" data-id="${f.id}">Copy for ${u.k === "customer" ? "a customer slide" : "an internal deck"}</button>` : ""}
      ${u.k === "internal" && f.sens === "internal" && !curatorMode() ? (f.clearReq ? `<span class="pill info">${icon("clock")}Clearance requested</span>` : `<button class="btn sm plain" data-act="ask-clear" data-id="${f.id}">Ask to use it with customers</button>`) : ""}
      ${isLive(f) && !curatorMode() ? (f.reported ? `<span class="pill warn">Reported</span>` : `<button class="btn sm plain" data-act="report" data-id="${f.id}">Report a problem</button>`) : ""}
    </div>
    ${curatorMode() && isLive(f) ? `<details><summary>Edit the statement</summary><div class="stack"><textarea id="fe-text" rows="3">${esc(f.text)}</textarea><div><button class="btn sm primary" data-x="fact-edit-save" data-id="${f.id}">Save</button></div><span class="hint">Saving updates the content date to today and marks briefings that use it for refresh.</span></div></details>` : ""}
    <details><summary>Details for curators</summary><dl class="kv">
      <dt>Labels</dt><dd><span class="gov"><span>Trust <b>${REL_LABEL[f.rel]}</b></span><span>Audience <b>${SENS_LABEL[f.sens]}</b></span><span>Visible to <b>${f.owner ? "only " + esc(f.owner) : "the team"}</b></span></span></dd>
      <dt>Account</dt><dd>${esc(scopeLabel(f.cat, f.cust))} · UK<div class="facet">${facetKey(f.cat, f.cust)}</div></dd>
      ${f.period ? `<dt>Period</dt><dd>${esc(f.period)}</dd>` : ""}
      <dt>Content date</dt><dd>${f.asOf}</dd><dt>Status</dt><dd>${STATUS_LABEL[f.status]}</dd>
      <dt>Used in</dt><dd>${cites.length ? cites.map(b => "Briefing: " + esc(scopeLabel(b.cat, b.cust))).join("<br>") : "No briefing"}</dd>
      <dt>ID</dt><dd class="mono">${f.id}</dd>
      ${curatorMode() && isLive(f) ? `<dt>Audience</dt><dd><select class="select" id="d-sens">${Object.entries(SENS_LABEL).map(([k, l]) => `<option value="${k}" ${k === f.sens ? "selected" : ""}>${l}</option>`).join("")}</select></dd>` : ""}
    </dl></details>`);
  $("#d-sens")?.addEventListener("change", e => {
    f.sens = e.target.value;
    if (!f.owner) markOutdated(f.cat, f.cust, "A fact's audience changed.");
    render(); factDrawer(f.id); toast(`Audience set to ${SENS_LABEL[f.sens].toLowerCase()}.`);
  });
}

function sourceDrawer(id) {
  const s = src(id), fs = FACTS.filter(f => f.src === id);
  const briefs = BRIEFINGS.filter(b => fs.some(f => sameScope(f, b.cat, b.cust)));
  const other = Math.max(0, s.facts - fs.length), p = S_PILL[s.status];
  const canRetire = curatorMode() && !["retired", "superseded", "processing"].includes(s.status);
  const stalled = !["live", "superseded", "retired"].includes(s.status);
  openDrawer(`
    <div class="spread"><span class="pill ${p[0]}">${p[1]}</span><button class="btn sm plain" data-act="close">Close</button></div>
    <h2>${esc(s.name)}</h2>
    <dl class="kv"><dt>Type</dt><dd>${esc(s.kind)}</dd><dt>Account</dt><dd>${esc(scopeLabel(s.cat, s.cust))}</dd>
      <dt>Content age</dt><dd>${age(s.asOf)}${s.conf === "low" ? " · date uncertain" : ""}</dd><dt>Trust</dt><dd>${term(REL_LABEL[s.rel], REL_TIP[s.rel])}</dd><dt>Audience</dt><dd>${SENS_LABEL[s.sens]}</dd>
      ${s.supersededBy ? `<dt>Replaced by</dt><dd>${esc(src(s.supersededBy).name)}</dd>` : ""}${s.note ? `<dt>Note</dt><dd>${esc(s.note)}</dd>` : ""}</dl>
    <div class="stack"><div class="label">Import progress</div><div class="row">${STAGES.map((st, i) => `<span class="pill ${i < s.stage ? "ok" : i === s.stage && stalled ? (s.status === "processing" ? "info" : "bad") : "neutral"}">${st}</span>`).join("")}</div></div>
    <div class="stack"><div class="label">What depends on it</div>
      <p>${plural(s.facts, "fact comes", "facts come")} from this document${briefs.length ? `, used in ${plural(briefs.length, "briefing", "briefings")}` : ""}.</p>
      ${fs.slice(0, 4).map(f => `<button class="btn ghost" data-act="open-fact" data-id="${f.id}">${esc(f.text)}</button>`).join("")}
      ${other && s.facts ? `<span class="hint">+ ${other} more facts</span>` : ""}</div>
    ${curatorMode() ? `<div class="stack"><div class="label">Change the audience</div>
      <div class="row"><select class="select" id="s-sens" aria-label="New audience">${Object.entries(SENS_LABEL).map(([k, l]) => `<option value="${k}" ${k === s.sens ? "selected" : ""}>${l}</option>`).join("")}</select><button class="btn sm" data-act="reclassify" data-id="${s.id}">Apply to the document and its ${plural(s.facts, "fact", "facts")}</button></div></div>` : `<div class="callout info">Curators can change this document's audience or retire it.</div>`}
    ${canRetire ? `<div class="stack"><div class="label">Retire</div>
      <label class="check"><input type="checkbox" id="s-confirm"> I understand this stops ${plural(s.facts, "fact", "facts")} being used and can't be undone. The file is kept for audit.</label>
      <div><button class="btn sm danger" id="s-retire" data-act="retire" data-id="${s.id}" disabled>Retire document</button></div></div>` : ""}`);
  $("#s-confirm")?.addEventListener("change", e => { $("#s-retire").disabled = !e.target.checked; });
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  if (e.target.closest("[data-moretoggle]")) { state.moreOpen = !state.moreOpen; renderShell(); return; }
  if (e.target.closest("[data-navtoggle]")) { state.navOpen = !state.navOpen; renderShell(); $(".navtoggle").focus(); return; }
  const nav = e.target.closest("[data-view]");
  if (nav) { closeOverlay(); state.navOpen = false; go(nav.dataset.view); return; }
  const role = e.target.closest("[data-role]");
  if (role) { state.role = role.dataset.role; closeOverlay();
    if (state.role === "kam" && ["briefings", "sources", "queue"].includes(state.view)) state.view = "start";
    if (state.role === "curator" && ["requests", "projects", "project", "projnew", "coach", "roleplay", "stewardship"].includes(state.view)) state.view = "start";
    render(); toast(`Viewing as ${PEOPLE[state.role].name} · ${PEOPLE[state.role].role}`); return; }
  const ft = e.target.closest("[data-ftype]");
  if (ft) { state.f.type = ft.dataset.ftype; render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.srcTab = tab.dataset.tab; render(); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, p = proj(state.project);
  if (a === "close") { if (e.target === el || el.tagName === "BUTTON") closeOverlay(); return; }
  if (a === "add-fact") addFactModal();
  if (a === "add-source") addSourceModal();
  if (a === "new-project") { state.pn = null; go("projnew"); }
  if (a === "open-project") { closeOverlay(); state.project = id; go("project"); }
  if (a === "open-account") { closeOverlay(); openAccount(el.dataset.cat, el.dataset.cust); }
  if (a === "open-fact") factDrawer(id);
  if (a === "open-source") sourceDrawer(id);
  if (a === "hide-intro") { state.intro = false; store.set("kb-intro-hidden", "1"); render(); }
  if (a === "show-intro") { state.intro = true; store.set("kb-intro-hidden", "0"); render(); }
  if (a === "clear-filters") { state.f = blankFilter(); render(); }
  if (a === "facts-use") { state.f = { ...blankFilter(), use: el.dataset.use }; go("facts"); }
  if (a === "todo") state.todo[+el.dataset.k]?.go();
  if (a === "pick-brief") { state.briefKey = el.dataset.key; render(); }
  if (a === "open-brief") { const [cat, cust] = el.dataset.key.split("|"); state.bf = { q: "", cat, cust: cust || "" }; state.briefKey = el.dataset.key; go("briefings"); }
  if (a === "regen") { const b = BRIEFINGS.find(x => bkey(x) === el.dataset.key); const inDrawer = !!el.closest(".drawer"); b.status = "current"; b.generated = TODAY; delete b.why; render(); if (inDrawer) openDrawer(`<div class="spread"><span class="label">Briefing</span><button class="btn sm plain" data-act="close">Close</button></div>${briefingDoc(b)}`); toast("Briefing refreshed from the current facts"); }

function saveProfile(n) {

  const info = [...n.info.split("\n").filter(Boolean), ...add.filter(e => e[3] === "Information").map(e => e[0])];
  PROFILES.push({ cust: n.name, owner: (typeof domainOwner === "function" ? domainOwner(n.name) : PEOPLE.kam.name), reviewed: TODAY, version: 1, channels: ["Supermarket", "Convenience"], objectives, info, posture: n.postureText.replace(/^\[[^\]]*\]\s*/, ""),
    sources: [...cnDocs(n).filter((d, i) => n.docs[i]).map(d => `${d[0]} · owner-only`), ...add.map(e => `${e[1]} · public`)] });
  if (!CUSTOMERS.includes(n.name)) CUSTOMERS.push(n.name);
  const lines = [...objectives, ...info];
  lines.forEach((t, i) => FACTS.unshift({ id: "F-" + (3000 + FACTS.length), type: "insight", text: t, cat: null, cust: n.name, rel: i < objectives.length - 0 && add.some(e => e[0] === t) ? "reviewed" : "stated", sens: "internal", owner: null, status: "verified", asOf: TODAY, src: null, origin: "the customer profile", loc: `Customer profile · ${n.name}`, excerpt: "Approved by the profile owner through three gates.", dedup: 1, by: PEOPLE.kam.name }));
  n.added = lines.length;
  if (n.from === "coach" && state.sc) state.sc.cust = n.name;
  if (n.from === "projnew" && state.pn) state.pn.cust = n.name;
}

    body = f.step === "form" ? `<div class="card"><div class="card-hd">${esc(f.leaver)} is moving to a new role</div><div class="pad stack">
        <div class="grid3"><div class="field"><label>Leaving</label><input value="${esc(f.leaver)}" disabled></div><div class="field"><label for="off-r">Reason</label><select id="off-r" data-bind="tc.off.reason">${["Role change", "Leaving the company", "Parental leave"].map(r => `<option ${r === f.reason ? "selected" : ""}>${r}</option>`).join("")}</select></div><div class="field"><label for="off-s">Successor</label><input id="off-s" data-bind="tc.off.successor" value="${esc(f.successor)}"></div></div>
        <div class="wiqhero"><span class="wiqhero__ico">${icon("db")}</span><span><b>Capture and hand over into the Knowledge Bank</b><br><span class="small muted">Consolidates what ${esc(f.leaver)} owns on the account: profiles, private notes, buyers, projects and open requests. You review it before anything transfers.</span></span></div>
        <div class="actions"><button class="btn primary" data-x="off-build">Build the handover</button></div></div></div>`
      : f.step === "building" ? `<div class="card pad stack"><b>Preparing ${esc(f.leaver)}'s handover</b>${stagesHTML([["Finding what they own and wrote", "Knowledge Bank"], ["Consolidating facts, notes and open actions", "Knowledge Bank"], ["Removing duplicates and out-of-date content", "Knowledge Bank"], [`Proposing a handover pack for ${f.successor}`, "Knowledge Bank"]], f.done)}</div>`
      : f.step === "proposal" ? `<div class="callout info"><b>A handover you review before it transfers.</b> Untick anything that shouldn't carry over. The rest goes to ${esc(f.successor)} and pre-loads their onboarding.</div>
        <div class="stack section">${f.items.map((m, i) => `<label class="entity ${m.on ? "sel" : ""}">${chk(m.on, `data-x="off-item" data-i="${i}"`)}<span><b>${esc(m.t)}</b><br><span class="hint">${esc(m.d)}</span></span></label>`).join("")}</div>
        <div class="actions section"><button class="btn plain" data-x="off-back">Back</button><span style="flex:1"></span><button class="btn primary" data-x="off-go">Hand over and notify ${esc(f.successor)}</button></div>`
      : `<div class="card pad stack" style="text-align:center;justify-items:center"><span class="okmark">✓</span><h2>Handover complete</h2><p class="small muted" style="max-width:60ch">Profile ownership moved to ${esc(f.successor)}, a handover grant lets them read ${esc(f.leaver)}'s private notes, and they've been notified.</p><div class="callout ok" style="text-align:left"><b>Handover feeds onboarding.</b> ${esc(f.successor)}'s onboarding program is now pre-loaded with this pack.</div><button class="btn" data-x="tc-tab" data-v="on">Open the onboarding tab</button></div>`;
  }
  return head("Training Center", "Onboarding & handover", "Built on the Knowledge Bank: new joiners learn from the account's checked knowledge, and leavers' knowledge is captured back into it so nothing walks out the door.") + NOTE + tabs + body;
};

/* =====================================================================
   Events for the integrated flows (data-x) and form bindings (data-bind)
   ===================================================================== */
document.addEventListener("click", e => {
  const menu = $("#createmenu");
  if (menu?.open && (!menu.contains(e.target) || e.target.closest(".createmenu__list button"))) menu.open = false;
}, true);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-x]");
  if (!el) return;
  const x = el.dataset.x, id = el.dataset.id, v = el.dataset.v;
  const later = fn => setTimeout(fn, 0);   // let a checkbox settle before re-rendering
  switch (x) {
    case "toast": toast(el.dataset.msg); break;
    case "open-run": runDrawer(id); break;
    case "pc-help": pcHelp(); break;
    case "prof-edit": profileEditDrawer(v); break;
    case "prof-save": { const pr = profileOf(v), lines = sel => $(sel).value.split("\n").map(t => t.trim()).filter(Boolean);
      pr.objectives = lines("#pe-obj"); pr.info = lines("#pe-info"); pr.posture = $("#pe-post").value.trim(); pr.version++; pr.reviewed = TODAY;
      render(); profileDrawer(v); toast(`Saved as version ${pr.version}.`); break; }
    case "buyer-edit": buyerEditDrawer(id); break;
    case "buyer-save": { const b = BUYERS.find(y => y.id === id); b.role = $("#be-role").value.trim() || b.role; b.disc = $("#be-disc").value.trim() || b.disc;
      b.goals = $("#be-goals").value.trim(); b.style = $("#be-style").value.trim(); b.friction = $("#be-fric").value.trim(); b.updated = "today"; closeOverlay(); render(); toast(`${b.name} updated.`); break; }
    case "buyer-delete": { const b = BUYERS.find(y => y.id === id); BUYERS = BUYERS.filter(y => y !== b);
      PROJECTS.forEach(pj => { if (pj.buyer && pj.buyer.startsWith(b.name + " ·")) pj.buyer = null; }); closeOverlay(); render(); toast(`${b.name} deleted.`); break; }
    case "coach-from-project": state.sc = scDefaults(proj(state.project)); go("coach"); break;
    case "open-update": updateDrawer(id); break;
    case "apply-update": { const u = UPDATES.find(y => y.id === id), pr = profileOf(u.cust);
      u.items.forEach(it => { pr[it.field][it.i] = it.now; }); pr.version++; pr.reviewed = TODAY; pr.sources.push(...u.items.map(it => it.src + " · public"));
      UPDATES = UPDATES.filter(y => y !== u); closeOverlay(); render(); toast(`${u.cust} profile updated to version ${pr.version}.`); break; }
    case "open-profile": profileDrawer(v); break;
    case "suggest-edit": suggestEditModal(v); break;
    case "request-cust": requestCustModal(); break;
    case "ppl-tab": state.pplTab = v; render(); break;
    // project wizard
    case "pn-buyer": later(() => { const n = state.pn; n.buyers = n.buyers.includes(id) ? n.buyers.filter(b => b !== id) : [...n.buyers, id]; render(); }); break;
    case "pn-aud": state.pn.aud = v; render(); break;
    case "pn-next": state.pn.step = 1; render(); $("#main").scrollTop = 0; break;
    case "pn-back": state.pn.step = 0; render(); break;
    case "pn-create": { const n = state.pn, bs = n.buyers.map(b => BUYERS.find(y => y.id === b));
      const p = { id: "P-" + (PROJECTS.length + 1), name: n.name.trim() || `${n.cust} ${n.cat} review`, cat: n.cat, cust: n.cust, audience: n.aud, meeting: n.date.trim() || null, buyer: bs[0] ? `${bs[0].name} · ${bs[0].role.toLowerCase()}` : null, objective: n.objective.trim() || "No objective set yet.", decks: [], runs: [] };
      PROJECTS.unshift(p); state.pn = null; state.project = p.id; go("project"); toast("Project created"); break; }
    // Selling Coach
    case "sc-deck": state.sc.deck = el.dataset.deck || null; render(); break;
    case "sc-propose": { const c = state.sc, fs = selectFacts(c.cat, c.cust, "").ranked.map(y => y.f).slice(0, 3);
      c.context = `${OBJECTIVES[c.obj]} with ${c.cust}. ${fs.map(f => f.text).join(" ")}`; render(); toast("Drafted from your recent meetings. Edit it as you like."); break; }
    case "sc-pc-build": state.sc.pc = "loading"; state.sc.items = pcItems(state.sc); render(); animate(state.sc, 4, () => { state.sc.pc = "proposal"; }); break;
    case "sc-pc-skip": state.sc.pc = "skipped"; render(); break;
    case "sc-pc-use": state.sc.pc = "attached"; render(); break;
    case "sc-pc-review": state.sc.pc = "proposal"; render(); break;
    case "sc-item": later(() => { const it = state.sc.items[+el.dataset.i]; it.on = !it.on; render(); }); break;
    case "sc-add": { const t = $("#sc-add").value.trim(); if (t) { state.sc.items.push({ t, s: "Added by you · this run only", on: true }); render(); } break; }
    case "sc-new": state.sc = scDefaults(state.sc?.from ? proj(state.sc.from) : null); render(); break;
    case "sc-run": { const c = state.sc, stages = [["Read the deck · 18 slides"], [`Gather Knowledge Bank facts for ${c.cust} · ${c.cat}`], ...(c.pc === "attached" ? [[`Add your personal context · ${c.items.filter(i => i.on).length} items`]] : []), ["Check the five selling steps"], ["Compare the deck's numbers with the bank"], ...(c.buyer ? [["Tailor feedback to the buyer"]] : [])];
      c.run = { stages, html: null }; render(); $("#main").scrollTop = 0;
      animate(c, stages.length, () => { const r = coachResult(c); c.run.html = r.html;
        const run = { id: "RUN-" + Date.now(), tool: "Selling Coach", date: TODAY, status: "Completed", note: `${c.deck} · ${r.grounded} of 5 steps backed by facts`, html: r.html, title: c.deck };
        if (c.from) proj(c.from).runs.unshift(run); else HISTORY.unshift(run);
        FACTS.unshift({ id: "F-" + (2500 + FACTS.length), type: "insight", text: `The ${c.cust} deck “${c.deck}” has no fact behind ${plural(5 - r.grounded, "selling step", "selling steps")}.`, cat: c.cat, cust: c.cust, rel: "stated", sens: "internal", owner: null, status: "needs_review", asOf: TODAY, src: null, origin: "your Selling Coach run", loc: "Selling Coach run", excerpt: `Written back from a completed Selling Coach run on ${TODAY}.`, dedup: 1, by: PEOPLE.kam.name });
        markOutdated(c.cat, c.cust, "A tool run added a fact."); }, 600); break; }
    // customers and buyers
    case "cust-new": state.cn = cnDefaults(el.dataset.name, el.dataset.from); closeOverlay(); go("custnew"); break;
    case "cn-go": { const nm = state.cn.name.trim();
      if (!nm) { toast("Enter the customer's name first."); $("#cn-name")?.focus(); break; }
      if (profileOf(nm)) { toast(`${nm} already has a profile. Opening it instead.`); profileDrawer(nm); break; }
      state.cn.name = nm; state.cn.step = "entity"; render(); break; }
    case "cn-entity": state.cn.entity = +el.dataset.i; render(); break;
    case "cn-read": state.cn.step = "reading"; render(); animate(state.cn, 4, () => { state.cn.step = "gate1"; }); break;
    case "cn-step": state.cn.step = v; render(); $("#main").scrollTop = 0; break;
    case "cn-posture": state.cn.posture = true; render(); break;
    case "cn-doc": later(() => { state.cn.docs[+el.dataset.i] = !state.cn.docs[+el.dataset.i]; render(); toast("Proposal rebuilt with the documents you kept."); }); break;
    case "cn-approve": state.cn.step = "verifying"; render(); $("#main").scrollTop = 0; animate(state.cn, 4, () => { state.cn.step = "gate2"; }); break;
    case "cn-enrich": later(() => { state.cn.enrich[+el.dataset.i] = !state.cn.enrich[+el.dataset.i]; render(); }); break;
    case "cn-enrich-all": state.cn.enrich = state.cn.enrich.map(() => v === "1"); render(); break;
    case "cn-save": saveProfile(state.cn); state.cn.step = "saved"; render(); $("#main").scrollTop = 0; toast(`${state.cn.name} added to the Knowledge Bank`); break;
    case "buyer-new": state.bn = bnDefaults(el.dataset.cust, el.dataset.from, el.dataset.name); closeOverlay(); go("buyernew"); break;
    case "bn-go": if (!state.bn.name.trim()) { toast("Enter the buyer's name first."); $("#bn-name")?.focus(); break; }
      state.bn.step = "reading"; render(); animate(state.bn, 5, () => { state.bn.step = "proposal"; }); break;
    case "bn-disc": state.bn.disc = true; render(); break;
    case "bn-src": later(() => { state.bn.src[+el.dataset.i] = !state.bn.src[+el.dataset.i]; render(); toast("Proposal rebuilt with the sources you kept."); }); break;
    case "bn-push": state.bn.pushed = true; REQS.push({ kind: "Edit suggested", title: `${state.bn.cust}: growing own label company-wide (from a buyer conversation)`, to: profileOf(state.bn.cust)?.owner || "UK profile owner", status: "Waiting" }); render(); toast("Sent to the customer profile owner."); break;
    case "bn-back": state.bn.step = "form"; render(); break;
    case "bn-save": { const n = state.bn, b = { id: "B-" + (BUYERS.length + 1), name: n.name, role: n.role, cust: n.cust, cat: n.cat, disc: n.discText.replace(/^\[[^\]]*\]\s*/, "").split(".")[0], updated: "today", owner: PEOPLE.kam.name, goals: "Grow own label while protecting margin on premium lines.", style: n.discText.replace(/^\[[^\]]*\]\s*/, ""), friction: "Pushed back on premium shelf space last review." };
      BUYERS.push(b); n.saved = b.id; n.step = "saved"; if (n.from === "projnew" && state.pn) state.pn.buyers.push(b.id);
      if (n.from === "project") { const pj = proj(state.project); if (pj && pj.cust === b.cust) pj.buyer = `${b.name} · ${b.role.toLowerCase()}`; } render(); toast(`${n.name} saved. Private to you.`); break; }
    case "buyer-coach": { const b = BUYERS.find(y => y.id === id); state.sc = { ...scDefaults(PROJECTS.find(p => p.cust === b.cust) || null), cust: b.cust, cat: b.cat, buyer: b.id }; go("coach"); break; }
    case "buyer-attach": { const b = BUYERS.find(y => y.id === id), p = PROJECTS.find(y => y.cust === b.cust); p.buyer = `${b.name} · ${b.role.toLowerCase()}`; render(); toast(`${b.name} attached to ${p.name}.`); break; }
    // training
    case "tc-tab": state.tc.tab = v; render(); break;
    case "on-build": state.tc.on.step = "building"; state.tc.on.mods = modulesFor(state.tc.on.acct); render(); animate(state.tc.on, 4, () => { state.tc.on.step = "proposal"; }); break;
    case "on-mod": later(() => { const m = state.tc.on.mods[+el.dataset.i]; m.on = !m.on; render(); }); break;
    case "on-back": state.tc.on.step = state.tc.on.step === "done" ? "proposal" : "form"; render(); break;
    case "on-assign": state.tc.on.step = "done"; render(); toast(`Program assigned to ${state.tc.on.joiner}`); break;
    case "off-build": state.tc.off.step = "building"; state.tc.off.items = handoverFor(state.tc.off.leaver); render(); animate(state.tc.off, 4, () => { state.tc.off.step = "proposal"; }); break;
    case "off-item": later(() => { const m = state.tc.off.items[+el.dataset.i]; m.on = !m.on; render(); }); break;
    case "off-back": state.tc.off.step = "form"; render(); break;
