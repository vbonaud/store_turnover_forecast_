const lc = t => t.charAt(0).toLowerCase() + t.slice(1);
function prepareHTML(p) {
  const fl = flowOf(p); state.pf = fl;
  const b = buyerOf(p), cite = citer(p);
  const steps = `<div class="stepper">${FLOW_STEPS.map((s, i) => `<button class="step ${i < fl.step ? "done" : i === fl.step ? "active" : ""}" data-x="pf-go" data-i="${i}" ${i > maxStep(fl) ? "disabled" : ""}><span class="n">${i < fl.step ? "✓" : i + 1}</span>${s}</button>${i < 3 ? '<span class="step-sep"></span>' : ""}`).join("")}</div>`;
  let body = "";
  if (fl.step === 0) body = fl.running ? `<div class="card pad stack"><b>Reading ${esc(fl.deck)}</b>${stagesHTML([["Read the deck · 10 slides"], [`Gather what we know about ${p.cust} · ${p.cat}`], ...(fl.pc ? [["Add your personal context", "Personal context"]] : []), ["Check each slide against the facts"], ["Compare the deck's numbers with the bank"]], fl.done)}</div>`
    : `<div class="card"><div class="card-hd">Your deck<span class="aside">PPTX or PDF</span></div><div class="pad stack">
      ${p.decks.map(d => `<button class="filerow ${fl.deck === d ? "sel" : ""}" data-x="pf-deck" data-deck="${esc(d)}">${icon("file")}${esc(d)}${fl.deck === d ? `<span class="pill ok" style="margin-left:auto">Selected</span>` : ""}</button>`).join("")}
      <button class="filerow" data-x="pf-deck" data-deck="${esc(p.cust)} meeting deck.pptx">${icon("plus")}Upload a deck</button></div></div>
    <div class="card section"><div class="card-hd">The meeting<span class="aside">From the project</span></div><div class="pad stack">
      <div class="grid3"><div class="field"><label>Objective</label><span class="small">${esc(p.objective)}</span></div><div class="field"><label>Buyer</label><span class="small">${b ? `${esc(b.name)} · ${esc(b.disc)}` : "None attached"}</span></div>
      <div class="field"><label for="pf-min">Minutes available</label><input id="pf-min" type="number" min="5" data-bind="pf.minutes" value="${fl.minutes}"></div></div>
      <label class="check">${chk(fl.pc, `data-x="pf-pc"`)} Use my personal context for this run <button type="button" class="btn ghost small" data-x="pc-help">What is this?</button></label></div></div>
    <div class="actions section" style="justify-content:flex-end"><button class="btn primary" data-x="pf-feedback" ${fl.deck ? "" : "disabled"}>Get feedback →</button></div>`;
  if (fl.step === 1) {
    const S = fl.slides, cnt = s => S.filter(x => x.status === s).length;
    const covered = [0, 1, 2, 3, 4].map(i => S.some(x => x.step === i && (x.status === "ok" || x.fact)));
    body = `<div class="card pad result-hd"><div><span class="label">Deck score</span><div class="bigscore">${(5 * S.filter(x => x.status === "ok" || x.applied).length / S.length).toFixed(1)}<span>/5</span></div></div>
      <div class="stack" style="gap:6px"><b>${plural(cnt("fix") + cnt("evidence"), "slide to fix", "slides to fix")} · ${plural(cnt("gap"), "gap", "gaps")} in the bank · ${cnt("cut")} to cut</b>
      <div class="row">${["Situation", "Idea", "How it works", "Benefits", "Next step"].map((s, i) => `<span class="pill ${covered[i] ? "ok" : "warn"}">${s}</span>`).join("")}</div>
      <span class="hint">${b ? `Tailored to ${esc(b.name)}. ` : ""}${fl.pc ? "Personal context used for this run only." : "No personal context used."}</span></div></div>
      <div class="stack section">${S.map(s => { const q = s.fact && quotable(s.fact, p.audience);
        return `<div class="slide ${s.status}"><div class="thumb"><span>${s.n}</span><b>${esc(s.title)}</b></div><div class="stack" style="gap:6px;min-width:0">
          <span class="row">${{ ok: `<span class="pill ok">Strong</span>`, evidence: `<span class="pill warn">Needs evidence</span>`, fix: `<span class="pill bad">Number to fix</span>`, gap: `<span class="pill neutral">Missing in the bank</span>`, cut: `<span class="pill neutral">Cut or move</span>` }[s.status]}${s.applied ? `<span class="pill ok">${icon("check")}Applied</span>` : ""}</span>
          <span class="small">${s.fact && !q && s.status === "fix" ? `Says 19.4%. The official figure is 18.6%, but it's internal only: take the number off this customer slide, or ask the curator to clear it.` : esc(s.note)}</span>
          ${s.fact ? `<div class="excerpt">“${esc(s.fact.text)}” ${cite(s.fact)}${q ? "" : `<div class="hint">${esc(usage(s.fact).why)}</div>`}</div>
            <div class="row"><button class="btn sm" data-x="pf-copy" data-n="${s.n}">Copy with source</button>${q ? `<button class="btn sm ${s.applied ? "plain" : "primary"}" data-x="pf-apply" data-n="${s.n}" ${s.applied ? "disabled" : ""}>${s.applied ? "Applied" : `Apply to slide ${s.n}`}</button>` : s.fact.clearReq ? `<span class="pill info">Clearance requested</span>` : s.fact.sens === "internal" ? `<button class="btn sm plain" data-act="ask-clear" data-id="${s.fact.id}">Ask to use it with customers</button>` : ""}</div>` : ""}
          ${s.status === "gap" ? `<span class="hint">${icon("people")} Added to ${esc(domainOwner(p.cust))}'s list of what sales needs. You'll see it here once it's filled.</span>` : ""}
          </div></div>`; }).join("")}</div>
      <div class="actions section"><button class="btn plain" data-x="pf-go" data-i="0">Change deck</button><span style="flex:1"></span><button class="btn primary" data-x="pf-story">${icon("story")}Help me write my story →</button></div>`;
  }
  if (fl.step === 2) {
    const st = fl.story, short = fl.variant === "shorter";
    const internal = st.steps.filter(s => s.fact && !quotable(s.fact, p.audience));
    body = `<div class="callout info"><b>Your story, built from your deck and what we know about ${esc(p.cust)}.</b> Every claim is cited. Where the bank has nothing, it says so instead of inventing.</div>
      ${internal.length ? `<div class="callout warn section"><b>${internal.length} of ${st.steps.length} headlines rely on internal-only facts.</b> This meeting is customer-facing, so keep those points in your speaker notes, or ask ${esc(domainOwner(p.cust))} to clear them for customers. <button class="btn sm" data-x="pf-clear-all">Ask to clear all ${internal.length}</button></div>` : ""}
      <div class="card section"><div class="card-hd">Storyline${fl.variant ? `<span class="pill info">Refined: ${esc(fl.variant)}</span>` : ""}</div><div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Step</th><th>Headline</th><th>Speaker notes</th><th>From</th></tr></thead><tbody>
      ${st.steps.map(s => `<tr><td style="color:var(--charcoal);font-weight:600;white-space:nowrap">${s.step}</td><td>${esc(s.head)} ${s.fact ? cite(s.fact) : `<span class="bgtag">no evidence</span>`}</td><td>${esc(short ? s.notes.split(".")[0] + "." : s.notes)}${fl.variant === "more on their priorities" && s.step === "Reinforce key benefits" ? " Spend most of your time here." : ""}</td><td class="hint">${s.from}</td></tr>`).join("")}</tbody></table></div></div>
      ${b ? `<div class="card section"><div class="card-hd">For ${esc(b.name)} · ${esc(b.disc)}</div><div class="pad stack small"><span><b>Length:</b> about ${Math.max(4, Math.round(fl.minutes / 5))} slides for ${fl.minutes} minutes. Lead with the number.</span><span><b>How to engage:</b> ${esc(b.style)}</span></div></div>` : ""}
      <div class="card section"><div class="card-hd">Likely objections and answers</div><div class="pad stack">${st.objections.map(o => `<div class="stack" style="gap:4px"><b class="small">${esc(o.q)}</b><span class="small">${o.a ? `${esc(o.a.text)} ${cite(o.a)}` : `<span class="bgtag">no evidence</span> Ask ${esc(domainOwner(p.cust))} for a fact to answer this.`}</span></div>`).join("")}</div></div>
      <div class="card section"><div class="card-hd">Before and after</div><div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Your deck said</th><th>Your story says</th></tr></thead><tbody>
        ${fl.slides.filter(s => s.fact && s.status !== "ok").map(s => `<tr><td>Slide ${s.n}: ${esc(s.note.replace(/:$/, "."))}</td><td>${esc(s.fact.text)} ${cite(s.fact)}</td></tr>`).join("")}</tbody></table></div></div>
      ${citeNote(p)}
      <div class="row section"><span class="small muted">Refine:</span>${["shorter", "more on their priorities", "less internal detail"].map(v => `<button class="chip" data-x="pf-refine" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join("")}</div>
      <div class="actions section"><button class="btn plain" data-x="pf-go" data-i="1">Back to feedback</button><button class="btn" data-x="pf-copy-story">Copy story</button><span style="flex:1"></span><button class="btn primary" data-x="pf-approve">Approve story</button></div>`;
  }
  if (fl.step === 3) body = fl.outcome ? `<div class="card pad stack" style="text-align:center;justify-items:center"><span class="okmark">✓</span><h2>Thanks. Sent to ${esc(domainOwner(p.cust))}</h2><p class="small muted" style="max-width:60ch">Your debrief became ${plural(fl.outcome.length, "new fact", "new facts")} in ${esc(p.cust)}'s “History & events” and “People & buyers”. The curator checks them, then the next run starts from here.</p>
      <div class="stack" style="width:100%;text-align:left">${fl.outcome.map(id => factRow(fact(id))).join("")}</div></div>`
    : `<div class="card"><div class="card-hd">How did the meeting go?</div><div class="pad stack">
      <div class="field"><span class="flabel">Outcome</span><div class="seg">${["Agreed", "Partly agreed", "Not yet"].map(o => `<button type="button" data-x="pf-res" data-v="${o}" aria-pressed="${fl.res === o}">${o}</button>`).join("")}</div></div>
      <div class="field"><label for="pf-agreed">What was agreed</label><textarea id="pf-agreed" rows="2" placeholder="e.g. Capsules end-cap in weeks 38–41, promo depth 25%"></textarea></div>
      <div class="field"><label for="pf-fb">What the buyer said</label><textarea id="pf-fb" rows="2" placeholder="e.g. Wants the promotion calendar by 15 Oct"></textarea></div>
      <div class="field"><label for="pf-next">Next meeting</label><input id="pf-next" placeholder="e.g. 05 Dec 2026"></div>
      <div class="callout info">This becomes knowledge for ${esc(p.cust)} and goes to ${esc(domainOwner(p.cust))} (curator) for review.</div>
      <div class="actions"><button class="btn primary" data-x="pf-debrief">Send debrief</button></div></div></div>`;
  return steps + body;
}
const maxStep = fl => fl.outcome ? 3 : fl.approved ? 3 : fl.story ? 2 : fl.slides ? 1 : 0;

/* Project page: Prepare (the flow) and Assistant (the chat) */
const baseProject = RENDER.project, baseProjectAfter = AFTER.project;
RENDER.project = () => {
  const p = proj(state.project), html = baseProject(), tab = state.ptab || "prepare";
  const tabs = `<div class="tabs" role="tablist"><button role="tab" data-x="ptab" data-v="prepare" aria-selected="${tab === "prepare"}">Prepare the meeting</button><button role="tab" data-x="ptab" data-v="assistant" aria-selected="${tab === "assistant"}">Assistant</button></div>`;
  const withTabs = html.replace(NOTE, NOTE + tabs);
  if (tab === "assistant") return withTabs;
  const aside = (withTabs.match(/<aside class="side">[\s\S]*<\/aside>/) || [""])[0];
  return withTabs.replace(/<div class="proj">[\s\S]*$/, `<div class="proj"><section>${prepareHTML(p)}</section>${aside}</div>`);
};
AFTER.project = () => { if ((state.ptab || "prepare") === "assistant") baseProjectAfter(); };

/* Selling Coach page and chat also feed the demand backlog */
const baseCoachResult = coachResult;
coachResult = c => {
  const r = baseCoachResult(c), map = ["performance", "shopper", "plans", "strategy", "history"];
  const fs = selectFacts(c.cat, c.cust, "").ranked.map(x => x.f);
  const has = [fs.some(f => f.type === "metric"), fs.some(f => f.type === "recommendation" || f.type === "insight"), fs.some(f => f.type === "recommendation"), fs.filter(f => f.type === "metric" || f.type === "insight").length > 1, fs.some(f => f.type === "event")];
  has.forEach((h, i) => { if (!h) addDemand(c.cust, c.cat, map[i], ["Current sales and share", "A shopper insight", "The agreed plan", "A customer benefit to point to", "An agreed next step"][i] + ` for ${c.cust}`, "Selling Coach feedback"); });
  return r;
};

/* Events */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-x]"); if (!el) return;
  const x = el.dataset.x, v = el.dataset.v, p = proj(state.project), fl = p && p.flow;
  switch (x) {
    case "open-domain": closeOverlay(); state.domain = v; go("domain"); break;
    case "k-add": addKnowledgeModal(v, el.dataset.k, el.dataset.d); break;
    case "k-jump": e.preventDefault(); document.getElementById("k-" + el.dataset.k)?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "k-refresh": { const f = fact(el.dataset.id); f.asOf = TODAY; render(); toast("Marked as still true today."); break; }
    case "d-dismiss": DEMAND = DEMAND.filter(d => d.id !== el.dataset.id); render(); toast("Request dismissed."); break;
    case "fact-edit-save": { const f = fact(el.dataset.id), t = $("#fe-text").value.trim(); if (t) { f.text = t; f.asOf = TODAY; markOutdated(f.cat, f.cust, "A fact was edited."); } render(); factDrawer(f.id); toast("Saved."); break; }
    case "ptab": state.ptab = v; render(); break;
    case "pf-go": { const i = +el.dataset.i; if (i <= maxStep(fl)) { fl.step = i; render(); } break; }
    case "pf-deck": fl.deck = el.dataset.deck; if (!p.decks.includes(fl.deck)) p.decks.push(fl.deck); fl.slides = null; fl.story = null; render(); break;
    case "pf-pc": setTimeout(() => { fl.pc = !fl.pc; render(); }, 0); break;
    case "pf-feedback": fl.running = true; render(); animate(fl, fl.pc ? 5 : 4, () => {
      fl.running = false; fl.slides = genSlides(p); fl.step = 1; fl.story = null; fl.approved = false;
      fl.slides.filter(s => s.gap).forEach(s => addDemand(p.cust, p.cat, s.gap.k, s.gap.text, "Selling Coach feedback"));
      const score = (5 * fl.slides.filter(s => s.status === "ok").length / fl.slides.length).toFixed(1);
      p.runs.unshift({ id: "RUN-" + Date.now(), tool: "Selling Coach", date: TODAY, status: "Completed", note: `${fl.deck} · slide-by-slide feedback · ${score}/5`, title: fl.deck });
    }, 550); break;
    case "pf-copy": case "pf-apply": { const s = fl.slides.find(y => y.n === +el.dataset.n), f = s.fact, text = `${f.text} (Source: ${sourceName(f)}, ${f.asOf})`;
      if (x === "pf-apply") { s.applied = true; render(); toast(`Applied to slide ${s.n}.`); }
      else navigator.clipboard?.writeText(text).then(() => toast("Copied with its source."), () => toast(`Copy not available here. Text: ${text}`)); break; }
    case "pf-story": fl.story = genStory(p); fl.step = 2; fl.variant = ""; fl.story.steps.filter(s => !s.fact).forEach(() => addDemand(p.cust, p.cat, "history", `An agreed next step with ${p.cust} (date and owner)`, "Story writing")); render(); $("#main").scrollTop = 0; break;
    case "pf-clear-all": { const fs = fl.story.steps.map(s => s.fact).filter(f => f && !quotable(f, p.audience) && f.sens === "internal" && !f.clearReq);
      fs.forEach(f => { f.clearReq = true; REVIEW.push({ id: "R-" + (REVIEW.length + 30), kind: "Customer clearance request", cls: "info", cat: f.cat || p.cat, title: f.text, body: `${PEOPLE.kam.name} wants to use this in a customer meeting (${p.name}).`, actions: [["Clear for customers", "primary"], ["Keep internal", ""]], fact: f.id, raised: "clear" }); });
      renderShell(); toast(`${plural(fs.length, "request", "requests")} sent to ${domainOwner(p.cust)}.`); break; }
    case "pf-refine": fl.variant = v; render(); toast(`Story refined: ${v}.`); break;
    case "pf-copy-story": { const t = fl.story.steps.map(s => `${s.step}: ${s.head}${s.fact ? ` (Source: ${sourceName(s.fact)})` : ""}`).join("\n"); navigator.clipboard?.writeText(t).then(() => toast("Story copied."), () => toast("Copy not available here.")); break; }
    case "pf-approve": fl.approved = true; fl.step = 3; p.runs.unshift({ id: "RUN-" + Date.now(), tool: "Storyline", date: TODAY, status: "Approved", note: `Story for ${fl.deck}`, title: `Story · ${fl.deck}`, html: `<div class="card pad stack">${fl.story.steps.map(s => `<div><b>${s.step}</b><br><span class="small">${esc(s.head)}</span></div>`).join("")}</div>` }); render(); toast("Story approved and saved to the project."); break;
    case "pf-res": fl.res = v; render(); break;
    case "pf-debrief": { const agreed = $("#pf-agreed").value.trim(), fb = $("#pf-fb").value.trim(), next = $("#pf-next").value.trim(), ids = [];
      const add = (t, k, type) => { const id = "F-" + (5000 + FACTS.length); FACTS.unshift({ id, type, ktype: k, text: t, cat: p.cat, cust: p.cust, rel: "stated", sens: "internal", owner: null, status: "needs_review", asOf: TODAY, src: null, origin: "a meeting debrief", loc: `Debrief · ${p.name}`, excerpt: `Debrief by ${PEOPLE.kam.name} after the meeting.`, dedup: 1, by: PEOPLE.kam.name }); ids.push(id); };
      add(`${p.name}: ${(fl.res || "Outcome not set").toLowerCase()}${agreed ? `. Agreed: ${agreed}` : ""}.`, "history", "event");
      if (fb) add(`Buyer feedback: ${fb}`, "people", "insight");
      if (next) add(`Next meeting with ${p.cust} on ${next}.`, "history", "event");
      DEMAND = DEMAND.filter(d => !(d.cust === p.cust && d.k === "history" && next));
      fl.outcome = ids; markOutdated(p.cat, p.cust, "A meeting debrief arrived."); render(); toast(`Debrief sent to ${domainOwner(p.cust)}.`); break; }
  }
});

/* Curator home replaces Home for curators; the review queue gets its own page */
const baseStart = RENDER.start;
RENDER.start = () => curatorMode() ? curatorHome() : baseStart();
RENDER.queue = () => { state.srcTab = "review"; return RENDER.sources().replace("<h1>Sources & review</h1>", "<h1>Review queue</h1>"); };

render();
</script>
