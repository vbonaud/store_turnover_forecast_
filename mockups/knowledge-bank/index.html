<title>Knowledge Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: AI Sales Assistant shell. App bar on top, grey sidebar, white main.
   Tokens mirror the product's design (customer-profile-builder mockup). Light theme only, by design. */
:root {
  --primary: #003DA5; --primary-dark: #002D7A; --primary-light: #ECF3FF; --primary-lighter: #D1E2FF; --border-primary-light: #A7C6FC;
  --charcoal: #14171B; --slate: #3E4654; --steel: #6B7587; --snow: #FAFAFB;
  --light-gray: #E5E7EB; --gray: #D1D5DB; --border-default: #CACFD8; --surface: #F2F4F6; --white: #FFFFFF;
  --alert-bg: #FFF6DB; --alert-text: #523D00; --alert-accent: #FABB00; --alert-border: #F2DFA0;
  --ok-bg: #E5FFEF; --ok-text: #003D16; --ok-accent: #008530; --ok-border: #9FE4BC;
  --err-bg: #FFF1F0; --err-text: #510400; --err-accent: #DE1409; --err-border: #F6C3BF;
  --info-bg: #F5EAFD; --info-text: #380A59; --info-accent: #7115B2;
  --ink: #0B1B3B; --mark: #FFF1B8; --scrim: rgba(0, 0, 0, .45);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 23, 27, .06), 0 4px 16px rgba(20, 23, 27, .05);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, .25);
  --mont: "Montserrat", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --inter: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--charcoal); font: 14px/1.55 var(--inter); }
h1, h2, h3, h4 { font-family: var(--mont); margin: 0; color: var(--charcoal); text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, select:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--steel); }
.small { font-size: 12px; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--steel); }
.stack { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* Shell */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--light-gray); padding: 11px 20px; }
.appbar__mark { width: 32px; height: 32px; border-radius: 7px; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.appbar__name { font-weight: 500; font-size: 14px; }
.appbar__spacer { flex: 1; }
.avatar { width: 34px; height: 34px; border-radius: 99px; background: linear-gradient(135deg, var(--info-accent), var(--primary)); color: var(--white); display: grid; place-items: center; font: 700 12px var(--mont); flex: none; }
.sidebar { background: var(--surface); border-right: 1px solid var(--light-gray); padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.sidebar .group { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--steel); padding: 14px 11px 6px; }
.navitem { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--slate); font-size: 13px; margin-bottom: 2px; }
.navitem svg.i { color: var(--steel); }
.navitem:hover { background: var(--white); box-shadow: var(--shadow); }
.navitem[aria-current="true"] { background: var(--white); color: var(--primary); font-weight: 600; border-color: var(--primary); box-shadow: var(--shadow); }
.navitem[aria-current="true"] svg.i { color: var(--primary); }
.navitem .count { margin-left: auto; font-size: 11px; color: var(--steel); font-weight: 500; }
.navitem .badge-n { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--white); background: var(--err-accent); border-radius: 99px; padding: 0 7px; }
.main { min-width: 0; overflow-y: auto; background: var(--white); }
.content { padding: 24px 28px 64px; max-width: 1240px; }
.crumb { font-size: 12px; color: var(--steel); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumb button { border: 0; background: none; padding: 0; color: var(--primary); font-weight: 600; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.pagehead h1 { font-size: 22px; font-weight: 700; }
.pagehead .sub { color: var(--slate); font-size: 13px; margin-top: 6px; max-width: 760px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mock-note { display: inline-flex; font-size: 11.5px; color: var(--steel); background: var(--snow); border: 1px dashed var(--border-default); border-radius: 99px; padding: 3px 10px; margin-bottom: 16px; }

/* Primitives */
.btn { border-radius: 999px; padding: 9px 17px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-primary-light); background: var(--white); color: var(--primary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--primary-light); }
.btn.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn.primary:disabled { background: var(--gray); border-color: var(--gray); opacity: 1; }
.btn.plain { color: var(--slate); border-color: var(--border-default); }
.btn.plain:hover:not(:disabled) { background: var(--surface); }
.btn.danger { color: var(--err-accent); border-color: var(--err-border); }
.btn.danger:hover:not(:disabled) { background: var(--err-bg); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--primary); padding: 2px 4px; white-space: normal; text-align: left; border-radius: 6px; }
.card { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-hd { padding: 13px 16px; border-bottom: 1px solid var(--light-gray); font: 600 14px var(--mont); display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.pad { padding: 16px; }
.section { margin-top: 26px; }
.section-title { font: 700 16px var(--mont); margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.pill.warn { background: var(--alert-bg); color: var(--alert-text); border-color: var(--alert-border); }
.pill.bad { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
.pill.info { background: var(--primary-light); color: var(--primary); border-color: var(--border-primary-light); }
.pill.solid { background: var(--primary); color: var(--white); border-color: var(--primary); }
.pill.neutral { background: var(--surface); color: var(--steel); border-color: var(--light-gray); }
.tag { font: 500 11px var(--mono); color: var(--steel); border: 1px solid var(--light-gray); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.type { font: 600 11px var(--mono); color: var(--primary); background: var(--primary-light); border-radius: 4px; padding: 1px 6px; }
.gov { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--light-gray); border-radius: 6px; overflow: hidden; font-size: 11px; white-space: nowrap; color: var(--steel); background: var(--white); }
.gov span { padding: 1px 7px; display: inline-flex; gap: 4px; align-items: center; }
.gov span + span { border-left: 1px solid var(--light-gray); }
.gov b { font-weight: 600; }
.gov .t-certified b { color: var(--ok-accent); } .gov .t-reviewed b { color: var(--primary); } .gov .t-stated b { color: var(--charcoal); }
.gov .s-external b { color: var(--ok-accent); } .gov .s-internal b { color: var(--primary); } .gov .s-restricted b { color: var(--err-accent); }
.gov .v-private b { color: var(--alert-text); }
.facet { font: 500 11px var(--mono); color: var(--steel); word-break: break-all; }
.callout { border-radius: 8px; padding: 12px 14px; border-left: 4px solid; font-size: 13px; }
.callout.info { background: var(--primary-light); border-color: var(--primary); color: #0D2F6B; }
.callout.warn { background: var(--alert-bg); border-color: var(--alert-accent); color: var(--alert-text); }
.callout.ok { background: var(--ok-bg); border-color: var(--ok-accent); color: var(--ok-text); }
.callout.bad { background: var(--err-bg); border-color: var(--err-accent); color: var(--err-text); }
.empty-state { border: 1px dashed var(--border-default); border-radius: var(--radius); padding: 26px; text-align: center; color: var(--steel); font-size: 13px; background: var(--snow); }
.hint { font-size: 11.5px; color: var(--steel); }

/* Summary strip (matches the projects hub strip) */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border-primary-light); border: 1px solid var(--border-primary-light); border-radius: var(--radius); overflow: hidden; }
.summary.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.summary > button, .summary > div { background: var(--primary-light); padding: 13px 16px; border: 0; text-align: left; }
.summary > button:hover { background: var(--primary-lighter); }
.summary .k { font-size: 12.5px; color: var(--slate); }
.summary .num { font: 700 20px var(--mont); font-variant-numeric: tabular-nums; }
.summary .sub { font-size: 11.5px; color: var(--steel); }

/* Filters, tabs, segmented */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search, .select, .input { border: 1px solid var(--border-default); background: var(--white); border-radius: 8px; padding: 8px 11px; font-size: 13px; max-width: 100%; }
.search { width: 260px; }
.search:focus, .select:focus, .input:focus, textarea:focus { outline: 2px solid var(--border-primary-light); border-color: var(--primary); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--steel); }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--primary); box-shadow: var(--shadow); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--slate); }
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--primary); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: var(--primary-light); color: var(--primary); font-weight: 600; font-size: 13px; padding: 9px 18px; border-radius: 8px 8px 0 0; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--white); }
.scope-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 16px; }
.scope-filters .col { display: grid; gap: 6px; align-content: start; }
.scope-filters .select { width: 100%; }

/* Tables */
.table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font: 600 11.5px var(--mont); color: var(--slate); text-transform: uppercase; letter-spacing: .4px; padding: 9px 12px; background: var(--snow); border-bottom: 1px solid var(--light-gray); }
td { padding: 11px 12px; border-bottom: 1px solid var(--light-gray); vertical-align: top; color: var(--slate); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.stbl { min-width: 900px; } .stbl.narrow { min-width: 620px; } .ftable { min-width: 720px; }
.stbl tbody tr[data-act] { cursor: pointer; }
.stbl tbody tr[data-act]:hover td { background: var(--primary-light); }
.stbl .name { font-weight: 600; color: var(--charcoal); word-break: break-word; }
.ftable .gov { flex-wrap: nowrap; }
.stages { display: flex; gap: 2px; margin-top: 6px; }
.stages i { width: 16px; height: 4px; border-radius: 2px; background: var(--light-gray); }
.stages i.done { background: var(--ok-accent); } .stages i.fail { background: var(--err-accent); } .stages i.run { background: var(--alert-accent); }

/* Knowledge Bank home */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.mix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mix-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.mix-row .bar { height: 7px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
.mix-row .bar i { display: block; height: 100%; border-radius: 99px; }
.mix-row .n { text-align: right; font: 600 12.5px var(--inter); font-variant-numeric: tabular-nums; }
.matrix-wrap { overflow-x: auto; }
.matrix { border-collapse: separate; border-spacing: 4px; min-width: 520px; }
.matrix th { background: none; border: 0; padding: 4px 6px; font-size: 11px; }
.matrix td { padding: 0; border: 0; }
.cell { width: 100%; border: 1px solid var(--light-gray); background: var(--white); border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; gap: 4px; min-height: 62px; }
.cell:hover { border-color: var(--primary); }
.cell .n { font: 700 16px var(--mont); font-variant-numeric: tabular-nums; }
.cell.empty { color: var(--steel); background: var(--snow); border-style: dashed; }
.cell.l1 { background: var(--primary-light); }
.cell.l2 { background: var(--primary-lighter); }
.cell.l3 { background: #B9D2FB; }
.todo { display: grid; gap: 1px; background: var(--light-gray); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--light-gray); }
.todo button { background: var(--white); border: 0; text-align: left; padding: 12px 14px; display: grid; gap: 4px; }
.todo button:hover { background: var(--primary-light); }

/* Facts */
.fact { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; text-align: left; width: 100%; box-shadow: var(--shadow); }
.fact:hover { border-color: var(--primary); }
.fact + .fact { margin-top: 8px; }
.fact .statement { font-size: 14.5px; font-weight: 500; color: var(--charcoal); max-width: 80ch; }
.fact.dim { opacity: .6; }
.fact-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--steel); }

/* Briefings */
.briefings { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.blist { display: grid; gap: 8px; }
.bitem { text-align: left; border: 1px solid var(--light-gray); background: var(--white); border-radius: var(--radius); padding: 11px 13px; display: grid; gap: 5px; }
.bitem:hover { border-color: var(--primary); background: var(--primary-light); }
.bitem[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 1px var(--primary); }
.bitem.virtual { border-style: dashed; }
.bitem strong { font: 600 14px var(--mont); }
.doc { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 22px 24px; display: grid; gap: 16px; box-shadow: var(--shadow); line-height: 1.7; }
.doc h2 { font-size: 20px; }
.doc h3 { font-size: 12.5px; color: var(--primary); text-transform: uppercase; letter-spacing: .4px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 78ch; }
.anchor { font: 700 10px var(--inter); color: var(--primary); background: var(--primary-light); border: 0; border-radius: 3px; padding: 0 4px; vertical-align: 2px; }
button.anchor:hover { background: var(--primary); color: var(--white); }
.bgtag { font-size: 10px; font-weight: 600; color: var(--steel); background: var(--surface); border-radius: 3px; padding: 0 4px; vertical-align: 2px; }
.refs { border-top: 1px dashed var(--light-gray); padding-top: 12px; display: grid; gap: 4px; font-size: 12px; color: var(--steel); }
.meter { height: 7px; border-radius: 99px; background: var(--light-gray); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--alert-accent); }

/* Search */
.ask { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.ask form { display: grid; gap: 12px; }
.pipeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--light-gray); border: 1px solid var(--light-gray); border-radius: var(--radius); overflow: hidden; }
.pipeline div { background: var(--snow); padding: 10px 14px; }
.pipeline b { font: 700 18px var(--mont); font-variant-numeric: tabular-nums; display: block; }
.answer { display: grid; gap: 10px; }
.answer ul, .bubble ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border-primary-light); background: var(--white); color: var(--primary); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 500; text-align: left; }
.chip:hover { background: var(--primary-light); }
.linkish { border: 0; background: none; padding: 0; text-align: left; color: var(--charcoal); }
.linkish:hover { color: var(--primary); text-decoration: underline; }
.verdict { border-radius: 8px; padding: 10px 12px; font-size: 13px; border-left: 4px solid; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok-accent); color: var(--ok-text); }
.verdict.warn { background: var(--alert-bg); border-color: var(--alert-accent); color: var(--alert-text); }
.verdict.bad { background: var(--err-bg); border-color: var(--err-accent); color: var(--err-text); }

/* Review queue */
.rq { display: grid; gap: 12px; }
.rcard { background: var(--white); border: 1px solid var(--light-gray); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.rcard h3 { font-size: 15px; }
.rcard p { max-width: 78ch; color: var(--slate); }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side-box { border: 1px solid var(--light-gray); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--snow); }
.side-box .big { font: 700 20px var(--mont); font-variant-numeric: tabular-nums; }

/* Projects */
.projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; }
.projcard { border: 1px solid var(--light-gray); border-radius: 14px; background: var(--white); box-shadow: var(--shadow); padding: 16px 17px; text-align: left; display: grid; gap: 8px; transition: transform .18s ease, box-shadow .18s ease; }
.projcard:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(20, 23, 27, .10); }
.projcard .nm { font: 700 16px var(--mont); }
.projchips { display: flex; gap: 6px; flex-wrap: wrap; }
.projchip { font-size: 11px; font-weight: 600; color: var(--slate); background: var(--surface); border: 1px solid var(--light-gray); border-radius: 99px; padding: 3px 9px; }
.covbar { height: 7px; background: var(--light-gray); border-radius: 99px; overflow: hidden; }
.covbar > span { display: block; height: 100%; border-radius: 99px; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); }
.dots i.on { background: var(--ok-accent); }

/* Project workspace + chat */
.proj { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.chat { display: flex; flex-direction: column; min-height: 560px; }
.thread { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: calc(100vh - 330px); min-height: 380px; background: var(--snow); border-radius: 0 0 0 0; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
.msg.me { justify-content: flex-end; }
.msg .who { width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: var(--white); display: grid; place-items: center; flex: none; }
.msg.me .who { background: linear-gradient(135deg, var(--info-accent), var(--primary)); border-radius: 99px; font: 700 11px var(--mont); order: 2; }
.bubble { background: var(--white); border: 1px solid var(--light-gray); border-radius: 4px 12px 12px 12px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; max-width: min(640px, 100%); font-size: 13.5px; }
.msg.me .bubble { background: var(--primary); color: var(--white); border-color: var(--primary); border-radius: 12px 4px 12px 12px; }
.bubble .tool-hd { display: flex; align-items: center; gap: 8px; font: 600 13px var(--mont); color: var(--primary); }
.bubble table { font-size: 12.5px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--steel); opacity: .4; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: 1; } }
.stagelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const src = id => SOURCES.find(s => s.id === id);
const fact = id => FACTS.find(f => f.id === id);
const proj = id => PROJECTS.find(p => p.id === id);
const scopeLabel = (cat, cust) => [cat || (cust ? null : "All categories"), "UK", cust].filter(Boolean).join(" · ");
const facetKey = (cat, cust) => [cat && `category:${cat.toLowerCase()}`, "market:uk", cust && `customer:${cust.toLowerCase()}`].filter(Boolean).sort().join("|");
const sameScope = (a, cat, cust) => (a.cat || null) === (cat || null) && (a.cust || null) === (cust || null);
const bkey = b => `${b.cat || ""}|${b.cust || ""}`;
const hash = s => { let h = 5381; for (const c of s) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, "0"); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const AUD = { external: "Customer-facing", internal: "Internal team" };

function isLive(f) {
  const s = f.src && src(f.src);
  return (f.status === "verified" || f.status === "needs_review") && (!s || s.status === "live");
}
function visibleToMe(f) { return !f.owner || f.owner === ME; }
function quotable(f, audience) {
  if (!isLive(f)) return [false, "Not retrievable: outdated, replaced, or its source is no longer live."];
  if (f.status !== "verified") return [false, "Needs review. A curator must verify it first."];
  if (audience === "external" && f.sens !== "external") return [false, `Sensitivity is ${f.sens}: it can inform reasoning but is kept out of customer-facing output.`];
  return [true, audience === "external" ? "Verified and cleared for customers." : "Verified."];
}
function briefingFacts(b) { return FACTS.filter(f => sameScope(f, b.cat, b.cust) && isLive(f) && !f.owner); }
function floorOK(b) { const fs = briefingFacts(b); return fs.length >= 3 && fs.some(f => f.type === "metric" && f.rel === "certified"); }
function briefingState(b) { return b.status === "none" ? (floorOK(b) ? "none" : "below") : floorOK(b) ? b.status : "below"; }
const B_PILL = { current: ["ok", "Current"], outdated: ["warn", "Outdated"], below: ["neutral", "Below evidence floor"], none: ["info", "Ready to generate"] };
const S_PILL = { live: ["ok", "Live"], needs_context: ["warn", "Needs context"], quarantined: ["warn", "Quarantined"], failed: ["bad", "Failed"], superseded: ["neutral", "Replaced"], retired: ["neutral", "Retired"], processing: ["info", "Processing"] };

function gov(f) {
  const v = f.owner ? `<span class="v-private">Visibility <b>Private · you</b></span>` : `<span>Visibility <b>Shared</b></span>`;
  return `<span class="gov" title="Reliability · Sensitivity · Visibility"><span class="t-${f.rel}">Reliability <b>${f.rel}</b></span><span class="s-${f.sens}">Sensitivity <b>${f.sens}</b></span>${v}</span>`;
}
const statusPill = f => `<span class="pill ${STATUS_CLS[f.status]}">${STATUS_LABEL[f.status]}</span>`;
const expPill = f => f.expires && isLive(f) ? `<span class="pill warn">Expires ${f.expires}</span>` : "";
function highlight(text, fig) {
  const t = esc(text);
  if (!fig) return t;
  const e = esc(fig);
  return t.includes(e) ? t.replace(e, `<mark>${e}</mark>`) : t;
}
function markOutdated(cat, cust, why) {
  BRIEFINGS.filter(b => sameScope(b, cat, cust)).forEach(b => { b.status = "outdated"; b.why = why; });
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2800);
}

/* Project context pillars. Derived from facts, never set by hand; Buyer is the exception. */
function pillars(p) {
  const live = FACTS.filter(f => isLive(f) && !f.owner);
  return [
    { name: "Category", desc: "Category strategy and shopper context", n: live.filter(f => f.cat === p.cat && !f.cust).length },
    { name: "Customer", desc: "The retailer's profile and priorities", n: live.filter(f => !f.cat && f.cust === p.cust).length },
    { name: "Account", desc: "This customer × category", n: live.filter(f => f.cat === p.cat && f.cust === p.cust).length },
    { name: "Trade panel", desc: "Certified market-share metrics", n: live.filter(f => f.cat === p.cat && (!f.cust || f.cust === p.cust) && f.type === "metric" && f.rel === "certified").length },
    { name: "Buyer", desc: "Buyer attached to the project", n: p.buyer ? 1 : 0, text: p.buyer },
  ];
}
const score = p => pillars(p).filter(x => x.n > 0).length;
function covTone(s) { return s >= 4 ? ["var(--ok-accent)", "Strong context"] : s >= 3 ? ["var(--alert-accent)", "Thin context"] : ["var(--err-accent)", "Insufficient context"]; }

    return `<div class="msg"><div class="who" aria-hidden="true">${icon("spark")}</div><div class="bubble ${m.lock ? "locked" : ""}">${body}</div></div>`;
  }).join("");
}

  setTimeout(() => { m.typing = false; fn(m); if (state.project === p.id) paintThread(); }, delay);
}
function lockOld(p) { p.chat.forEach(m => { if (m.chips) m.used = true; m.lock = true; }); }

const INTENT = [
  ["coach", /(selling coach|deck|slides?|presentation|feedback|psf|review my)/i],
  ["story", /(storyline|story|opportunit|narrative|pitch)/i],
  ["gaps", /(missing|gaps?|coverage|what context)/i],
  ["which", /\b(launch|run|start|open|use)\b.*\b(tool|product|agent|something)\b/i],
];
function userSays(p, text) {
  lockOld(p);
  push(p, { who: "me", text });
  const hits = INTENT.filter(([, re]) => re.test(text)).map(([k]) => k);
  const intent = hits.includes("coach") && hits.includes("story") ? "which" : hits[0] || "kb";
  if (intent === "coach") startCoach(p);
  else if (intent === "story") startStory(p);
  else if (intent === "gaps") contextGaps(p);
  else if (intent === "which") askWhich(p);
  else kbAnswer(p, text);
}

/* Citations respect the audience: quotable facts get a number, the rest steer but are not cited. */
function citer(p) {
  const nums = [];
  return f => {
    if (!f) return `<span class="bgtag">no evidence</span>`;
    if (!quotable(f, p.audience)[0]) return `<button class="bgtag" data-act="open-fact" data-id="${f.id}" style="border:0" title="${esc(quotable(f, p.audience)[1])}">background</button>`;
    let n = nums.indexOf(f.id); if (n < 0) { nums.push(f.id); n = nums.length - 1; }
    return `<button class="anchor" data-act="open-fact" data-id="${f.id}" title="${f.id}">${n + 1}</button>`;
  };
}

/* Tools reach for facts they may quote to this audience first; the rest only steer. */
function preferQuotable(fs, p) { return [...fs.filter(f => quotable(f, p.audience)[0]), ...fs.filter(f => !quotable(f, p.audience)[0])]; }

function askWhich(p) {

}

function startCoach(p) {
  botReply(p, m => {
    m.html = `<div class="tool-hd">${icon("coach")}Selling Coach</div><p>I'll analyse your deck against the five PSF steps using this project's Knowledge Bank scope. Which deck?</p>
      <div class="filepick">${p.decks.map(d => `<button class="filerow" data-act="cs-deck" data-deck="${esc(d)}">${icon("file")}${esc(d)}<span class="hint" style="margin-left:auto">in this project</span></button>`).join("")}

  });
}
function runCoach(p, deck) {
  lockOld(p);
  if (!p.decks.includes(deck)) p.decks.push(deck);
  push(p, { who: "me", text: `Use ${deck}` });
  const r = selectFacts(p.cat, p.cust, "");
  const run = { tool: "Selling Coach", date: TODAY, status: "Running", note: deck };
  p.runs.unshift(run);
  const m = push(p, { who: "bot", html: `<div class="tool-hd">${icon("coach")}Selling Coach · ${esc(deck)}</div>`, stages: [`Resolve Knowledge Bank scope · ${plural(r.inScope, "fact", "facts")}`, "Prepare the deck · 18 slides", "Analyse the five PSF steps", "Fact-check the deck against the bank", "Check strategy fit"], done: 0 });
  const t = setInterval(() => {
    m.done++;
    if (m.done >= m.stages.length) { clearInterval(t); finishCoach(p, deck, r, run); }
    if (state.project === p.id) paintThread();
  }, 650);
  if (state.view === "project") render();
}
function finishCoach(p, deck, r, run) {
  const cite = citer(p), fs = preferQuotable(r.ranked.map(x => x.f), p);
  const pick = (...types) => fs.find(f => types.includes(f.type));
  const steps = [
    ["Summarise the situation", pick("metric"), "Open with the certified market picture"],
    ["State the idea", pick("recommendation", "insight"), "Make the idea one clear sentence"],
    ["Explain how it works", pick("recommendation"), "Show the mechanism, not just the ambition"],
    ["Reinforce key benefits", fs.filter(f => f.type === "metric" || f.type === "insight")[1], "Quantify the upside for the customer"],
    ["Suggest an easy next step", pick("event"), "End on a concrete, low-effort ask"],
  ];
  const grounded = steps.filter(s => s[1]).length;
  const conflict = p.cust === "Northgate";
  run.status = "Completed"; run.note = `${deck} · ${grounded} of 5 PSF steps grounded`;
  push(p, { who: "bot", html: `<div class="tool-hd">${icon("coach")}Selling Coach result · ${grounded} of 5 steps grounded</div>
    <div class="table-wrap"><table><thead><tr><th>PSF step</th><th>Evidence</th><th>Feedback</th></tr></thead><tbody>
    ${steps.map(([s, f, tip]) => `<tr><td style="color:var(--charcoal);font-weight:600">${s}</td><td>${f ? `<span class="pill ok">Grounded</span>` : `<span class="pill warn">No evidence</span>`}</td><td>${f ? `${tip}: “${esc(f.text)}” ${cite(f)}` : `${tip}. The bank has nothing to back this step yet.`}</td></tr>`).join("")}
    </tbody></table></div>
    ${conflict ? `<div class="verdict bad"><b>Fact-check: 1 conflict.</b> Slide 4 says Northgate holds 19.4% of UK Fabric Care. The certified figure is 18.6% ${cite(fact("F-1022"))}. Use the certified number.</div>` : `<div class="verdict ok"><b>Fact-check: no conflicts.</b> Every figure in the deck matches the bank or has no counterpart.</div>`}
    <p class="hint">1 account fact from this run was sent to the Knowledge Bank for review.</p>
    <div class="row"><button class="btn sm primary" data-act="launch" data-tool="story">Build a storyline next</button><button class="btn sm plain" data-act="toast" data-msg="The full report opens in Selling Coach.">Open full report</button></div>` });
  FACTS.unshift({ id: "F-" + (2000 + FACTS.length), type: "insight", text: `The ${p.cust} deck “${deck}” is missing evidence for ${5 - grounded} PSF ${5 - grounded === 1 ? "step" : "steps"}.`, cat: p.cat, cust: p.cust, rel: "stated", sens: "internal", owner: null, status: "needs_review", asOf: TODAY, src: null, loc: `Selling Coach run · ${p.name}`, excerpt: `Written back from a completed Selling Coach run on ${TODAY}.`, dedup: 1 });
  markOutdated(p.cat, p.cust, "A tool run added an account fact.");
  if (state.view === "project") render();
  toast("Selling Coach finished · 1 account fact sent for review");
}

/* ---- Storyline Generator ---- */
const OPP_TITLE = { "F-1045": "Capsules at back-to-school", "F-1046": "Protect capsules from own-label switching", "F-1035": "Trade capsule buyers up to premium", "F-1034": "Win back own-label switchers", "F-1061": "Anchor the spring premium aisle", "F-1067": "Lead with scalp care in grocery", "F-1065": "Scalp care drives trial", "F-1071": "Top-120-store whitening launch", "F-1072": "Refills-led whitening launch" };
function startStory(p) {
  const r = selectFacts(p.cat, p.cust, "");
  const q = r.ranked.filter(x => quotable(x.f, p.audience)[0]);
  if (!q.length) {
    botReply(p, m => { m.html = `<div class="tool-hd">${icon("story")}Storyline Generator</div>
      <div class="verdict warn"><b>I can't start a storyline yet.</b> This project is customer-facing and none of its ${plural(r.inScope, "fact is", "facts are")} cleared to quote to a customer. A storyline needs at least one.</div>
      <p>You can verify the facts waiting for review, add a source with customer-cleared evidence, or switch this project to an internal audience.</p>
      <div class="row"><button class="btn sm" data-act="go-review-facts">Review waiting facts</button><button class="btn sm plain" data-act="add-source">Add a source</button></div>`; });
    return;
  }
  const m = push(p, { who: "bot", html: `<div class="tool-hd">${icon("story")}Storyline Generator</div>`, stages: [`Read grounded context · ${plural(r.inScope, "fact", "facts")}`, "Scout proposes opportunities", "Cross-check with a second model"], done: 0 });
  const t = setInterval(() => {
    m.done++;
    if (m.done >= m.stages.length) { clearInterval(t); showOpps(p, r); }
    if (state.project === p.id) paintThread();
  }, 650);
}
function showOpps(p, r) {
  const fs = r.ranked.map(x => x.f);
  const cands = fs.filter(f => f.type === "recommendation" || f.type === "insight").slice(0, 3);
  const tension = fs.find(f => f.type === "metric" && quotable(f, p.audience)[0]) || fs.find(f => f.type === "metric");
  p.opps = cands.map((f, i) => ({ f, title: OPP_TITLE[f.id] || f.text, tension, rec: i === 0, agree: i === 0 ? "both" : i === 1 ? "primary only" : "cross-check only" }));
  const cite = citer(p);
  push(p, { who: "bot", html: `<p>Here are ${plural(p.opps.length, "opportunity", "opportunities")}. I recommend the first one because it has the strongest evidence and both models raised it.</p>
    ${p.opps.map((o, i) => `<div class="opt ${o.rec ? "rec" : ""}"><span class="spread"><strong>${esc(o.title)}</strong><span class="row">${o.rec ? `<span class="pill solid">Recommended</span>` : ""}<span class="pill neutral">${o.agree}</span></span></span>
      <span class="small">${esc(o.f.text)} ${cite(o.f)}</span>
      ${o.tension ? `<span class="small muted"><b>Tension:</b> ${esc(o.tension.text)} ${cite(o.tension)}</span>` : ""}
      <div><button class="btn sm ${o.rec ? "primary" : ""}" data-act="st-pick" data-i="${i}">Choose this one</button></div></div>`).join("")}` });
}
function pickOpp(p, i) {
  lockOld(p);
  const o = p.opps[i];
  push(p, { who: "me", text: `Go with “${o.title}”.` });
  botReply(p, m => {
    const r = selectFacts(p.cat, p.cust, ""), fs = preferQuotable(r.ranked.map(x => x.f), p), cite = citer(p);
    const byType = t => fs.filter(f => f.type === t);
    const steps = [
      ["Summarise the situation", o.tension],
      ["State the idea", o.f, o.title],
      ["Explain how it works", byType("recommendation").find(f => f !== o.f) || o.f],
      ["Reinforce key benefits", fs.find(f => (f.type === "metric" || f.type === "insight") && f !== o.tension && f !== o.f)],
      ["Suggest an easy next step", byType("event")[0]],
    ];
    const run = { tool: "Storyline Generator", date: TODAY, status: "Ready for review", note: o.title };
    p.runs.unshift(run); p.storyRun = run;
    m.html = `<div class="tool-hd">${icon("story")}PSF storyline · ${esc(o.title)}</div>
      <div class="table-wrap"><table><thead><tr><th>Step</th><th>Headline</th></tr></thead><tbody>
      ${steps.map(([s, f, lead]) => `<tr><td style="color:var(--charcoal);font-weight:600;white-space:nowrap">${s}</td><td>${lead ? `<b>${esc(lead)}.</b> ` : ""}${f ? esc(f.text) : "Agree the next step with the buyer."} ${cite(f)}</td></tr>`).join("")}
      </tbody></table></div>
      ${p.audience === "external" ? `<p class="hint">Customer-facing: only customer-cleared facts are numbered. Background facts shaped the story but will not appear on slides.</p>` : ""}
      <div class="row"><button class="btn sm primary" data-act="st-approve">Approve storyline</button><button class="btn sm plain" data-act="st-refine">Refine</button></div>`;
    if (state.view === "project") render();
  }, 900);
}

/* =====================================================================
   Search: a visible fact selection (filter, rank, collapse)
   ===================================================================== */
function selectFacts(cat, cust, q) {
  const words = (q || "").toLowerCase().split(/\W+/).filter(w => w.length > 3);
  const live = FACTS.filter(visibleToMe).filter(isLive);
  const inScope = live.filter(f => (f.cat === cat && (!f.cust || (cust && f.cust === cust))) || (!f.cat && cust && f.cust === cust));
  const RW = { certified: 1, reviewed: .8, stated: .6 };
  const ranked = inScope.map(f => {
    const overlap = words.filter(w => f.text.toLowerCase().includes(w)).length;
    const rel = Math.min(1, .45 + overlap * .15 + (f.cust ? .1 : 0));
    return { f, score: rel * (f.status === "verified" ? 1 : .7) * RW[f.rel] * (f.expires ? .85 : 1) };
  }).sort((a, b) => b.score - a.score).slice(0, 8);
  const merged = ranked.reduce((n, r) => n + (r.f.dedup - 1), 0);
  const hasMetric = ranked.some(r => r.f.type === "metric" && r.f.rel === "certified");
  const coverage = !ranked.length ? "none" : ranked.length >= 3 && hasMetric ? "sufficient" : "thin";
  return { live: live.length, inScope: inScope.length, ranked, merged, coverage };
}
const COV = { sufficient: ["ok", "Sufficient", "Enough trusted evidence on this scope. Tools use these facts directly."], thin: ["warn", "Thin", "Some evidence, but below the must-have floor. Tools proceed, fall back to general frameworks for the gaps, and flag them."], none: ["bad", "None", "Nothing on this scope. Tools skip Knowledge Bank grounding and use general frameworks only."] };
function shortWhy(f, audience) {
  if (f.status !== "verified") return "Needs review";
  if (audience === "external") return f.sens === "restricted" ? "Restricted" : "Internal only";
  return "";
}

          <span class="hint">Customer-facing keeps internal and restricted facts as background only.</span></div>

        <div class="field"><label for="n-date">Content date</label><input id="n-date" name="asOf" value="${TODAY}"><span class="hint">The date the fact is about, not today's date.</span></div></div>
      <div class="field"><label for="n-text">Statement</label><textarea id="n-text" name="text" required placeholder="e.g. Northgate will cut laundry SKUs by 10% at the November range review."></textarea></div>
      <div class="grid3"><div class="field"><label for="n-fig">Figure (optional)</label><input id="n-fig" name="fig" placeholder="10%"></div>
        <div class="field"><label for="n-period">Period (optional)</label><input id="n-period" name="period" placeholder="FY 2026-27"></div>
        <div class="field"><label for="n-cat">Category</label><select id="n-cat" name="cat"><option value="">None (customer only)</option>${CATEGORIES.map(c => `<option ${c === "Fabric Care" ? "selected" : ""}>${c}</option>`).join("")}</select></div></div>
      <div class="grid2"><div class="field"><label for="n-cust">Customer</label><select id="n-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option ${c === "Northgate" ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
        <div class="field"><label for="n-src">Evidence</label><select id="n-src" name="src"><option value="">My own knowledge</option>${srcOpts}</select></div></div>
      <div class="field"><label for="n-ex">Supporting passage</label><textarea id="n-ex" name="excerpt" rows="2" placeholder="Paste the sentence or note that backs this up. Any figure must appear here."></textarea></div>
      <div class="grid2"><div class="field"><label for="n-sens">Sensitivity</label><select id="n-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div>
        <div class="field"><label for="n-vis">Visibility</label><select id="n-vis" name="vis"><option value="shared">Shared with the team</option><option value="private">Private to me</option></select></div></div>
      <p class="hint" id="n-err" style="color:var(--err-accent)" hidden></p>
      <div class="callout info">New facts start as <b>needs review</b>. Reliability comes from the evidence, so your own knowledge is <b>stated</b>. A curator verifies it before any tool can quote it.</div>
      <div class="foot"><button type="button" class="btn plain" data-act="close">Cancel</button><button class="btn primary" type="submit">Add fact</button></div>
    </form>`, fd => {
      const fig = fd.get("fig").trim(), ex = fd.get("excerpt").trim(), err = $("#n-err");
      if (!fd.get("cat") && !fd.get("cust")) { err.hidden = false; err.textContent = "Pick a category, a customer, or both, so the fact has a scope."; return; }
      if (fig && !ex.includes(fig)) { err.hidden = false; err.textContent = `The figure “${fig}” is not in the supporting passage. Add it to the passage or remove the figure.`; return; }
      const s = fd.get("src") ? src(fd.get("src")) : null;
      const f = { id: "F-" + (2000 + FACTS.length), type: fd.get("type"), text: fd.get("text").trim(), fig: fig || null, period: fd.get("period").trim() || null, cat: fd.get("cat") || null, cust: fd.get("cust") || null,
        rel: s ? s.rel : "stated", sens: fd.get("sens"), owner: fd.get("vis") === "private" ? ME : null, status: "needs_review", asOf: fd.get("asOf") || TODAY,
        src: s ? s.id : null, loc: "Added by you", excerpt: ex || "No passage given.", dedup: 1 };
      FACTS.unshift(f);
      if (!f.owner) markOutdated(f.cat, f.cust, "A new fact arrived for this scope.");
      closeOverlay();
      state.f = { ...blankFilter(), cat: f.cat || "", cust: f.cust || "_cat" };
      go("facts"); toast(`Fact added · needs review${f.owner ? " · private to you" : ""}`);
    });
}

function addSourceModal() {
  openModal(`<header><h2>Add source</h2></header>
    <form>
      <p class="small muted">The file is quality-checked, chunked and mined into facts that need review.</p>
      <div class="field"><label for="u-name">File or link</label><input id="u-name" name="name" required placeholder="e.g. Brightmart JBP 2026-27.pptx or a SharePoint Sales Book link"></div>
      <div class="grid2"><div class="field"><label for="u-kind">Type</label><select id="u-kind" name="kind"><option>Deck</option><option>PDF</option><option>SharePoint Sales Book</option><option>Word document</option><option>Spreadsheet</option></select></div>
        <div class="field"><label for="u-sens">Sensitivity</label><select id="u-sens" name="sens"><option>internal</option><option>external</option><option>restricted</option></select></div></div>
      <div class="grid2"><div class="field"><label for="u-cat">Category</label><select id="u-cat" name="cat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="u-cust">Customer</label><select id="u-cust" name="cust"><option value="">Category level</option>${CUSTOMERS.map(c => `<option>${esc(c)}</option>`).join("")}</select></div></div>
      <p class="hint">Certified trade-panel numbers arrive through the data lane on a schedule. You don't upload them.</p>
      <div class="foot"><button type="button" class="btn plain" data-act="close">Cancel</button><button class="btn primary" type="submit">Start ingestion</button></div>
    </form>`, fd => {
      const s = { id: "S-" + (20 + SOURCES.length), name: fd.get("name"), kind: fd.get("kind"), lane: "Document", cat: fd.get("cat"), cust: fd.get("cust") || null, status: "processing", sens: fd.get("sens"), rel: fd.get("kind") === "SharePoint Sales Book" ? "stated" : "reviewed", asOf: "reading…", conf: "medium", facts: 0, stage: 0 };
      const run = { status: "Running", source: "upload · " + s.name, started: TODAY + " 14:05", indexed: 0, failed: 0 };
      SOURCES.unshift(s); RUNS.unshift(run);
      closeOverlay(); state.srcTab = "sources"; go("sources"); toast("Ingestion started");
      const t = setInterval(() => {
        s.stage++;
        if (s.stage >= STAGES.length) { clearInterval(t); s.status = "live"; s.asOf = "12 Sep 2026"; s.facts = 11; run.status = "Complete"; run.indexed = 11; markOutdated(s.cat, s.cust, "New facts arrived from a new source."); toast(`${s.name}: 11 facts mined, waiting for review`); }
        if ((state.view === "sources" || state.view === "home") && !$("#overlay").children.length) render();
      }, 650);
    });
}

function newProjectModal() {
  openModal(`<header><h2>New project</h2></header>
    <form>
      <p class="small muted">Set the scope once. Every tool in the project uses it.</p>
      <div class="field"><label for="np-name">Project name</label><input id="np-name" name="name" required placeholder="e.g. Brightmart spring premium aisle"></div>
      <div class="grid2"><div class="field"><label for="np-cust">Customer</label><select id="np-cust" name="cust">${CUSTOMERS.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
        <div class="field"><label for="np-cat">Category</label><select id="np-cat" name="cat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select></div></div>
      <div class="grid2"><div class="field"><label for="np-aud">Audience</label><select id="np-aud" name="aud"><option value="internal">Internal team</option><option value="external">Customer-facing</option></select></div>
        <div class="field"><label for="np-meet">Meeting date (optional)</label><input id="np-meet" name="meeting" placeholder="e.g. 05 Nov 2026"></div></div>
      <div class="field"><label for="np-obj">Objective</label><input id="np-obj" name="objective" placeholder="What should this project achieve?"></div>
      <div class="foot"><button type="button" class="btn plain" data-act="close">Cancel</button><button class="btn primary" type="submit">Create project</button></div>
    </form>`, fd => {
      const p = { id: "P-" + (PROJECTS.length + 1), name: fd.get("name").trim(), cust: fd.get("cust"), cat: fd.get("cat"), audience: fd.get("aud"), meeting: fd.get("meeting").trim() || null, buyer: null, objective: fd.get("objective").trim() || "No objective set yet.", decks: [], runs: [] };
      PROJECTS.unshift(p); closeOverlay(); state.project = p.id; go("project"); toast("Project created");
    });
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav) { closeOverlay(); go(nav.dataset.view); return; }
  const ft = e.target.closest("[data-ftype]");
  if (ft) { state.f.type = ft.dataset.ftype; render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.srcTab = tab.dataset.tab; render(); return; }
  const aud = e.target.closest("[data-aud]");
  if (aud) { readAskForm(); state.ask.audience = aud.dataset.aud; render(); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, p = proj(state.project);
  if (a === "close") { if (e.target === el || el.tagName === "BUTTON") closeOverlay(); return; }
  if (a === "add-fact") addFactModal();
  if (a === "add-source") addSourceModal();
  if (a === "new-project") newProjectModal();
  if (a === "open-project") { state.project = id; go("project"); }
  if (a === "open-fact") factDrawer(id);
  if (a === "open-source") sourceDrawer(id);
  if (a === "toast") toast(el.dataset.msg);
  if (a === "clear-filters") { state.f = blankFilter(); render(); }
  if (a === "cell") { state.f = { ...blankFilter(), cat: el.dataset.cat, cust: el.dataset.cust || "_cat" }; go("facts"); }
  if (a === "attention") { state.srcTab = "review"; go("sources"); }
  if (a === "todo") state.todo[+el.dataset.k]?.go();
  if (a === "pick-brief") { state.briefKey = el.dataset.key; render(); }
  if (a === "regen") { const b = BRIEFINGS.find(x => bkey(x) === el.dataset.key); b.status = "current"; b.generated = TODAY; delete b.why; render(); toast("Briefing rebuilt from the current fact set"); }
  if (a === "generate") { const [cat, cust] = el.dataset.key.split("|"); BRIEFINGS.push({ cat, cust: cust || null, status: "current", generated: TODAY }); state.briefKey = el.dataset.key; render(); toast("Briefing generated"); }
  if (a === "try") { Object.assign(state.ask, { q: el.dataset.q, cat: el.dataset.cat, cust: el.dataset.cust }); render(); }
  if (a === "open-proj-brief") { state.bf = { q: "", cat: p.cat, cust: p.cust }; state.briefKey = `${p.cat}|${p.cust}`; go("briefings"); }
  if (a === "proj-search") { Object.assign(state.ask, { cat: p.cat, cust: p.cust, audience: p.audience, q: `What should I bring to ${p.cust}?` }); go("search"); }
  if (a === "attach-buyer") { p.buyer = "Jordan Blake · category buyer"; render(); toast("Buyer attached"); }
  if (a === "go-review-facts") { state.f = { ...blankFilter(), cat: p.cat, cust: p.cust, status: "needs_review" }; go("facts"); }
  // Chat actions
  if (a === "say") userSays(p, el.dataset.text);
  if (a === "launch") {
    const T = { coach: `Run Selling Coach on my ${p.cust} deck`, story: `Build a storyline for ${p.cust}`, kb: `What do we know about ${p.cust}?` };
    userSays(p, T[el.dataset.tool]);
  }
  if (a === "cs-deck") runCoach(p, el.dataset.deck);
  if (a === "st-pick") pickOpp(p, +el.dataset.i);
  if (a === "st-approve") { lockOld(p); if (p.storyRun) { p.storyRun.status = "Approved"; } push(p, { who: "me", text: "Approve it." }); botReply(p, m => { m.html = `<p>Storyline approved and saved to <b>Recent runs</b>. You can reopen it from there, or ask me to review the deck once you've built the slides.</p>`; m.chips = [`Review my ${p.cust} deck`]; render(); }); }
  if (a === "st-refine") { const inp = $("#chat-in"); if (inp) { inp.value = "Make the tension sharper on "; inp.focus(); } }
  if (a === "verify" || a === "reject") {
    const f = fact(id);
    if (a === "verify") f.status = "verified"; else FACTS = FACTS.filter(x => x !== f);
    if (!f.owner) markOutdated(f.cat, f.cust, a === "verify" ? "A fact was verified." : "A fact was rejected.");
    render(); if (a === "verify") factDrawer(id); else closeOverlay();
    toast(a === "verify" ? "Verified. Tools can quote it where its sensitivity allows." : "Rejected. It will not be retrieved.");
  }
  if (a === "reclassify") {
    const s = src(id), v = $("#s-sens").value;
    s.sens = v; FACTS.filter(f => f.src === id).forEach(f => { f.sens = v; markOutdated(f.cat, f.cust, "A source it cites was reclassified."); });
    render(); sourceDrawer(id); toast(`Reclassified to ${v}: the source and its ${plural(s.facts, "fact", "facts")}`);
  }
  if (a === "retire") {
    const s = src(id); s.status = "retired";
    const hit = new Set();
    FACTS.filter(f => f.src === id).forEach(f => { BRIEFINGS.filter(b => sameScope(b, f.cat, f.cust)).forEach(b => hit.add(b)); markOutdated(f.cat, f.cust, "A source it cited was retired."); });
    closeOverlay(); render(); toast(`Retired. ${plural(s.facts, "fact", "facts")} removed from retrieval, ${plural(hit.size, "briefing", "briefings")} marked outdated`);
  }
  if (a === "resolve") {
    const r = REVIEW.find(x => x.id === id);
    if (r.fact && el.dataset.choice.startsWith("Approve")) { const f = fact(r.fact); f.status = "verified"; f.sens = "external"; markOutdated(f.cat, f.cust, "A quote was approved."); }
    REVIEW = REVIEW.filter(x => x.id !== id);
    render(); toast(`${r.kind}: ${el.dataset.choice}`);
  }
});
document.addEventListener("change", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { state.f[f.dataset.filter] = f.value; render(); return; }
  const b = e.target.closest("[data-bfilter]");
  if (b) { state.bf[b.dataset.bfilter] = b.value; render(); return; }
  if (e.target.matches("[data-pfilter]")) { state.pcust = e.target.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeOverlay();
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
});

render();
</script>
